<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement des testeurs — Tactizo</title>
<style>
  :root{ --bg:#0a0f1e; --panel:#131c33; --border:#26314f; --ink:#f4f7fc; --muted:#8b96b3; --green:#25C07D; --gold:#E7B84B; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1f6; --panel:#ffffff; --border:#e3e8f1; --ink:#161d2b; --muted:#69748c; --green:#1f9d54; --gold:#b9820f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px 18px 80px;}
  main{max-width:680px;margin:0 auto}
  h1{font-size:26px;margin:0 0 6px}
  .maj{color:var(--muted);font-size:14px;margin:0 0 26px}
  .rank{width:100%;border-collapse:separate;border-spacing:0 8px}
  .rank td{background:var(--panel);border:1px solid var(--border);padding:14px 16px;font-variant-numeric:tabular-nums}
  .rank tr td:first-child{border-radius:12px 0 0 12px;border-right:none;text-align:center;width:40px;font-weight:700;color:var(--muted)}
  .rank tr td:last-child{border-radius:0 12px 12px 0;border-left:none;text-align:right;font-weight:700;color:var(--green);white-space:nowrap}
  .rank tr td:nth-child(2){border-left:none;border-right:none;overflow:hidden;text-overflow:ellipsis}
  .rank tr.top1 td{border-color:var(--gold);background:linear-gradient(180deg,rgba(231,184,75,.12),transparent)}
  .nom{font-weight:600}
  .sub{font-size:12.5px;color:var(--muted);font-weight:500}
  .empty,.err{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
  .err{border-color:#c0392b;color:#e08a7d}
  .note{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--muted);margin-top:26px}
  a{color:var(--green)}
  .loading{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<main>

<h1>🏆 Classement des testeurs</h1>
<p class="maj">Qui a ramené le plus de joueurs sur Tactizo</p>

<div id="zone" class="loading">Chargement…</div>

<div class="note">
  Le montant indiqué correspond aux achats effectués par les joueurs inscrits avec le code de
  chaque testeur.
</div>

</main>
<script>
const SB_URL = "https://mdqmhrorpdyrsjsbawdl.supabase.co";
const SB_KEY = "sb_publishable_1xe1X9iIPahncWpQpRkrdg_Hw49QXO0";
const MEDALS = ["🥇","🥈","🥉"];

function euros(n){
  return (Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
}

async function charger(){
  const zone = document.getElementById("zone");
  try{
    const r = await fetch(SB_URL+"/rest/v1/rpc/public_promo_leaderboard", {
      method:"POST",
      headers:{ "apikey":SB_KEY, "Content-Type":"application/json" },
      body:"{}"
    });
    if(!r.ok) throw new Error("http_"+r.status);
    const rows = await r.json();

    if(!Array.isArray(rows) || rows.length===0){
      zone.innerHTML = '<div class="empty">Aucun testeur pour l\'instant.</div>';
      return;
    }

    const lignes = rows.map((row,i)=>{
      const rang = MEDALS[i] || (i+1);
      const cls = i===0 ? ' class="top1"' : '';
      const nb = Number(row.nb_redemptions)||0;
      return `<tr${cls}>
        <td>${rang}</td>
        <td><div class="nom">${escapeHtml(row.note)}</div><div class="sub">${nb} inscription${nb>1?'s':''}</div></td>
        <td>${euros(row.revenue)}</td>
      </tr>`;
    }).join("");

    zone.outerHTML = `<table class="rank" id="zone">${lignes}</table>`;
  }catch(e){
    zone.className = "err";
    zone.textContent = "Impossible de charger le classement pour le moment. Réessayez dans quelques instants.";
  }
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

charger();
</script>
</body>
</html>
