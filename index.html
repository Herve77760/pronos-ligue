async function startLeagueCore(lg){
  let o={}; try{o=JSON.parse(lg.gage)||{};}catch(e){}
  const mode=(o.mode==='simple')?'simple':'complet'; const enjeu=o.enjeu||'gage'; const soloAR=o.soloAR?(+o.soloAR):2;
  let ps=await q(db.from("players").select("*").eq("league_id",lg.id).order("join_order"));
  const soloNow=(ps.filter(p=>!p.is_ai).length===1);
  if(ps.length%2===1){ await q(db.from("players").insert({league_id:lg.id,name:"Joueur IA",emoji:"🤖",is_ai:true,join_order:ps.length}));
    ps=await q(db.from("players").select("*").eq("league_id",lg.id).order("join_order")); }
  const n=ps.length; let sched=makeSchedule(n);
  if(soloNow && soloAR===2) sched=sched.concat(sched);
  const rows=[]; sched.forEach((pairs,day)=>pairs.forEach(pr=>rows.push({league_id:lg.id,day,home_id:ps[pr[0]].id,away_id:ps[pr[1]].id,fixtures:null})));
  await q(db.from("duels").insert(rows));
  const both=(enjeu==="both");
  const tirer=e=>drawDiverse(itemPool(e,mode), 5);   // toujours 5 options variées (anti-doublon par catégorie)
  const options=tirer(both?"gage":enjeu); const optionsR=both?tirer("reward"):null;
  const votes={},voteTs={},bids={},bidTs={}; const votesR={},voteTsR={};
  for(const p of ps){ if(p.is_ai){ const ap=aiPrep(sched.length, mode, options.length, optionsR?optionsR.length:0);
    votes[p.id]=ap.vote; voteTs[p.id]=Date.now(); bids[p.id]=ap.bids; bidTs[p.id]=Date.now();
    if(both){ votesR[p.id]=ap.voteR; voteTsR[p.id]=Date.now(); }
    await q(db.from("players").update({shop_done:true}).eq("id",p.id)); } }
  const deadline=new Date(Date.now()+24*3600*1000).toISOString();
  const st={options,votes,voteTs,bids,bidTs,deadline,mode,enjeu};
  if(both){ st.optionsR=optionsR; st.votesR=votesR; st.voteTsR=voteTsR; }
  await q(db.from("leagues").update({status:"prep",num_days:sched.length,current_day:0,gage:JSON.stringify(st)}).eq("id",lg.id));
}
async function createLeague(){
  if(busy||!AUTH)return;
  if(!newLg){ openCreate(); return; }   // pas passé par l'écran de réglages → on l'ouvre
  let nm=(newLg.name||"").trim().replace(/\s+/g," ").slice(0,LEAGUE_NAME_MAX);
  if(!nm) nm=t("Ligue de {a}",{a:AUTH.name});
  const solo=(newLg.type==='solo');
  if(solo && !requireOpt('ia')) return;   // jouer seul vs IA = option premium (sécurité)
  busy=true; showErr("");
  try{
    // Le code est tiré par insertLeagueCodeUnique (qui réessaie en cas de doublon) : on lit ensuite
    // `lg.code`, jamais un code tiré ici — sinon on afficherait au joueur un code différent du sien.
    const mode = (newLg.mode==='complet' && hasOpt('bonuscomplets')) ? 'complet' : 'simple';
    const data = (newLg.data==='real' && hasOpt('direct')) ? 'real' : 'sim';
    const formula = (newLg.formula==='fast') ? 'fast' : 'classique';
    const st = { mode };                         // réglages figés stockés dans le JSON `gage`
    if(solo) st.soloAR = (newLg.soloAR===1?1:2);
    else {
      st.enjeu = newLg.enjeu||'gage';
      // Vote du gage ouvert dès le LOBBY (amis) → on tire les options tout de suite + maps de votes vides.
      const both=(st.enjeu==="both");
      st.options = drawItems(both?"gage":st.enjeu, mode);
      if(both) st.optionsR = drawItems("reward", mode);
      st.votes={}; st.voteTs={}; st.bids={}; st.bidTs={}; if(both){ st.votesR={}; st.voteTsR={}; }
    }
    const lg=await insertLeagueCodeUnique({name:nm,status:"lobby",num_participants:MAX_PLAYERS,num_days:0,formula,data_mode:data,gage:JSON.stringify(st)});
    const pl=await q(db.from("players").insert({league_id:lg.id,name:AUTH.name,emoji:AUTH.avatar||defaultAvatar(0),is_organizer:true,join_order:0,user_id:AUTH.id}).select().single());
    newLg=null;
    if(solo){ await startLeagueCore(lg); openLeague(lg.id, pl.id, true); }  // SOLO : démarre direct (pas de lobby)
    else { openLeague(lg.id, pl.id, true); leagueCreatedModal(lg.code); }
  }catch(e){ showErr("Création : "+e.message); } busy=false;
}
async function joinLeague(code){
  if(busy||!AUTH)return; busy=true; showErr("");
  try{
    const found=await q(db.from("leagues").select("*").eq("code",code));
    const lg=Array.isArray(found)?found[0]:found;
    if(!lg){ showErr(t("Code de ligue introuvable — vérifie le code saisi.")); busy=false; return; }
    const ps=await q(db.from("players").select("*").eq("league_id",lg.id).order("join_order"));
    const mine=ps.find(p=>p.user_id===AUTH.id);
    if(mine){ openLeague(lg.id, mine.id); busy=false; return; } // déjà membre → on rouvre (reconnexion)
    if(lg.status!=="lobby"){ showErr("Cette ligue a déjà démarré, tu ne peux plus la rejoindre."); busy=false; return; }
    const humans=ps.filter(p=>!p.is_ai);
    if(humans.length>=lg.num_participants){ showErr(t("Nombre de joueurs maximum atteint ({a}) — les inscriptions sont closes.",{a:lg.num_participants})); busy=false; return; }
    const ord=humans.length;
    const pl=await q(db.from("players").insert({league_id:lg.id,name:AUTH.name,emoji:AUTH.avatar||EMOJIS[ord]||"🎮",join_order:ord,user_id:AUTH.id}).select().single());
    openLeague(lg.id, pl.id, true);
  }catch(e){ showErr("Impossible de rejoindre : "+e.message); } busy=false;
}

/* ============ GAME dispatch ============ */
function viewGame(){
  if(!L) return `<div class="box">Chargement…</div>`;
  if(L.status==="lobby"||L.status==="prep") return viewPrepTabs();
  if(L.status==="starting") return `<div class="box" style="text-align:center"><div style="font-size:30px">🚀</div><b>Démarrage du championnat…</b><div class="mini muted" style="margin-top:6px">Attribution des bonus et lancement.</div></div>`;
  if(L.status==="resolving") return `<div class="box" style="text-align:center"><div style="font-size:30px">⚙️</div><b>Résolution de la journée…</b><div class="mini muted" style="margin-top:6px">Calcul des gains en cours.</div></div>`;
  // Ligue terminée → l'onglet Pronos annonce la fin de saison et RENVOIE au bilan (v7.23, demandé par
  // Hervé). Avant, il affichait le bilan lui-même : la barre du bas disait « ⚽ Pronos » alors que le
  // contenu était le classement final — c'est ce qui l'a fait chercher au mauvais endroit. Le bilan
  // n'a plus qu'un seul écran d'accueil, l'onglet 📊 Classt. Les résultats restent dans 📋 Résultats
  // (l'onglet Pronos ne montre jamais de résultats — choix Hervé).
  if(L.status==="done") return `<div class="box" style="text-align:center">
    <div style="font-size:34px">🏁</div>
    <b>${t("Saison terminée")}</b>
    <div class="mini muted" style="margin-top:6px">${t("Il n'y a plus de pronostics à saisir pour cette ligue.")}</div>
    <div style="height:12px"></div>
    <button class="btn" onclick="goStandings()">🏆 ${t("Voir le bilan de la saison")}</button>
    <div style="height:8px"></div>
    <button class="btn ghost" onclick="${resultsTabOnclick()}">📋 ${t("Revoir les résultats")}</button></div>`;
  // Anti-flash (D5) : après avoir consulté l'onglet Résultats (qui charge une journée passée dans
  // duels/bets), on ne montre PAS ces données périmées sur Pronos — on attend le rechargement.
  if(loadedDay!==L.current_day) return `<div class="box" style="text-align:center"><div style="font-size:24px">⏳</div><div class="mini muted" style="margin-top:6px">${t("Chargement de la journée…")}</div></div>`;
  // L'onglet « Pronos » va DIRECT à la journée (saisie / validés / après-clôture). Aucune info de
  // résultat ici. Le résumé d'ouverture (gage + enchères) vit dans l'onglet 🎬 Coulisses.
  return viewDay();
}

function prepSuperlatives(s){
  const auction=s.auction||[]; const ps=(s.players||[]);
  if(ps.length<2 || !auction.length) return '';
  const nm=pid=>{const p=ps.find(x=>x.pid===pid)||{}; return avatarHTML(p.emoji)+' '+esc(p.name||'?');};
  const st={}; ps.forEach(p=>st[p.pid]={bids:0,total:0,won:0,maxBid:0,maxCard:null});
  auction.forEach(a=>{ (a.bids||[]).forEach(bd=>{ const x=st[bd.pid]; if(x&&bd.amt>0){ x.bids++; x.total+=bd.amt; if(bd.amt>x.maxBid){x.maxBid=bd.amt;x.maxCard=a.card;} } }); if(st[a.winner]) st[a.winner].won++; });
  const bidders=ps.filter(p=>st[p.pid].bids>0);
  if(bidders.length<2) return '';
  const best=(arr,fn)=>arr.slice().sort(fn)[0];
  // choix d'une formulation stable par ligue (varie d'une ligue à l'autre, fixe quand on rouvre les coulisses)
  const seed=k=>{ let h=0; const s=((L&&L.id)||'')+k; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
  const pickV=(arr,k)=>arr[seed(k)%arr.length];
  const items=[];
  const strat=best(bidders,(a,b)=> st[b.pid].won-st[a.pid].won || (st[b.pid].won/st[b.pid].bids)-(st[a.pid].won/st[a.pid].bids));
  if(strat && st[strat.pid].won>0){ const N=nm(strat.pid), w=st[strat.pid].won, b=st[strat.pid].bids;
    items.push(pickV([
      t("🧠 <b>Le stratège :</b> {N} — a raflé <b>{w}</b> bonus sur {b} visé{s}. Chirurgical.",{N,w,b,s:b>1?'s':''}),
      t("🎯 <b>Le sniper des enchères :</b> {N} — {w} bonus décroché{w1} sur {b} tenté{s}. Redoutable.",{N,w,b,w1:w>1?'s':'',s:b>1?'s':''}),
      t("🧠 <b>Le cerveau :</b> {N} avait tout calculé — <b>{w}</b> bonus dans la poche. Personne n'a rien vu venir.",{N,w}),
      t("♟️ <b>Le tacticien :</b> {N} place ses pions et rafle <b>{w}</b> bonus. Échec et mat.",{N,w}),
      t("🎼 <b>Le maestro :</b> {N} a orchestré ses enchères — <b>{w}</b> bonus au tableau. Du grand art.",{N,w}),
      t("🕵️ <b>L'opportuniste :</b> {N} a flairé les bons coups : <b>{w}</b> bonus sur {b} tenté{s}.",{N,w,b,s:b>1?'s':''}),
      t("🎓 <b>Le calculateur :</b> {b} enchère{s}, <b>{w}</b> réussite{w1}. {N} a fait ses devoirs.",{N,w,b,s:b>1?'s':'',w1:w>1?'s':''}),
      t("🦈 <b>Le requin :</b> {N} a mordu <b>{w}</b> fois sur {b}. Les autres ont suivi le sang.",{N,w,b})
    ], strat.pid+'S')); }
  const poisse=best(bidders,(a,b)=> (st[b.pid].bids-st[b.pid].won)-(st[a.pid].bids-st[a.pid].won));
  if(poisse && (st[poisse.pid].bids-st[poisse.pid].won)>=1 && (!strat||poisse.pid!==strat.pid)){ const N=nm(poisse.pid), b=st[poisse.pid].bids, w=st[poisse.pid].won;
    items.push(pickV([
      t("😭 <b>La poisse :</b> {N} — a misé sur {b} bonus, repart avec <b>{w}</b>. Aïe aïe aïe.",{N,b,w}),
      t("🍀 <b>Pas de bol :</b> {N} a tenté {b} fois, remporté <b>{w}</b>. Ce n'était pas son jour.",{N,b,w}),
      t("😩 <b>Le malchanceux :</b> {b} enchères pour seulement <b>{w}</b> bonus. Dur dur, {N}.",{N,b,w}),
      t("🎭 <b>Le déçu du soir :</b> {N} visait gros ({b} bonus)… résultat : <b>{w}</b>. La vie est cruelle.",{N,b,w}),
      t("🌧️ <b>La guigne :</b> {N} — {b} tentatives, <b>{w}</b> bonus. Le ciel lui est tombé dessus.",{N,b,w}),
      t("👻 <b>Le fantôme des enchères :</b> {N} était partout — {b} mises — et repart avec <b>{w}</b>.",{N,b,w}),
      t("🙃 <b>Le mal inspiré :</b> {b} enchères, <b>{w}</b> bonus. {N} révisera ses calculs.",{N,b,w}),
      t("🥀 <b>Le perdant magnifique :</b> {N} a tout donné sur {b} bonus. Butin : <b>{w}</b>.",{N,b,w})
    ], poisse.pid+'P')); }
  const radin=best(bidders,(a,b)=> st[a.pid].total-st[b.pid].total);
  if(radin){ const N=nm(radin.pid), tot=st[radin.pid].total;
    items.push(pickV([
      t("🤏 <b>Le radin :</b> {N} — <b>{tot}€</b> lâchés en tout, pas un centime de plus.",{N,tot}),
      t("💰 <b>L'économe :</b> {N} a serré les cordons — <b>{tot}€</b> dépensés, point final.",{N,tot}),
      t("🐭 <b>Le prudent :</b> <b>{tot}€</b> misés par {N}. On ne se refait pas.",{N,tot}),
      t("🧊 <b>Le pingre :</b> {N} garde son magot — à peine <b>{tot}€</b> de mises.",{N,tot}),
      t("🔒 <b>Le coffre-fort :</b> {N} n'a lâché que <b>{tot}€</b>. Bien joué… ou pas.",{N,tot}),
      t("🐢 <b>Le frileux :</b> <b>{tot}€</b> au total pour {N}. La prudence a un prix.",{N,tot}),
      t("🧮 <b>Le comptable :</b> {N} a compté chaque euro — <b>{tot}€</b>, pas un de plus.",{N,tot}),
      t("🪙 <b>Le grippe-sou :</b> <b>{tot}€</b> de mises pour {N}. Le magot est intact.",{N,tot})
    ], radin.pid+'R')); }
  const fou=best(bidders,(a,b)=> st[b.pid].maxBid-st[a.pid].maxBid);
  if(fou && st[fou.pid].maxBid>0 && (!radin||fou.pid!==radin.pid)){ const N=nm(fou.pid), mb=st[fou.pid].maxBid, cl=CARDS[st[fou.pid].maxCard]?CARDS[st[fou.pid].maxCard].e+' '+esc(t(CARDS[st[fou.pid].maxCard].n)):t("un bonus");
    items.push(pickV([
      t("🤪 <b>Le plus fou :</b> {N} — <b>{mb}€</b> d'un coup sur {cl}. Le poker, ça le connaît.",{N,mb,cl}),
      t("🔥 <b>Le flambeur :</b> {N} a balancé <b>{mb}€</b> sur {cl}. Tout ou rien !",{N,mb,cl}),
      t("🎰 <b>Le parieur fou :</b> <b>{mb}€</b> d'un seul coup sur {cl} pour {N}. Respect (ou pas).",{N,mb,cl}),
      t("💸 <b>Le mégalo :</b> {N} claque <b>{mb}€</b> sur {cl}. Y'a pas de petites économies… sauf là.",{N,mb,cl}),
      t("🚀 <b>Le kamikaze :</b> {N} envoie <b>{mb}€</b> sur {cl}. Sans trembler.",{N,mb,cl}),
      t("🎪 <b>Le showman :</b> <b>{mb}€</b> sur {cl} — {N} aime le spectacle.",{N,mb,cl}),
      t("💥 <b>Le va-tout :</b> {N} pose <b>{mb}€</b> sur {cl}. On respire fort.",{N,mb,cl}),
      t("🐋 <b>La baleine :</b> {N} — <b>{mb}€</b> sur {cl}. Le marché a tremblé.",{N,mb,cl})
    ], fou.pid+'F')); }
  // Joueur(s) n'ayant misé sur AUCUN bonus (demandé par Hervé). Formulation neutre (ni « il » ni « elle »).
  const zero=ps.filter(p=>st[p.pid].bids===0);
  if(zero.length){ const noms=zero.map(p=>nm(p.pid));
    const N=(noms.length===1)?noms[0]:(noms.slice(0,-1).join(', ')+t(" et ")+noms[noms.length-1]);
    items.push(pickV((zero.length===1)?[
      t("🙈 <b>L'abstentionniste :</b> {N} n'a misé sur aucun bonus — pari sur le talent pur !",{N}),
      t("🧘 <b>Le zen :</b> {N} a snobé les enchères. Zéro bonus, 100 € intacts.",{N}),
      t("🎭 <b>Le puriste :</b> pas un euro de bonus pour {N} — rien que du flair.",{N}),
      t("🪙 <b>Le thésauriseur :</b> {N} garde ses 100 € : aucun bonus acheté.",{N})
    ]:[
      t("🙈 <b>Les abstentionnistes :</b> {N} n'ont misé sur aucun bonus — 100 € intacts pour chacun.",{N}),
      t("🧘 <b>Les zen :</b> {N} ont snobé les enchères. Pari sur le talent pur !",{N}),
      t("🪙 <b>Les prudents :</b> {N} gardent leurs 100 € — aucun bonus acheté.",{N})
    ],'Z'+zero.length)); }
  if(!items.length) return '';
  return `<h2>${t("🎭 Le mot des coulisses")}</h2><div class="box"><div class="mini" style="line-height:1.9">${items.join('<br>')}</div></div>`;
}
// Un tableau « si X gagne → tel gage » (ou « si X finit dernier → telle récompense »).
// `r` = true → la RÉCOMPENSE (bloc R) ; false → le bloc principal (le gage en mode "both").
function enjeuTableHTML(r){
  const s=L.prep_summary||{}; const both=(s.enjeu==="both");
  const rew = r ? true : (both ? false : (s.enjeu==="reward"));
  const opts  = (both&&r) ? (s.optionsR||[]) : (s.options||[]);
  const votes = (both&&r) ? (s.votesR||{})   : (s.voteMap||{});
  const custs = (both&&r) ? (s.customsR||{}) : (s.customs||{});
  const hs=(s.players||[]).filter(p=>!p.is_ai);
  const gOf=p=>{ const v=votes[p.pid]; if(v==="c") return {txt:custs[p.pid]||null, perso:true};
    const o=opts[v]; return {txt:o?((o.t)||o):null, perso:false}; };
  // NB : le texte perso d'un joueur ne passe PAS par t() — c'est du texte libre, pas une clé de traduction.
  const lbl=g=>`${g.txt?'<b>'+esc(g.perso?g.txt:t(g.txt))+'</b>':'<span class="muted">'+t("(pas de vote)")+'</span>'}${g.perso?' <span class="tag">'+t("perso")+'</span>':''}`;
  // Personne n'a voté à temps (ni gage, ni récompense selon le bloc) → pas d'enjeu : on ne promet pas
  // un gage/une récompense qui n'existent pas (signalé par Hervé, ligue 33K2E).
  const anyVote = hs.some(p=>gOf(p).txt!=null);
  if(!anyVote) return `<div class="box"><div class="mini muted">${rew
    ? t("🏆 <b>Récompense :</b> personne n'a voté de récompense à temps — il n'y en aura pas cette saison. On joue pour la gloire du classement !")
    : t("🎭 <b>Gage :</b> personne n'a voté de gage à temps — pas de gage cette saison. On joue pour l'honneur… et la <b>première place</b> !")}</div></div>`;
  // Tableau compact QUEL QUE SOIT l'effectif (choix d'Hervé après l'avoir vu à 8 joueurs). Il y
  // avait auparavant deux présentations — blocs empilés jusqu'à 5 joueurs, tableau au-delà — mais
  // le tableau se lit mieux dans tous les cas, et une seule mise en page vaut mieux que deux à
  // maintenir : la variante « blocs » n'était de fait jamais relue ni testée.
  const corps = `<div style="overflow-x:auto;margin-top:8px"><table>
        <tr><th>${rew?t("Si… finit dernier"):t("Si… gagne")}</th><th>${rew?t("Récompense qu'il offre au champion"):t("Gage infligé au dernier")}</th></tr>
        ${hs.map(p=>`<tr><td class="mini">${avaName(p)}</td><td class="mini">${lbl(gOf(p))}</td></tr>`).join("")}</table></div>`;
  return `<div class="box"><div class="mini muted">${rew?t("La <b>récompense</b> remise au champion est celle votée par le <b>dernier</b> 🥄 — celui qui choisit n'est jamais celui qui reçoit. Selon qui finit dernier :"):t("Le <b>gage</b> infligé au dernier est celui voté par le <b>vainqueur</b> 🏆 — celui qui choisit n'est jamais celui qui subit. Selon qui gagne :")}</div>
     ${corps}
     <div class="mini" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">${rew?t("🏆 <b>Motivation express :</b> le champion repart avec la récompense votée par le dernier — une excellente raison de viser la <b>première</b> place !"):t("😅 Vise la victoire… ou prépare-toi à faire le gage du gagnant si tu finis dernier !")}</div></div>`;
}
function prepSummaryBody(){
  const s=L.prep_summary||{}; const both=(s.enjeu==="both");
  const pName=pid=>{const p=(s.players||[]).find(x=>x.pid===pid)||{};return avatarHTML(p.emoji)+' '+esc(p.name||'?');};
  // Règle du pôle opposé : même présentation « si X … → … » dans tous les modes. En mode "both" on
  // affiche les DEUX tableaux (gage puis récompense). (L'ancien histogramme des votes du mode
  // récompense reste retiré : la majorité ne décide plus, l'afficher laisserait croire le contraire.)
  return `${isSolo()?'':`<h2>${t("🎭 L'enjeu du tournoi")}</h2>
   ${enjeuTableHTML(false)}${both?enjeuTableHTML(true):''}`}
   <h2>${t("🃏 Enchères — bonus attribués")}</h2>
   ${(s.auction||[]).length? (s.auction||[]).map(a=>`<div class="box"><div class="row"><div class="row" style="gap:10px"><span class="sport" title="${esc(t(CARDS[a.card].d))}">${CARDS[a.card].e}</span>
        <div><b title="${esc(t(CARDS[a.card].d))}">${esc(t(CARDS[a.card].n))}</b><div class="mini muted">${esc(t(CARDS[a.card].d))}</div></div></div>
        <div style="text-align:right;flex:0 0 auto"><div class="mini">→ <b>${pName(a.winner)}</b></div><div class="mini gold">${a.amount} €</div></div></div>

/* ============ SIGNALEMENT DE BUG ============
 * Le testeur copie un rapport et le colle où il veut (WhatsApp, SMS, mail). Choix d'Hervé
 * (2026-07-16) : PAS de mailto: — une adresse de destination serait écrite en dur dans index.html,
 * fichier PUBLIC sur GitHub → adresse perso exposée aux robots à spam. Et pas de capture d'écran
 * non plus : sur mobile c'est pénible, et le CONTEXTE TECHNIQUE vaut mieux qu'une image — c'est lui
 * qui permet d'aller lire la donnée réelle en base.
 */
// Le contexte technique de l'écran courant. C'est ça, la valeur du bouton.
function bugContext(kind){
  const idea=(kind==="idea");
  const l=[];
  l.push(idea ? "--- The Maestro League — idée / avis ---" : "--- The Maestro League — rapport de bug ---");
  l.push("Version : "+APP_VERSION);
  l.push("Quand   : "+new Date().toISOString());
  if(AUTH) l.push("Joueur  : "+(AUTH.name||"?")+"  (uid "+String(AUTH.id||"?").slice(0,8)+"…)");
  l.push("Écran   : "+(S.view||"?")+(S.editingBet?" (édition des pronos)":"")+(S.recap?" (récap)":""));
  // --- Diagnostic de MISE EN PAGE ---------------------------------------------------------
  // Un débordement horizontal signalé sur iPhone n'a jamais pu être reproduit sous Chrome. Sans
  // mesure, « ça déborde » n'est pas exploitable : ces lignes donnent la largeur réelle, le ZOOM
  // Safari (un pincement suffit à créer un défilement latéral) et l'élément fautif s'il y en a un.
  try{
    const de=document.documentElement;
    l.push("Fenêtre : "+window.innerWidth+"×"+window.innerHeight+" css · dpr "+(window.devicePixelRatio||1));
    const vv=window.visualViewport;
    if(vv) l.push("Zoom    : ×"+(Math.round((vv.scale||1)*100)/100)+" · zone visible "+Math.round(vv.width)+"px"+((vv.scale||1)>1.01?"  ⚠️ page zoomée":""));
    const trop=de.scrollWidth-de.clientWidth;
    l.push("Largeur : contenu "+de.scrollWidth+"px / fenêtre "+de.clientWidth+"px"+(trop>0?("  ⚠️ déborde de "+trop+"px"):"  (ok)"));
    if(trop>0){
      let pire=null, px=0;
      document.querySelectorAll(".app *").forEach(el=>{ const r=el.getBoundingClientRect();
        if(r.right>de.clientWidth+0.5 && r.right>px){ px=r.right; pire=el; } });
      if(pire) l.push("Coupable: <"+pire.tagName.toLowerCase()+" class=\""+(pire.className||"—")+"\"> va jusqu'à "+Math.round(px)+"px · « "+(pire.textContent||"").trim().slice(0,40).replace(/\s+/g," ")+" »");
    }
  }catch(e){ l.push("Largeur : (mesure impossible : "+e.message+")"); }
  // ---------------------------------------------------------------------------------------
  if(L){
    l.push("Ligue   : "+(L.name||"?")+"  · code "+(L.code||"?"));
    l.push("Statut  : "+(L.status||"?")+"  · journée "+((L.current_day|0)+1)+"/"+(L.num_days||"?"));
    l.push("Options : mode="+getMode()+" · enjeu="+getEnjeu()+" · données="+(L.data_mode||"sim")+" · formule="+(L.formula||"classique"));
    if(S.myId) l.push("player_id : "+S.myId);
    const d=(typeof myDuel==="function")?myDuel():null;
    if(d){ const o=pById(d.home_id===S.myId?d.away_id:d.home_id); l.push("Duel    : vs "+((o&&o.name)||"?")+"  · "+(d.home_id===S.myId?"à domicile":"à l'extérieur")+"  · "+((d.fixtures&&d.fixtures.length)?d.fixtures.length+" matchs choisis":"matchs pas encore choisis")); }
    const b=(typeof myBet==="function")?myBet():null;
    if(b) l.push("Mon pari : "+((b.picks&&b.picks.length)?b.picks.length+" pronos":"aucun prono")+(b.card&&b.card.id?" · carte "+b.card.id:"")+(b.net!=null?" · net "+b.net+"€":" · non résolu"));
  }
  l.push("Appareil : "+(navigator.userAgent||"?"));
  l.push("Écran    : "+(window.innerWidth||"?")+"×"+(window.innerHeight||"?"));
  // v6.98 : plus de lignes « Ce que je faisais : … » à compléter à la main. Ces questions sont
  // devenues les CHAMPS du formulaire (REPORT_FORM) ; `bugContext` ne produit plus que le
  // contexte technique, stocké tel quel dans la colonne `context`.
  return l.join("\n");
}
/* ---- REMONTÉES DES JOUEURS : bugs et idées (v6.98, demandé par Hervé) --------------------
   Avant : un pavé de texte à copier soi-même, puis à envoyer par ses propres moyens. Trois
   défauts — le joueur devait faire la démarche jusqu'au bout, la copie échouait EN SILENCE hors
   HTTPS, et rien n'était conservé : une remontée non transmise était perdue sans que personne
   ne le sache. Maintenant : un vrai formulaire, enregistré en base (source de vérité), puis une
   PROPOSITION d'alerte par mail. Si le mail n'est pas envoyé, la remontée existe quand même.
   ⚠️ L'envoi automatique d'un mail depuis une page statique demanderait soit une clé de service
   dans le navigateur (donc offerte à qui veut inonder la boîte), soit un bout de serveur. D'où
   ce montage : la base garantit qu'on ne perd rien, le mail n'est qu'une notification. */
const REPORT_MAIL="themaestroleagueapp@gmail.com";
// Le LIBELLÉ de chaque question est stocké AVEC la réponse (voir sendReport). Sans ça, une
// remontée d'il y a six mois deviendrait illisible dès qu'on reformule une question.
const REPORT_FORM={
  bug:[ {k:"faisais", q:"Que faisais-tu ?",                ph:"Ex. : je validais mes pronos de la journée 3",   req:true},
        {k:"attendu", q:"À quoi t'attendais-tu ?",         ph:"Ex. : revenir sur la page des résultats",        req:true},
        {k:"passe",   q:"Que s'est-il passé à la place ?", ph:"Ex. : la page est restée bloquée",               req:true} ],
  idea:[{k:"idee",    q:"Ton idée",                        ph:"Ex. : rejouer une ligue terminée à l'identique", req:true},
        {k:"pourquoi",q:"Pourquoi ce serait mieux ?",      ph:"Facultatif",                                     req:false} ]
};
const REPORT_MAX=2000;   // par champ — borne aussi appliquée côté base, où le client ne peut pas mentir
// Point d'entrée du bouton ✉️ : on choisit d'abord bug ou idée (même contexte technique joint).
function openBugReport(){
  infoModal("✉️", t("Envoyer un message"), `<div class="mini muted" style="text-align:left;margin-bottom:10px">${t("Que veux-tu envoyer ?")}</div>
     <div class="row" style="gap:8px">
       <button class="btn" style="flex:1" onclick="openReport('bug')">🐛 ${t("Un bug")}</button>
       <button class="btn ghost" style="flex:1" onclick="openReport('idea')">💡 ${t("Une idée")}</button>
     </div>`);
}
function openReport(kind){
  const idea=(kind==="idea");
  const champs=REPORT_FORM[kind]||REPORT_FORM.bug;
  const intro = idea
    ? t("Décris ton idée. Elle est <b>enregistrée</b> dès que tu valides — rien ne se perd.")
    : t("Réponds aux trois questions : c'est ce qui permet de retrouver le problème. Le rapport est <b>enregistré</b> dès que tu valides — rien ne se perd.");
  infoModal(idea?"💡":"🐛", idea?t("Proposer une idée"):t("Signaler un bug"),
    `<div class="mini muted" style="text-align:left">${intro}</div>
     <div style="height:10px"></div>
     ${champs.map(c=>`<div style="text-align:left;margin-bottom:9px">
        <label class="mini muted">${t(c.q)}${c.req?' <b style="color:var(--red)">*</b>':''}</label>
        <textarea id="rep_${c.k}" maxlength="${REPORT_MAX}" style="width:100%;height:${c.req?66:50}px;font:15px/1.4 inherit" placeholder="${esc(t(c.ph))}"></textarea>
      </div>`).join("")}
     <div id="repErr" class="mini" style="text-align:left;color:var(--red)"></div>
     <details style="margin:4px 0 12px;text-align:left"><summary class="mini muted clik">${t("Le contexte technique de ton écran est joint automatiquement — voir")}</summary>
       <textarea readonly style="width:100%;height:130px;font:12px/1.4 ui-monospace,monospace;margin-top:6px" onclick="this.select()">${esc(bugContext(kind))}</textarea></details>
     <div class="row" style="gap:8px">
       <button class="btn" style="flex:2 1 0;min-width:0" id="repSend" onclick="sendReport('${kind}')">${t("📨 Envoyer")}</button>
       <button class="btn ghost" style="flex:1 1 0;min-width:0" onclick="closeCardInfo()">${t("Annuler")}</button>
     </div>`, true);   // `true` = pas de bouton « OK 👍 » : sur un formulaire il rivalisait avec « Envoyer »
  // ⚠️ PIÈGE CSS (corrigé v7.03, signalé par Hervé sur iPhone) : `.btn` porte `width:100%`.
  // Dans une ligne flex, `flex:0 0 auto` sur un `.btn` (sans `.sm`, qui remet `width:auto`) donne
  // `flex-shrink:0` : le bouton garde ses 100 % et REFUSE de rétrécir, écrasant son voisin — ici
  // « Envoyer » était réduit à une colonne d'une lettre par ligne. Toujours poser `flex:N 1 0`
  // (base 0 + rétrécissement autorisé) sur DEUX `.btn` pleine largeur côte à côte.
}
// Texte lisible d'une remontée — sert au mail ET au repli si l'enregistrement échoue.
function reportText(kind, rep, num){
  const l=[];
  l.push((kind==="idea"?"--- The Maestro League — idée":"--- The Maestro League — bug")+(num?(" n° "+num):"")+" ---");
  rep.forEach(x=>{ l.push(""); l.push(x.q); l.push(x.a); });
  l.push(""); l.push(bugContext(kind));
  return l.join("\n");
}
async function sendReport(kind){
  const champs=REPORT_FORM[kind]||REPORT_FORM.bug;
  const rep=[]; let manque=null;
  for(const c of champs){
    const el=$("rep_"+c.k), v=((el&&el.value)||"").trim();
    if(c.req && !v){ if(!manque) manque=c; }
    if(v) rep.push({q:t(c.q), a:v.slice(0,REPORT_MAX)});
  }
  const err=$("repErr");
  if(manque){ if(err) err.textContent=t("⚠️ Merci de remplir : {a}",{a:t(manque.q)});
    const el=$("rep_"+manque.k); if(el) el.focus(); return; }
  const btn=$("repSend"); if(btn){ btn.disabled=true; btn.textContent=t("Envoi…"); }
  let num=null, echec=null;
  try{
    num=await q(db.rpc("submit_report",{ p_kind:kind, p_player_name:(AUTH&&AUTH.name)||null,
      p_league_code:(L&&L.code)||null, p_app_version:APP_VERSION, p_answers:rep, p_context:bugContext(kind) }));
  }catch(e){ echec=e.message||String(e); }
  const txt=reportText(kind, rep, num);
  if(echec!=null){
    // ⚠️ NE JAMAIS perdre ce que le joueur vient d'écrire. Si la base refuse (table absente,
    // réseau coupé), on lui rend son texte en entier plutôt qu'un message d'erreur sec.
    infoModal("📋", t("Enregistrement impossible"),

async function doCloseRegistration(){

      ps=await q(db.from("players").select("*").eq("league_id",L.id).order("join_order")); }

    if(soloNow && getSoloAR()===2) sched=sched.concat(sched);

    // on ne repart plus de zéro (sinon la clôture effaçait les votes du lobby). Lecture fraîche en base.
    let st; try{ const fr=await q(db.from("leagues").select("gage").eq("id",L.id).single()); st=JSON.parse(fr.gage)||{}; }catch(e){ st={}; }

    if(both && (!Array.isArray(st.optionsR)||!st.optionsR.length)) st.optionsR=drawItems("reward", mode);
    st.votes=st.votes||{}; st.voteTs=st.voteTs||{}; st.bids=st.bids||{}; st.bidTs=st.bidTs||{};
    if(both){ st.votesR=st.votesR||{}; st.voteTsR=st.voteTsR||{}; }

      st.votes[p.id]=ap.vote; st.voteTs[p.id]=Date.now(); st.bids[p.id]=ap.bids; st.bidTs[p.id]=Date.now();

}

function aiPrep(nDays, mode, optCount, optCountR){ const ids=modeCards(mode||"complet").slice(); for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  // Enchères des IA : elles VISENT plusieurs bonus et engagent une bonne part de leur budget, sinon
  // la vente aux enchères paraît morte (avant : souvent 1 seul petit bonus → IA passives, signalé par
  // Hervé). ~15 % d'IA « prudentes » ne misent presque rien, pour garder de la variété.
  const maxCards=Math.max(1,nDays);
  const frileux=Math.random()<0.05;                                   // rare minorité « prudente » (mais plus radine du tout)
  const nb=Math.min(maxCards, ids.length, frileux?(2+Math.floor(Math.random()*2)) : (3+Math.floor(Math.random()*4))); // frileux 2-3, sinon 3-6
  const budget=Math.round(frileux?rnd(16,26):rnd(30,SHOP_CAP));       // budget total engagé (plancher relevé)
  const bids={}; let spent=0;
  for(let k=0;k<nb;k++){ const id=ids[k]; const reste=budget-spent; if(reste<4) break;
    const bid=Math.min(Math.round(rnd(5,13)), reste); if(bid>=4){ bids[id]=bid; spent+=bid; } }
  // `voteR` : 2e vote (récompense), utilisé uniquement en mode "both" ; ignoré sinon.
  return {vote:Math.floor(Math.random()*(optCount||4)), voteR:Math.floor(Math.random()*(optCountR||optCount||4)), bids}; }

     <div class="row mini" style="margin-top:8px"><span class="muted">${t("Misé")} <b id="bt" class="${over?'red':''}">${Math.round(tot)}</b> € / ${SHOP_CAP} €</span><span class="muted"><b id="bc" class="${tooMany?'red':''}">${cnt}</b>/${maxCards} ${t("bonus")}</span></div>
     <div class="gauge ${over?'over':''}" id="bidGauge" style="margin-top:6px"><i style="width:${Math.min(100,tot/SHOP_CAP*100)}%"></i></div></div>
   ${ids.map(id=>`<div class="box row"><div class="row" style="gap:10px"><span class="sport">${CARDS[id].e}</span><div><div class="row" style="gap:6px;justify-content:flex-start;flex-wrap:wrap"><b>${esc(t(CARDS[id].n))}</b>${forceHTML(id)}${riskHTML(id)}</div><div class="mini muted" style="margin-top:2px">${esc(t(CARDS[id].d))}</div></div></div>
      <div style="text-align:right;flex:0 0 auto"><input type="number" inputmode="numeric" min="0" step="1" value="${bidL[id]||''}" placeholder="0 €" style="width:72px" oninput="setBid('${id}',this.value)"></div></div>`).join("")}
   <button class="btn" id="prepValidate" ${(over||tooMany||noVote)?'disabled':''} onclick="savePrep()">${noVote?(miss[0]==="reward"?t("🏆 Vote d'abord pour une récompense"):t("🎭 Vote d'abord pour un gage")):(over?t("Dépasse {a} €",{a:SHOP_CAP}):(tooMany?t("Trop de bonus (max {a})",{a:maxCards}):t("Valider ma préparation →")))}</button>

function showPrepStatusInfo(){ infoModal("📋", t("Statuts de préparation"),

   <b>🎭</b> ${t("vote du gage")} · <b>🏆</b> ${t("vote de la récompense (mode « les deux »)")} · <b>💰</b> ${t("enchères sur les bonus")}<br>

   <b>✅ ${t("prêt")}</b> — ${t("tout est validé (vote + enchères).")}<br>

function prepRosterHTML(lobby){ const org=me()&&me().is_organizer; const st=prepState();
  // 3 statuts (hors lobby) : ✅ validé (gage + enchères validés) · 📝 sauvegardé (a commencé mais pas
  // encore validé) · ⏳ pas commencé (n'a rien saisi). « Commencé » = a voté un gage OU posé une enchère.
  const started=p=>((st.votes&&st.votes[p.id]!=null)||(st.votesR&&st.votesR[p.id]!=null)||(st.bids&&st.bids[p.id]&&Object.keys(st.bids[p.id]).length>0));
  // Détail des votes : 🎭 gage (✓ voté / · à faire) et, en mode « both », 🏆 récompense. Permet de voir
  // qu'un joueur n'a voté QU'UN des deux et qu'il lui reste une action (signalé par Hervé).
  const voteBits=p=>{ const g=(st.votes&&st.votes[p.id]!=null), rw=(st.votesR&&st.votesR[p.id]!=null);
    return `🎭${g?'✓':'·'}`+(isBoth()?` 🏆${rw?'✓':'·'}`:''); };
  const voteComplete=p=>((st.votes&&st.votes[p.id]!=null) && (!isBoth() || (st.votesR&&st.votesR[p.id]!=null)));
  // Statut DÉTAILLÉ (hors lobby) : ✅ tout validé ; sinon 🎭/🏆 (votes) + 💰 (enchères, validées à la fin).
  const statusChip=p=>{
    if(p.shop_done) return `<span class="chip g clik" onclick="showPrepStatusInfo()" title="${t("Gage/récompense votés + enchères validées")}">${t("✅ prêt")}</span>`;
    if(!started(p)) return `<span class="chip clik" onclick="showPrepStatusInfo()">${t("⏳ pas commencé")}</span>`;
    return `<span class="chip b clik" onclick="showPrepStatusInfo()" title="${t("🎭 gage · 🏆 récompense · 💰 enchères — ✓ fait / · à faire")}">📝 ${voteBits(p)} 💰·</span>`;
  };
  return players.map(p=>{
    const canKick=(lobby&&org&&p.id!==S.myId&&!p.is_organizer);
    // Statut affiché pour TOUS (y compris les autres joueurs vus par l'organisateur) — pas seulement soi.
    const status = lobby
      ? (started(p)?`<span class="chip ${voteComplete(p)?'g':'b'} clik" onclick="showPrepStatusInfo()" title="${t("🎭 gage · 🏆 récompense — ✓ voté / · à faire")}">📝 ${voteBits(p)}</span>`:`<span class="chip clik" onclick="showPrepStatusInfo()">${t("inscrit")}</span>`)
      : statusChip(p);
    const kick = canKick?`<button class="btn ghost sm" title="${t("Retirer")}" onclick="kickPlayer('${p.id}')" style="flex:0 0 auto;padding:4px 8px">✕</button>`:'';
    // Nom + tags à gauche (s'enroulent dans leur zone, le nom ne se coupe pas) · statut + ✕ à droite.
    return `<div class="box row" style="align-items:center;gap:8px">
      <div class="row" style="gap:9px;flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-start">${avatarHTML(p.emoji)}<b style="white-space:nowrap">${esc(p.name)}</b>${p.is_organizer?' <span class="tag">'+t("organisateur")+'</span>':''}${p.is_ai?' <span class="tag">'+t("IA")+'</span>':''}${p.id===S.myId?' <span class="chip b">'+t("toi")+'</span>':''}</div>
      <span class="row" style="gap:6px;flex:0 0 auto">${status}${kick}</span></div>`;
  }).join(""); }

// Deux jeux d'enchères identiques ? Sert à savoir si une prépa DÉJÀ validée a été modifiée (→ re-valider).
function bidsSame(a,b){ const ka=Object.keys(a||{}).filter(k=>+a[k]>0), kb=Object.keys(b||{}).filter(k=>+b[k]>0);

// Les réglages FIGÉS de la ligue (une seule ligne par réglage : le choix retenu, pas les alternatives).

function prepParamsHTML(){ let o={}; try{o=JSON.parse(L.gage)||{};}catch(e){}

// Explication d'un réglage figé (clic sur une ligne de la page Infos).
function paramInfo(kind){
  let o={}; try{o=JSON.parse(L.gage)||{};}catch(e){}

  if(kind==='formula'){ const f=leagueFormula(); emoji="⏱️"; title=t(f.n); body=t(f.d)+"<br><br>"+t("💡 La vitesse (classique / fast) est le <b>seul</b> réglage que l'organisateur pourra encore changer, en cours de partie."); }

function viewPrepTabs(){

// (Capitaine et bonus ciblé sont toujours sur des matchs différents, donc pas de cumul ×4.)

  betFor=key;

  const tot=bet.picks.reduce((a,b)=>a+(+b.stake||0),0); const pct=Math.min(100,max>0?tot/max*100:0); const over=tot>max+0.001;

  // BONUS JOUÉ (v6.93, signalé par Hervé) : cet écran montrait le prono, la mise et le 👑 Capitaine,

  const mc=(mine&&mine.card&&mine.card.id&&CARDS[mine.card.id])?mine.card:null;
  const bonusBox = mc
    ? `<div class="box" style="border-color:var(--blue);background:rgba(90,166,224,.07)">

        <div class="cards" style="margin-top:5px"><div class="cardchip clik" onclick="showCardInfo('${mc.id}')"><span class="em">${CARDS[mc.id].e}</span>${esc(t(CARDS[mc.id].n))}</div></div>
        <div class="mini muted" style="margin-top:5px">${t("Touche la carte pour relire son effet. Ton adversaire ne la découvrira qu'aux résultats.")}</div></div>`
    : `<div class="box mini muted">${t("🃏 Aucun bonus joué cette journée.")}</div>`;
  const cards=md.fixtures.map((f,i)=>{ const mb=mine&&mine.picks&&mine.picks[i]; const ob=oppBet&&oppBet.picks&&oppBet.picks[i];
      // Carte À CIBLE : on la marque aussi sur le match visé (cardOnMatch gère les cartes à 2 cibles).
      const marque=cardOnMatch(mc,i)?` <span class="bem clik" onclick="event.stopPropagation();showCardInfo('${mc.id}')">${CARDS[mc.id].e}</span>`:'';
      const myTxt=mb?`${esc(lab(f,mb.sel))} · ${mb.stake}€${(mine.captain===i)?' 👑':''}${marque}`:'—';
      const opTxt=ob?(seeOpp?`${esc(lab(f,ob.sel))} · ${ob.stake}€${(oppBet.captain===i)?' 👑':''}`:`<span style="color:var(--muted);letter-spacing:2px">🔒 •••</span>`):'—';
      return `<div class="box"><div class="row" style="margin-bottom:6px"><span style="font-weight:800;font-size:13px">${esc(f.home)} – ${esc(f.away)}</span>${liveTag(f, mb?mb.sel:null)}</div>
        <div style="${GH}"><div><div class="mini muted" style="text-align:center;margin-bottom:2px">👤 ${t("Toi")}</div>${cell(true,myTxt)}</div><div><div class="mini muted" style="text-align:center;margin-bottom:2px">${avaName(opp)}</div>${cell(false,opTxt)}</div></div></div>`; }).join("");
  return noteBox+bonusBox+cards;
}

/* ============ RESOLUTION (cards engine) ============ */
function aiPlay(cap,fx,hand,day,numDays){
  const budget=cap*0.5*rnd(0.6,1); const ws=fx.map(()=>rnd(0.5,1.5)); const sw=ws.reduce((a,b)=>a+b,0);
  const picks=fx.map((f,i)=>{ const outs=f.draw?[["1",f.oh],["N",f.od],["2",f.oa]]:[["1",f.oh],["2",f.oa]]; outs.sort((a,b)=>a[1]-b[1]);
    // Souvent le favori (~70 %), mais pas toujours : sinon un OUTSIDER explicite (evite le « toujours favori »).
    const nonFav=outs.slice(1); const sel=(Math.random()<0.7||!nonFav.length)?outs[0][0]:pick(nonFav)[0]; return {sel,stake:Math.round(budget*ws[i]/sw)}; });
  const captain=Math.floor(Math.random()*fx.length);
  // Rythme des bonus : proba de jouer une carte ce jour ≈ cartes en main / journées restantes.
  // Une proba fixe (0,4) vidait la main dès le début (signalé par Hervé) : un lot de cartes partait
  // sur les premières journées. Ici l'usage s'étale — 3 cartes sur 14 journées ≈ une toutes les ~5.
  // À la DERNIÈRE journée, 🥷 Voleur / 🧬 Clone sont inutiles (aucune journée suivante pour jouer la prise) :
  // l'IA ne les joue pas — sinon elle « vole » une carte qu'elle ne pourra jamais utiliser (signalé par Hervé).
  const isLast=(day||0)>=((numDays||1)-1);
  const playable=isLast? (hand||[]).filter(id=>id!=="voleur"&&id!=="clone") : (hand||[]);
  const nCards=playable.length;
  const remain=Math.max(1,((numDays||1)-(day||0)));   // journée en cours incluse (day est 0-indexé)
  const pPlay=nCards>0?Math.min(0.9,nCards/remain):0;  // plafond 0,9 : garde un grain d'aléa
  let card=null; if(nCards&&Math.random()<pPlay){ const id=pick(playable); card={id,target:CARDS[id].t?Math.floor(Math.random()*fx.length):null};
    if(card.id==="chance"){ const drawIdx=fx.map((f,idx)=>f.draw?idx:-1).filter(x=>x>=0); if(drawIdx.length){ card.target=pick(drawIdx); const opts=["1","N","2"].filter(v=>v!==picks[card.target].sel); card.sel2=pick(opts); } else { card=null; } }
    else if(card.id==="dbl"){ const idxs=fx.map((f,idx)=>idx); for(let k=idxs.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[idxs[k],idxs[j]]=[idxs[j],idxs[k]];} if(idxs.length>=2){card.target=idxs[0];card.target2=idxs[1];} else card=null; } }
  return {picks,captain,card};
}
// Moteur pur : calcule les gains nets du jour à partir des plays (déterministe via pd.rnd).
function runEngine(pdIn, capStart, dz, N){
  const PD=JSON.parse(JSON.stringify(pdIn));
  // Phase 0 : 🥷 Voleur puis 🧬 Clone — les deux seules cartes qui agissent sur la CARTE adverse
  // et non sur ses paris. L'ordre est imposé : le vol fait DISPARAÎTRE la carte, le clone ne lit
  // ensuite que ce qui a survécu (il se retrouve donc face à rien si sa carte source a été volée).
  const stolen={}, cloned={};
  for(const pid in PD){ const pd=PD[pid];
    if(!(pd.card&&pd.card.id==="voleur")) continue;
    const opp=PD[pd.oppId]; if(!(opp&&opp.card&&opp.card.id)) continue;
    // Carte visant un match ANNULÉ : la règle existante la REND à son propriétaire (elle reste en
    // main). On ne peut donc pas la voler, sinon elle existerait en double — dans sa main ET dans
    // celle du voleur — ce qui casserait l'unicité d'un bonus dans la ligue.
    const ofx=opp.fx||[]; const annule=i=>(i!=null&&ofx[i]&&ofx[i].canceled);
    if(annule(opp.card.target)||annule(opp.card.target2)) continue;
    stolen[pid]=opp.card.id; opp.card=null; }
  for(const pid in PD){ const pd=PD[pid];
    if(!(pd.card&&pd.card.id==="clone")) continue;
    const src=PD[pd.oppId]&&PD[pd.oppId].card;
    // Un clone ne copie jamais un vol (règle : sinon aller-retour de cartes illisible au récap).
    // Ni un clone — impossible de toute façon, chaque bonus étant UNIQUE dans une ligue : filet.
    if(src&&src.id&&src.id!=="voleur"&&src.id!=="clone"){ const {impact,flip,...c}=src; pd.card={...c}; cloned[pid]=src.id; }
    // sinon : clone gâché, sa carte reste "clone" — aucune phase ne réagit à cet id.
  }
  // Phase 1 : Chérie c'est cadeau (inverse le pari adverse du match CIBLÉ)
  for(const pid in PD){ const pd=PD[pid]; if(pd.card&&pd.card.id==="cadeau"&&pd.card.target!=null){ const opp=PD[pd.oppId]; const i=pd.card.target;
    if(opp&&opp.picks[i]){ if(opp.picks[i].sel==="1")opp.picks[i].sel="2"; else if(opp.picks[i].sel==="2")opp.picks[i].sel="1"; } } }
  // Phase 2 : règlement pari par pari
  const G={};
  for(const pid in PD){ const pd=PD[pid]; const perBet=[]; let net=0,bestOdd=0;
    pd.picks.forEach((b,i)=>{ const f=pd.fx[i]; const cc=pd.card;
      // Match ANNULÉ : mise rendue → gain 0, pas de perte, aucun effet de carte ni de Capitaine.
      // On empile quand même une entrée pour garder l'alignement des index (Coup Double, Miroir…).
      if(f&&f.canceled){ perBet.push({gain:0,win:false,odd:1,canceled:true}); return; }
      const isDC=cc&&cc.id==="chance"&&cc.target===i&&cc.sel2;
      const win = isDC ? (f.res===b.sel||f.res===cc.sel2) : (b.sel===f.res);
      const odd = isDC ? dcWinOdd(f,b.sel,cc.sel2) : oddOf(f,b.sel);
      let g=win?(+b.stake)*(odd-1):-(+b.stake); if(i===pd.captain) g*=2;
      if(cc&&cc.target===i){ if(cc.id==="double"&&win)g*=2; if(cc.id==="tout")g*=(win?3:2); if(cc.id==="assurance"&&!win)g=0; if(cc.id==="joker")g*=2; }
      if(win&&odd>bestOdd) bestOdd=odd; perBet.push({gain:g,win,odd}); net+=g; });
    G[pid]={perBet,net,bestOdd,bonus:0}; }
  // Phase 2b : Coup Double — combiné GRATUIT et SANS RISQUE sur 2 matchs (Capitaine autorisé). Bonus purement additif :
  // si les 2 pronos passent, on ajoute (mise moyenne × DBL_FACTOR) × (cote combinée − 1). Sinon rien. Les 2 matchs gardent leur règlement individuel normal.
  for(const pid in PD){ const pd=PD[pid]; const c=pd.card;
    if(c&&c.id==="dbl"&&c.target!=null&&c.target2!=null&&c.target!==c.target2){ const g=G[pid]; const bi=g.perBet[c.target], bj=g.perBet[c.target2];
      if(bi&&bj&&bi.win&&bj.win){ const sI=+pd.picks[c.target].stake||0, sJ=+pd.picks[c.target2].stake||0; const sAvg=(sI+sJ)/2*DBL_FACTOR; const O=bi.odd*bj.odd;
        g.bonus += sAvg*(O-1); if(O>g.bestOdd) g.bestOdd=O; } } }
  // Phase 3 : Dans ta face puis Miroir
  for(const pid in PD){ const pd=PD[pid]; if(pd.card&&pd.card.id==="face"&&pd.card.target!=null){ const opp=G[pd.oppId];
    if(opp && opp.perBet[pd.card.target]){ const b=opp.perBet[pd.card.target]; if(b.win && b.gain>0){ const cut=b.gain/2; b.gain-=cut; opp.net-=cut; } } } }
  for(const d of dz){ const a=d.home_id,b=d.away_id; if(!PD[a]||!PD[b])continue; const useM=(PD[a].card&&PD[a].card.id==="miroir")||(PD[b].card&&PD[b].card.id==="miroir");
    if(useM){ const best=g=>{let bi=-1,bv=0; g.perBet.forEach((x,i)=>{if(x.gain>bv){bv=x.gain;bi=i;}}); return {bi,bv};};
      const ba=best(G[a]), bb=best(G[b]);
      // GARDE-FOU : l'échange n'a de sens que si les DEUX joueurs ont un pari gagnant.
      // Sinon (adversaire absent, ou qui rate TOUS ses pronos) il n'existe aucune case où
      // déposer le gain de l'autre : l'ancien code appliquait quand même le `-va` au joueur
      // et sautait le `+va` de l'adversaire (bi=-1) → le joueur perdait son meilleur pari et
      // l'argent s'ÉVAPORAIT au lieu d'être échangé. Mesuré : −24 € face à un absent.
      // Désormais : carte gâchée mais inoffensive, comme les autres cartes anti-adversaire.
      // Le pari du joueur reste entier : « mon adversaire va-t-il gagner plus que moi ? »
      if(ba.bi>=0 && bb.bi>=0){ const va=ba.bv, vb=bb.bv;
        G[a].perBet[ba.bi].gain+=(vb-va); G[a].net+=(vb-va);
        G[b].perBet[bb.bi].gain+=(va-vb); G[b].net+=(va-vb); } } }
  // Phase 4 : Sniper, Roi de la cote
  for(const pid in PD){ const pd=PD[pid]; const g=G[pid];
    if(pd.card&&pd.card.id==="sniper"&&pd.card.target!=null){ let bi=-1,bv=-1e9; g.perBet.forEach((x,i)=>{if(x.gain>bv){bv=x.gain;bi=i;}}); if(bi===pd.card.target&&g.perBet[bi].gain>0) g.bonus+=capStart[pid]*0.10; }
    if(pd.card&&pd.card.id==="roi"){ if(g.perBet.some(x=>x.win&&x.odd>=2.0)) g.bonus+=capStart[pid]*0.10; } }
  // Phase 5 : Gourmand, Sangsue, Serge Benamou
  for(const pid in PD){ const pd=PD[pid]; if(pd.card&&pd.card.id==="gourmand"){ const opp=G[pd.oppId]; if(opp){ const on=opp.net+opp.bonus; if(on>0) G[pid].bonus+=0.2*on; } } }
  // 🩸 Sangsue — les DEUX ponctions se calculent sur les nets de DÉPART, puis s'appliquent ensemble.
  // Deux Sangsue peuvent désormais se croiser (via 🧬 Clone). En siphonnant au fil de la boucle, le
  // second prenait 15 % d'un net déjà amputé ET GONFLÉ du butin du premier — l'argent volé était volé
  // une seconde fois — et le résultat dépendait de l'ordre des clés de l'objet, un hasard technique :
  // deux joueurs à +100 € finissaient 97,75 / 102,25 selon qui passait en premier, au lieu de 100/100.
  const leech=[];
  for(const pid in PD){ const pd=PD[pid]; if(pd.card&&pd.card.id==="sangsue"){ const opp=G[pd.oppId];
    if(opp){ const on=opp.net+opp.bonus; if(on>0) leech.push({pid, oppId:pd.oppId, amt:0.15*on}); } } }
  leech.forEach(x=>{ G[x.pid].bonus+=x.amt; G[x.oppId].bonus-=x.amt; });
  // Serge Benamou : si le joueur qui l'a jouée finit dans le vert, il partage 10 % de SON net avec tous les autres.
  // Phase 6 : Parachute (amortit 30 % de la perte nette du jour)
  for(const pid in PD){ const pd=PD[pid]; if(pd.card&&pd.card.id==="parachute"){ const cur=G[pid].net+G[pid].bonus; if(cur<0) G[pid].bonus += (-0.3*cur); } }
  // Phase 7 : ✂️ Demi-portion — divise par 2 le résultat TOTAL de la journée de l'adversaire (double
  // tranchant : réduit un gain… mais aussi une perte). Calculé sur les totaux AVANT réduction (comme
  // Sangsue), appliqué ensemble → deux Demi-portion croisées se répondent proprement.
  const halves=[];
  for(const pid in PD){ const pd=PD[pid]; if(pd.card&&pd.card.id==="moitie"){ const opp=G[pd.oppId]; if(opp) halves.push({oppId:pd.oppId, cut:(opp.net+opp.bonus)*0.5}); } }
  halves.forEach(x=>{ G[x.oppId].bonus -= x.cut; });   // total − total/2 = total/2 (positif comme négatif)
  const dayNet={},dayBest={},dayWins={}; for(const pid in G){ dayNet[pid]=Math.round((G[pid].net+G[pid].bonus)*100)/100; dayBest[pid]=G[pid].bestOdd; dayWins[pid]=G[pid].perBet.filter(x=>x.win).length; }
  return {dayNet,dayBest,dayWins,stolen,cloned};
}
async function resolveDay(){
  if(resolving)return; resolving=true; showErr("");
  try{
    const D=L.current_day;
    // verrou atomique : un seul client résout la journée (auto-avancement)

      if(oppCard&&oppCard.id==="face"&&oppCard.target===i&&win&&g>0){ g=g/2; parts.push('🤛 ÷2'); }

/* ============ STANDINGS ============ */
// Comparateur du classement. v2 (demande d'Hervé) : points → cagnotte → [confrontations directes,
// appliquées à part, voir classe()] → plus gros gain → plus grosse cote. Le total des victoires en
// duel a été retiré du départage. Les ligues antérieures gardent leur ordre d'origine.
function cmpV(v2){ return (a,b)=> b.points-a.points || b.capital-a.capital
  || (v2?0:(b.duel_wins-a.duel_wins)) || b.best_day-a.best_day || b.best_odd-a.best_odd; }
function cmp(a,b){ return cmpV(isScoring2())(a,b); }
// Classement complet. Les confrontations directes ne sont VOLONTAIREMENT pas dans le comparateur :
// elles ne sont pas transitives (A bat B, B bat C, C bat A) et Array.sort avec un comparateur
// incohérent peut renvoyer un ordre arbitraire — y compris pour des joueurs qui n'étaient pas à
// égalité. On trie donc avec un comparateur sûr, puis on réordonne CHAQUE groupe à égalité de
// points ET de cagnotte par un mini-championnat entre ses membres (points marqués dans leurs
// face-à-face). Un cycle A>B>C>A donne des scores égaux et retombe sur le plus gros gain.
function classe(arr,lg){
  const v2=isScoring2(lg);
  const out=[...arr].sort(cmpV(v2));
  const lid=lg?lg.id:(L?L.id:null);
  const h=(v2 && STAND_H2H && STAND_H2H_LG && STAND_H2H_LG===lid) ? STAND_H2H : null;
  if(!h) return out; // pas d'historique chargé → on s'en tient au tri sûr
  const res=[];
  for(let i=0;i<out.length;){
    let j=i;
    while(j+1<out.length && out[j+1].points===out[i].points && out[j+1].capital===out[i].capital) j++;
    if(j>i){
      const grp=out.slice(i,j+1); const sc={};
      grp.forEach(p=>{ sc[p.id]=0; grp.forEach(q=>{ if(q.id!==p.id) sc[p.id]+=(h[p.id+'|'+q.id]||0); }); });
      grp.sort((a,b)=> (sc[b.id]-sc[a.id]) || (b.best_day-a.best_day) || (b.best_odd-a.best_odd));
      res.push(...grp);
    } else res.push(out[i]);
    i=j+1;
  }
  return res;
}
// Reconstruit l'historique du classement (état cumulé APRÈS chaque journée résolue) en rejouant les résultats stockés.
function computeStandHist(){
  if(!chartBets || !standDuels) return [];
  const N = (L.status==="done" ? (L.num_days||0) : (L.current_day||0)); // journées résolues
  if(N<1) return [];
  const sp = L.prep_summary||{};
  const st={}; players.forEach(p=>{ const psx=(sp.players||[]).find(x=>x.pid===p.id); st[p.id]={points:0, capital: psx?psx.capital:100, duel_wins:0, best_day:0, best_odd:0, streak_w:0, streak_l:0, star:0}; });
  const betAt={}; chartBets.forEach(b=>{ betAt[b.day+'|'+b.player_id]=b; });
  const duelByDay={}; standDuels.forEach(d=>{ (duelByDay[d.day]=duelByDay[d.day]||[]).push(d); });
  const h2h={}; // confrontations directes, remplies au fil des duels ci-dessous
  // Rachats de bonus : le capital change de mains SANS être le gain de personne. Sans ce report,
  // la reconstruction diverge du capital réel. On range chaque transfert à la journée où il a été
  // accepté ; `day` absent (rachat antérieur à MIGRATION-trades-day.sql) → journée 0, ce qui garde
  // le TOTAL exact même si le point de départ sur la courbe est approximatif.
  const troc={}; // troc[jour][playerId] = variation de capital
  (standTrades||[]).forEach(tr=>{ const j=(tr.day!=null)?tr.day:0; const p=+tr.price||0; if(!p) return;
    // `kind` décide qui reçoit : à l'achat, la carte vient du destinataire, donc l'argent va à LUI.
    const recoit=(tr.kind==="sell")?tr.from_player:tr.to_player;
    const paye  =(tr.kind==="sell")?tr.to_player  :tr.from_player;
    troc[j]=troc[j]||{}; troc[j][recoit]=(troc[j][recoit]||0)+p; troc[j][paye]=(troc[j][paye]||0)-p; });
  const snaps=[];
  for(let d=0; d<N; d++){
    // AVANT les gains du jour : l'échange a lieu entre deux journées, donc il fait partie du
    // capital avec lequel on aborde celle-ci.
    if(troc[d]) Object.keys(troc[d]).forEach(pid=>{ if(st[pid]) st[pid].capital=Math.max(0,Math.round((st[pid].capital+troc[d][pid])*100)/100); });
    const dz=duelByDay[d]||[];
    const inDay=pid=>dz.some(du=>du.home_id===pid||du.away_id===pid);
    // oubli : humain présent ce jour-là sans pari valide (picks vides ou absents)

      leagues.push({id:lid,name:lg.name||'?',status:lg.status,created_at:lg.created_at,finished_at:lg.finished_at,
        compte,solo,rank,total,points:me.points||0,capital:me.capital||0,days,picks,won,hit:picks?Math.round(won/picks*100):0,
        staked:Math.round(staked),net,roi:staked?Math.round(net/staked*100):0,bestOdd,best,worst,favCard}); });
    // ---- Repère : les MÊMES calculs pour les autres joueurs humains de mes ligues. -------------
    // Sans repère, « ROI 12 % » ne veut rien dire : c'est excellent ou médiocre selon la table.
    // ⚠️ Le joueur IA est exclu (il joue automatiquement, ce n'est pas un adversaire de référence),
    // et moi aussi — sinon je me comparerais en partie à moi-même.
    let oPicks=0,oWon=0,oStaked=0,oNet=0,oPlayers=0;
    ids.forEach(lid=>{ const mp=myPid[lid];
      if(!alleeAuTerme(lgMap[lid]||{})) return;   // même filtre que mes totaux, sinon la comparaison serait biaisée
      (plsByLg[lid]||[]).forEach(p=>{ if(p.is_ai||p.id===mp) return;
        const bz=(betsByLg[lid]||[]).filter(b=>b.player_id===p.id); if(!bz.length) return;
        oPlayers++;
        bz.forEach(b=>{ const d=dlById[b.duel_id]; const fx=d&&d.fixtures;
          if(fx){ oPicks+=b.picks.length; oWon+=winCount(b,fx); }
          oStaked+=gainMise(b.picks,fx).mise; oNet+=(b.net!=null)?b.net:0; }); }); });
    // ---- Courbe du ROI, dans l'ordre où les journées ont été jouées. ---------------------------
    // ⚠️ Les paris ne portent PAS de date en base, seulement un numéro de journée : l'axe est donc
    // « au fil des journées jouées » (ligues classées par date de création), pas un axe calendaire.
    chrono.sort((a,b)=>a.t<b.t?-1:(a.t>b.t?1:0));
    const curve=[]; let cM=0,cN=0;
    chrono.forEach(x=>{ cM+=x.mise; cN+=x.net; curve.push(cM?Math.round(cN/cM*100):0); });
    leagues.sort((a,b)=>{ const fa=a.finished_at||a.created_at||'',fb=b.finished_at||b.created_at||''; return fa<fb?1:(fa>fb?-1:0); });
    // `leagues` = celles RETENUES dans les totaux (nbLigues), pas le nombre de lignes affichées :
    // la liste du bas montre aussi les ligues abandonnées, qui ne comptent nulle part ailleurs.
    myStatsData={ agg:{leagues:nbLigues, exclues:leagues.filter(l=>!l.compte).length, solos:leagues.filter(l=>l.solo&&l.compte).length,
      titles,podiums,picks:tPicks,won:tWon,hit:tPicks?Math.round(tWon/tPicks*100):0,
      staked:Math.round(tStaked),net:tNet,roi:tStaked?Math.round(tNet/tStaked*100):0,bestOdd:gBestOdd,best:gBest,
      avgWinOdd:nWinOdd?+(sumWinOdd/nWinOdd).toFixed(2):0,
      bestPick:(bestPick.g>-1e8)?bestPick:null, bigStake:(bigStake.st>=0)?bigStake:null,
      capExtra:Math.round(capExtra*100)/100, capCount, ptsPerDay:allDays?+(tPoints/allDays).toFixed(2):0,
      posDays, allDays, bestRun, buckets, bySport, byCard, curve,
      others:{players:oPlayers, hit:oPicks?Math.round(oWon/oPicks*100):null, roi:oStaked?Math.round(oNet/oStaked*100):null}},
      leagues, h2h };
  }catch(e){ myStatsData={error:e.message}; }
}

// Courbe du ROI en SVG écrit à la main : l'app tient en UN fichier, embarquer une bibliothèque de
// graphiques pèserait plus lourd que tout le reste. Les couleurs passent par les variables CSS,
// donc le thème clair comme le thème sombre restent lisibles sans code en double.
function sparkROI(curve){
  const pts=(curve||[]).filter(x=>isFinite(x));
  if(pts.length<2) return `<div class="mini muted">${t("La courbe apparaîtra après quelques journées jouées.")}</div>`;
  const W=300,H=76,P=6;
  let mn=Math.min(...pts,0), mx=Math.max(...pts,0); if(mx-mn<2) mx=mn+2;
  const X=i=>P+i*(W-2*P)/(pts.length-1), Y=v=>H-P-((v-mn)/(mx-mn))*(H-2*P);
  const d=pts.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const last=pts[pts.length-1], col=last>=0?"var(--green)":"var(--red)";
  const zero=(mn<0&&mx>0)?`<line x1="${P}" y1="${Y(0).toFixed(1)}" x2="${W-P}" y2="${Y(0).toFixed(1)}" stroke="var(--border)" stroke-dasharray="3 3" stroke-width="1"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="76" preserveAspectRatio="none" role="img" aria-label="${t("Évolution du ROI")}">
      ${zero}<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.5" fill="${col}"/></svg>
    <div class="row" style="justify-content:space-between"><span class="mini muted">${t("{a} journées",{a:pts.length})}</span><b class="mini ${last>=0?'green':'red'}">${last} %</b></div>`;
}

const CD_DISP='900 {s}px "Arial Black","Helvetica Neue",Arial,sans-serif';
const CD_SANS='{w} {s}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const CD_SERIF='italic {w} {s}px Georgia,"Times New Roman",serif';
const cdF=(tpl,s,w)=>tpl.replace("{s}",s).replace("{w}",w||700);
function cdRR(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
// Le dégradé doit couvrir la hauteur RÉELLE du texte, sinon l'or paraît plat.
function cdGold(c,y,size){ const g=c.createLinearGradient(0,y-size*0.78,0,y+size*0.18);
  g.addColorStop(0,CD_GOLD_HI); g.addColorStop(.46,CD_GOLD); g.addColorStop(1,CD_GOLD_DIM); return g; }
// Un chiffre NÉGATIF ne doit jamais être doré : doré = trophée, et un rendement de −27 %
// se lirait comme une performance.
function cdVal(c,y,size,neg){ if(!neg) return cdGold(c,y,size);
  const g=c.createLinearGradient(0,y-size*0.78,0,y+size*0.18);
  g.addColorStop(0,"#f4a29b"); g.addColorStop(.5,CD_RED); g.addColorStop(1,"#b8453c"); return g; }
// Réduit la police jusqu'à tenir : un pseudo ou un nom de ligue long ne doit jamais déborder.
function cdFit(c,txt,tpl,maxS,minS,maxW,w){ for(let s=maxS;s>=minS;s-=2){ c.font=cdF(tpl,s,w);
    if(c.measureText(txt).width<=maxW) return s; } c.font=cdF(tpl,minS,w); return minS; }
function cdEll(c,txt,maxW){ if(c.measureText(txt).width<=maxW) return txt; let s=txt;
  while(s.length>1 && c.measureText(s+"…").width>maxW) s=s.slice(0,-1); return s+"…"; }
// Avatar dessiné : data URI, donc même origine → le canvas reste exploitable.
// PHOTO importée : sans `crossOrigin` le navigateur l'affiche mais VERROUILLE le canvas, et
// `toBlob` échoue plus tard, au moment du partage. Supabase renvoie bien `Access-Control-Allow-Origin`
// (vérifié) → avec crossOrigin la carte reste générable. Au moindre souci on renvoie null et
// l'appelant retombe sur l'avatar dessiné : le partage n'est jamais bloqué par une photo.
function cdImg(src,cross){ return new Promise(res=>{ if(!src) return res(null);
  const img=new Image(); if(cross) img.crossOrigin="anonymous";
  img.onload=()=>res(img); img.onerror=()=>res(null);
  setTimeout(()=>res(null),8000); img.src=src; }); }

// Rassemble les VRAIES données de la ligue terminée.
async function seasonCardData(){
  const meP=me(); const s=myStats();
  const ord=classe(players.filter(p=>!p.is_ai));
  const rank=ord.findIndex(p=>p.id===S.myId)+1, total=ord.length;
  const d={ league:(L&&L.name)||"The Maestro League", name:(meP&&meP.name)||"?",
            rank, total, points:(meP?meP.points:0), capital:eur(meP?meP.capital:0),
            hit:s.hit, roi:s.roi, days:s.days, duelWins:(meP&&meP.duel_wins)||0, bestOdd:s.bestOdd,
            enjeux:[], highlight:null, avatar:null };
  // Enjeu final : 0 (solo), 1, ou 2 entrées en mode « gage ET récompense ».
  if(!isSolo()){
    const kinds=isBoth()?["gage","reward"]:[null];
    kinds.forEach(k=>{ const eo=enjeuOutcome(k);
      if(eo&&eo.ok&&eo.title&&eo.target) d.enjeux.push({rew:eo.rew, who:eo.target.name||"?",
        title:eo.perso?eo.title:t(eo.title)}); });
  }
  // Fait marquant, du plus flatteur au plus neutre. Le dernier maillon ne dépend que du nombre de
  // journées : il est TOUJOURS disponible, même pour une saison ratée → jamais de trou dans la carte.
  if(s.best && s.best.net>0) d.highlight={label:t("Meilleure journée"), value:fmt(s.best.net)+" € · "+t("journée {a}",{a:s.best.day+1})};
  else if(s.favCard && CARDS[s.favCard]) d.highlight={label:t("Carte fétiche"), value:CARDS[s.favCard].e+" "+t(CARDS[s.favCard].n)};
  else if(d.duelWins>0) d.highlight={label:t("Duels gagnés"), value:t("{a} sur {b} journées",{a:d.duelWins,b:d.days})};
  else if(d.bestOdd>0)  d.highlight={label:t("Plus grosse cote décrochée"), value:cote(d.bestOdd)};
  else if(d.days>0)     d.highlight={label:t("Saison complète"), value:t("{a} journées jouées jusqu'au bout",{a:d.days})};
  // Avatar : image importée (crossOrigin), avatar dessiné, ou emoji hérité.
  const av=(meP&&meP.emoji)||(AUTH&&AUTH.avatar)||"";
  if(/^https?:/.test(av))      d.avatar=await cdImg(av,true);
  else if(/^av:/.test(av))     d.avatar=await cdImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(avatarSvg(+av.slice(3)||0,320)),false);
  else if(av)                  d.emoji=av;
  return d;
}

function drawSeasonCard(cv,d){
  const c=cv.getContext("2d"), W=CARD_W, H=CARD_H;
  c.clearRect(0,0,W,H);
  const bg=c.createRadialGradient(W/2,-260,80,W/2,-260,1750);
  bg.addColorStop(0,"#17233f"); bg.addColorStop(.55,"#0b1220"); bg.addColorStop(1,"#070c16");
  c.fillStyle=bg; c.fillRect(0,0,W,H);
  const spot=c.createRadialGradient(W/2,40,0,W/2,40,760);
  spot.addColorStop(0,"rgba(231,184,75,.26)"); spot.addColorStop(.35,"rgba(231,184,75,.08)"); spot.addColorStop(1,"transparent");
  c.fillStyle=spot; c.fillRect(0,0,W,900);
  c.strokeStyle="rgba(139,147,168,.05)"; c.lineWidth=1;
  for(let yy=150;yy<H-330;yy+=68){ c.beginPath(); c.moveTo(70,yy); c.lineTo(W-70,yy); c.stroke(); }
  c.textAlign="center"; c.textBaseline="alphabetic";

  let y=140;
  c.font=cdF(CD_SANS,30,800); c.fillStyle=CD_GOLD; c.letterSpacing="7px";
  c.fillText(t("MA SAISON"),W/2,y); c.letterSpacing="0px";
  y+=76; cdFit(c,d.league,CD_SERIF,54,32,W-190,600);
  c.fillStyle=CD_CREAM; c.fillText(cdEll(c,d.league,W-190),W/2,y);
  y+=44; const rl=c.createLinearGradient(W/2-130,0,W/2+130,0);
  rl.addColorStop(0,"transparent"); rl.addColorStop(.5,CD_GOLD); rl.addColorStop(1,"transparent");
  c.fillStyle=rl; c.fillRect(W/2-130,y,260,5);

  y+=192; const R=116;
  const ring=c.createLinearGradient(W/2-R,y-R,W/2+R,y+R);
  ring.addColorStop(0,CD_GOLD_HI); ring.addColorStop(.5,CD_GOLD); ring.addColorStop(1,CD_GOLD_DIM);
  c.beginPath(); c.arc(W/2,y,R+11,0,7); c.fillStyle=ring; c.fill();
  c.beginPath(); c.arc(W/2,y,R,0,7); c.fillStyle="#1b2740"; c.fill();
  if(d.avatar){ c.save(); c.beginPath(); c.arc(W/2,y,R,0,7); c.clip();
    c.drawImage(d.avatar,W/2-R,y-R,R*2,R*2); c.restore(); }
  else { c.textBaseline="middle"; c.font=cdF(CD_DISP,d.emoji?130:104);
    c.fillStyle=d.emoji?"#fff":CD_GOLD_HI;
    c.fillText(d.emoji||(d.name||"?").slice(0,1).toUpperCase(),W/2,y+4); c.textBaseline="alphabetic"; }

  y+=R+86; cdFit(c,d.name,CD_SANS,64,34,W-180,800);
  c.fillStyle="#f2f4f9"; c.fillText(cdEll(c,d.name,W-180),W/2,y);

  y+=40;
  const champ=(d.rank===1), podium=(d.rank<=3&&d.total>3);
  const label=champ?t("CHAMPION"):t("{a}ᵉ sur {b}",{a:d.rank,b:d.total});
  const medal=champ?"🥇":(d.rank===2?"🥈":(d.rank===3?"🥉":""));
  const bh=champ?120:100, bw=champ?520:430, bx=W/2-bw/2;
  cdRR(c,bx,y,bw,bh,bh/2);
  if(champ){ const g=c.createLinearGradient(bx,y,bx,y+bh);
    g.addColorStop(0,CD_GOLD_HI); g.addColorStop(1,CD_GOLD); c.fillStyle=g;
    c.shadowColor="rgba(231,184,75,.45)"; c.shadowBlur=60; c.fill(); c.shadowBlur=0;
    c.font=cdF(CD_DISP,62); c.fillStyle="#12100a"; c.fillText(medal+" "+label,W/2,y+bh/2+22); }
  else { c.fillStyle="rgba(255,255,255,.05)"; c.fill();
    c.strokeStyle="rgba(231,184,75,.34)"; c.lineWidth=2; c.stroke();
    c.font=cdF(CD_SANS,48,800); c.fillStyle=podium?CD_GOLD_HI:"#dfe4ef";
    c.fillText((medal?medal+" ":"")+label,W/2,y+bh/2+17); }

  y+=bh+58;
  const cells=[[t("POINTS"),String(d.points),d.points<0],
               [t("CAGNOTTE"),d.capital+" €",false],
               [t("PRONOS RÉUSSIS"),d.hit+" %",false],
               [t("RENDEMENT"),(d.roi>0?"+":"")+d.roi+" %",d.roi<0]];
  const gp=20, cw=(W-160-gp)/2, ch=168;
  cells.forEach((cell,i)=>{ const x=80+(i%2)*(cw+gp), yy=y+Math.floor(i/2)*(ch+gp);
    cdRR(c,x,yy,cw,ch,26); c.fillStyle="rgba(255,255,255,.045)"; c.fill();
    c.strokeStyle="rgba(231,184,75,.20)"; c.lineWidth=2; c.stroke();
    c.font=cdF(CD_SANS,24,800); c.fillStyle=CD_MUTED; c.letterSpacing="2.5px";
    c.fillText(cdEll(c,cell[0],cw-30),x+cw/2,yy+52); c.letterSpacing="0px";
    const vs=cdFit(c,cell[1],CD_DISP,72,40,cw-46);
    c.fillStyle=cdVal(c,yy+128,vs,cell[2]); c.fillText(cell[1],x+cw/2,yy+128); });

  // ZONE BASSE — l'enjeu final d'abord : c'est la CHUTE de la saison, celle qui fait réagir le
  // groupe. Le fait marquant est un plus, il cède la place en mode « gage ET récompense ».
  const rows=[];
  (d.enjeux||[]).forEach(e=>rows.push({ label:(e.rew?"🏆 "+t("{a} REMPORTE",{a:e.who.toUpperCase()})
                                                 :"🎭 "+t("{a} DOIT",{a:e.who.toUpperCase()})),
    value:e.title, tone:e.rew?"gold":"red" }));
  if(rows.length<2 && d.highlight) rows.push({label:d.highlight.label, value:d.highlight.value, tone:"green"});
  const shown=rows.slice(0,2);
  const tH=250, tY=H-tH-72, tX=80, tW=W-160;
  const zTop=y+ch*2+gp+34, zBot=tY-34, rh=104, rgap=16;
  let ry=zTop+Math.max(0,(zBot-zTop-(shown.length*rh+(shown.length-1)*rgap))/2);
  const TONE={ gold:["rgba(231,184,75,.14)","rgba(231,184,75,.38)",CD_GOLD,"#f6ecd4"],
               red:["rgba(229,105,95,.13)","rgba(229,105,95,.36)","#f0a49d","#f8e6e4"],
               green:["rgba(34,169,113,.13)","rgba(63,224,160,.30)",CD_GREEN,"#eaf6f1"] };
  shown.forEach(r=>{ const T=TONE[r.tone];
    cdRR(c,80,ry,W-160,rh,24); c.fillStyle=T[0]; c.fill();
    c.strokeStyle=T[1]; c.lineWidth=2; c.stroke();
    c.font=cdF(CD_SANS,23,800); c.fillStyle=T[2]; c.letterSpacing="2px";
    c.fillText(cdEll(c,r.label.toUpperCase(),W-230),W/2,ry+42); c.letterSpacing="0px";
    cdFit(c,r.value,CD_SANS,36,23,W-230,700);
    c.fillStyle=T[3]; c.fillText(cdEll(c,r.value,W-230),W/2,ry+83); ry+=rh+rgap; });

  cdRR(c,tX,tY,tW,tH,34); c.fillStyle=CD_CREAM; c.fill();
  c.fillStyle="#080d18";
  c.beginPath(); c.arc(tX,tY+tH/2,26,0,7); c.fill();
  c.beginPath(); c.arc(tX+tW,tY+tH/2,26,0,7); c.fill();
  c.font=cdF(CD_SERIF,44,600); c.fillStyle="#6b6152"; c.fillText("The",W/2,tY+76);
  c.font=cdF(CD_DISP,74); c.letterSpacing="-1px";
  const wm=c.createLinearGradient(0,tY+92,0,tY+152);
  wm.addColorStop(0,"#2a2216"); wm.addColorStop(1,"#12100a"); c.fillStyle=wm;
  c.fillText("MAESTRO LEAGUE",W/2,tY+150); c.letterSpacing="0px";
  // ⚠️ URL de TEST. À remplacer par le lien de l'app (ou un QR code) le jour du vrai lancement.
  c.font=cdF(CD_SANS,30,600); c.fillStyle="#5c564a"; c.fillText(SHARE_URL,W/2,tY+206);
}
const SHARE_URL="herve77760.github.io/pronos-ligue";

// Produit le PNG. Renvoie null si quoi que ce soit échoue → l'appelant bascule sur le texte.
async function seasonCardBlob(){
  try{
    const d=await seasonCardData();
    const cv=document.createElement("canvas"); cv.width=CARD_W; cv.height=CARD_H;
    drawSeasonCard(cv,d);
    return await new Promise((res,rej)=>{ try{ cv.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png"); }catch(e){ rej(e); } });
  }catch(e){ return null; }
}

// Récap texte partageable — CONSERVÉ comme repli de l'image (et pour le copier-coller).
function seasonRecapText(){
  const s=myStats(); const meP=me(); const ord=classe(players.filter(p=>!p.is_ai));
  const rank=ord.findIndex(p=>p.id===S.myId)+1; const tot=ord.length; const l=[];
  l.push("🏆 "+t("Ma saison — {a}",{a:(L&&L.name)||"The Maestro League"}));
  if(rank>0) l.push(t("Classement : {a}ᵉ / {b}",{a:rank,b:tot}));
  if(meP) l.push(t("Points : {a} · Capital : {b} €",{a:meP.points,b:eur(meP.capital)}));
  if(s.days){ l.push(t("Pronos gagnés : {a}/{b} ({c} %)",{a:s.won,b:s.picks,c:s.hit}));
    l.push(t("ROI : {a} % · Meilleure journée : {b} €",{a:s.roi,b:fmt(s.best.net)}));
    if(s.favCard&&CARDS[s.favCard]) l.push(t("Carte fétiche : {a}",{a:CARDS[s.favCard].e+' '+t(CARDS[s.favCard].n)})); }
  l.push("— The Maestro League"); return l.join("\n"); }
// Aperçu D'ABORD (on voit ce qu'on partage), puis Partager (natif mobile) / Enregistrer / Copier.
// L'image est générée en tâche de fond : on ouvre tout de suite avec un texte d'attente, sinon
// l'écran resterait figé une seconde sans explication.
let seasonBlob=null, seasonBlobUrl=null;
function shareSeason(){   // gratuit (v6.65) — plus d'option premium requise
  const txt=seasonRecapText();
  infoModal("📤", t("Partager ma saison"),
    `<div id="cardWrap" class="mini muted" style="margin-bottom:10px">${t("Préparation de ta carte…")}</div>
     <div id="cardBtns"></div>
     <details style="margin-top:12px;text-align:left">
       <summary class="mini muted" style="cursor:pointer">${t("Version texte")}</summary>
       <textarea id="recapTxt" readonly onclick="this.select()" style="width:100%;box-sizing:border-box;height:130px;margin-top:6px;font:14px monospace;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:inherit">${esc(txt)}</textarea>
       <button class="btn ghost sm" style="margin-top:6px" onclick="copySeason()">📋 ${t("Copier le texte")}</button>
     </details>`);
  buildSeasonCard();
}
async function buildSeasonCard(){
  if(seasonBlobUrl){ URL.revokeObjectURL(seasonBlobUrl); seasonBlobUrl=null; }
  seasonBlob=await seasonCardBlob();
  const wrap=document.getElementById("cardWrap"), btns=document.getElementById("cardBtns");
  if(!wrap||!btns) return;                      // fenêtre déjà refermée
  if(!seasonBlob){                              // repli honnête : le texte reste partageable
    wrap.innerHTML=`<div class="mini muted">${t("Image indisponible sur cet appareil — le texte ci-dessous reste partageable.")}</div>`;
    btns.innerHTML=`<button class="btn" onclick="copySeason()">📋 ${t("Copier le texte")}</button>`; return; }
  seasonBlobUrl=URL.createObjectURL(seasonBlob);
  wrap.innerHTML=`<img src="${seasonBlobUrl}" alt="" style="width:100%;border-radius:12px;display:block">`;
  const f=new File([seasonBlob],"ma-saison.png",{type:"image/png"});
  const canFile=!!(navigator.canShare&&navigator.canShare({files:[f]}));
  btns.innerHTML=`<div class="row" style="gap:8px">
     ${canFile?`<button class="btn" style="flex:1" onclick="doShareSeason()">${t("Partager")}</button>`:''}
     <button class="btn ${canFile?'ghost':''}" style="flex:1" onclick="saveSeasonCard()">⬇️ ${t("Enregistrer")}</button></div>`;
}
// Partage natif : l'IMAGE d'abord (c'est elle qui a de l'allure dans un fil de discussion).
// Si l'appareil refuse les fichiers, on part sur le texte plutôt que de ne rien faire.
async function doShareSeason(){
  const txt=seasonRecapText();
  if(seasonBlob){ const f=new File([seasonBlob],"ma-saison.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f],text:txt}); return; }catch(e){ if(e&&e.name==="AbortError") return; } } }
  if(navigator.share){ try{ await navigator.share({text:txt}); }catch(e){} }
}
function saveSeasonCard(){ if(!seasonBlobUrl) return;
  const a=document.createElement("a"); a.href=seasonBlobUrl; a.download="ma-saison.png"; a.click();
  toast(t("Image enregistrée 📥")); }
async function copySeason(){ const txt=seasonRecapText();
  try{ await navigator.clipboard.writeText(txt); toast(t("Récap copié — colle-le où tu veux ! 📋")); }catch(e){ const el=document.getElementById("recapTxt"); if(el){ el.focus(); el.select(); } } }

// ⭐ CUMUL DU MEILLEUR PRONOSTIQUEUR sur les `nbJours` premières journées : meilleur net de la
// ligue chaque jour, les oublis exclus (picks vide), départage par ordre d'arrivée.
// ⚠️ Extrait en fonction en v7.18 pour être PARTAGÉ par le classement courant et le classement
// final : deux copies de la même règle finiraient par diverger (cf. recapitalisation, v7.16).
function starCumul(nbJours){
  const sc={}; players.forEach(p=>sc[p.id]=0);
  if(!chartBets) return sc;
  const byDay={}; chartBets.forEach(b=>{ if(b.day<nbJours){(byDay[b.day]=byDay[b.day]||[]).push(b);} });
  for(let d=0;d<nbJours;d++){ const arr=byDay[d]; if(!arr||!arr.length)continue; let best=null,bn=-1e9,bo=1e9;
    arr.forEach(b=>{ if(Array.isArray(b.picks)&&b.picks.length===0) return; const RR=Math.round((b.net||0)*100)/100;
      const pp=pById(b.player_id); const o=pp?(pp.join_order||0):0; if(RR>bn||(RR===bn&&o<bo)){bn=RR;best=b.player_id;bo=o;} });
    if(best!=null)sc[best]++; }
  return sc;
}
function viewStandings(){
  // Ligue terminée → l'onglet Classement EST l'écran de fin (vainqueur + classement final + bilan),
  // toujours accessible (avant, il n'était joignable que via l'onglet Pronos). Demandé par Hervé.
  // ⚠️ `!standHist` (v7.18) : le bilan reste l'écran par défaut d'une ligue terminée, mais on peut
  // désormais en sortir pour parcourir les journées et leurs flèches ▲▼. Tout le calcul le
  // permettait déjà (`R` gère le cas « done ») — seul ce renvoi anticipé le rendait inatteignable.
  if(L && L.status==="done" && !standHist) return viewEnd();
  const meP=me(); const hand=meP&&meP.hand?meP.hand:[]; const used=meP&&meP.cards_used?meP.cards_used:[];
  const humansLive=classe(players).filter(p=>!p.is_ai); const lastH=humansLive[humansLive.length-1];
  const R = (L.status==="done" ? (L.num_days||0) : (L.current_day||0)); // journées résolues
  const snaps = computeStandHist();
  const sc=starCumul(R);   // ⭐ cumul — voir starCumul(), partagé avec le classement final
  // journée sélectionnée (défaut = dernière résolue = classement actuel)
  let sd = (standDay==null)? R-1 : standDay; if(sd>R-1) sd=R-1; if(sd<0) sd=R-1;
  const useLive = R<1 || sd>=R-1 || !snaps[sd];
  const rows = useLive

      ${ord.map((p,i)=>{const bp=p.star||0; const dp=p.points-bp;
