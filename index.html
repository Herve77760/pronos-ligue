function capChart(){
  if(!chartBets) return '';
  const N=(L.status==="done"?(L.num_days||0):(L.current_day||0)); if(N<1) return '';
  const sp=L.prep_summary||{};
  const capAfter={}; players.forEach(p=>{ const psx=(sp.players||[]).find(x=>x.pid===p.id); capAfter[p.id]= psx?psx.capital:100; });
  const netByDay={}, legacyPen={};
  players.forEach(p=>{ netByDay[p.id]=Array(N).fill(0); legacyPen[p.id]=Array(N).fill(false); });
  // Oubli « ancienne donnée » (journée résolue avant la v4.03) : la pénalité −25 % n'est PAS dans `net`
  // → sans ça la courbe reste à plat alors que le capital a bien chuté. Depuis la v4.03, net la contient déjà.
  chartBets.forEach(b=>{ if(netByDay[b.player_id]==null || b.day>=N) return;
    netByDay[b.player_id][b.day]=b.net||0;
    legacyPen[b.player_id][b.day]=!!(Array.isArray(b.picks) && b.picks.length===0 && (b.net||0)===0); });
  // Rachats de bonus : capital déplacé sans être le gain de personne. Même report que dans
  // computeStandHist, sinon la courbe se termine sur un capital différent de celui affiché au
  // classement (écart constaté : ±5 €). `day` absent → journée 0 (rachat d'avant la migration).
  const trocC={};
  (standTrades||[]).forEach(tr=>{ const j=(tr.day!=null)?tr.day:0; const pr=+tr.price||0; if(!pr) return;
    const recoit=(tr.kind==="sell")?tr.from_player:tr.to_player;
    const paye  =(tr.kind==="sell")?tr.to_player  :tr.from_player;
    trocC[j]=trocC[j]||{}; trocC[j][recoit]=(trocC[j][recoit]||0)+pr; trocC[j][paye]=(trocC[j][paye]||0)-pr; });
  const series=players.map(p=>{ let v=capAfter[p.id]; const pts=[100,v];
    for(let d=0;d<N;d++){
      if(trocC[d]&&trocC[d][p.id]) v=Math.max(0,Math.round((v+trocC[d][p.id])*100)/100); // avant les gains du jour
      v=Math.max(0,v+(netByDay[p.id][d]||0));
      if(legacyPen[p.id][d]) v=Math.max(0,Math.round(v*(1-FORGOT_PENALTY)*100)/100);
      pts.push(v); } return {p,pts}; });
  const allv=series.flatMap(s=>s.pts); let mn=Math.min(...allv), mx=Math.max(...allv); if(!isFinite(mn)){mn=0;mx=100;}
  const pad=Math.max(5,(mx-mn)*0.12); const lo=Math.max(0,Math.floor((mn-pad)/10)*10), hi=Math.max(lo+10,Math.ceil((mx+pad)/10)*10);
  const labels=["100€",t("Bonus")]; for(let d=0;d<N;d++) labels.push("J"+(d+1));
  return lineChart(series, labels, t("📈 Évolution du capital (départ → bonus → chaque journée)"), lo, hi);
}
// Évolution des POINTS (le classement) — les points font le championnat, le capital n'est qu'un moyen.
// S'appuie sur les snapshots par journée de computeStandHist (mêmes règles que le classement : duel, ⭐, malus, oubli).
function ptsChart(){
  const snaps=computeStandHist(); if(!snaps.length) return '';
  const N=snaps.length;
  const series=players.map(p=>{ const pts=[0];
    for(let d=0;d<N;d++){ const s=snaps[d].find(x=>x.id===p.id); pts.push(s?s.points:0); } return {p,pts}; });
  const labels=[t("Départ")]; for(let d=0;d<N;d++) labels.push("J"+(d+1));
  const allv=series.flatMap(s=>s.pts);
  const lo=Math.floor(Math.min(0,...allv))-1, hi=Math.ceil(Math.max(1,...allv))+1; // les points peuvent être négatifs
  return lineChart(series, labels, t("📊 Évolution des points (classement)"), lo, hi);
}
// Rendu commun des courbes (capital / points). L'échelle (lo/hi) est fournie par l'appelant :
// le capital s'arrondit à la dizaine, les points sont des entiers pouvant être négatifs.
function lineChart(series, labels, title, lo, hi){
  const npts=labels.length;
  const W=480,H=210,PL=38,PR=10,PT=12,PB=26;
  const X=i=> PL + (W-PL-PR)*(npts<=1?0:i/(npts-1));
  const Y=v=> PT + (H-PT-PB)*(1-(v-lo)/((hi-lo)||1));
  const cols=["#4ade80","#60a5fa","#fbbf24","#f87171","#a78bfa","#f472b6","#22d3ee","#fb923c","#84cc16","#e879f9"];
  let grid=""; for(let k=0;k<=3;k++){ const gv=lo+(hi-lo)*k/3; const y=Y(gv); grid+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#242b38"/><text x="${PL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8b93a3">${Math.round(gv)}</text>`; }
  let xlab=""; labels.forEach((l,i)=>{ if(npts>9 && i>1 && i%2===0 && i!==npts-1) return; xlab+=`<text x="${X(i).toFixed(1)}" y="${H-PB+14}" text-anchor="middle" font-size="8.5" fill="#8b93a3">${esc(l)}</text>`; });
  const lines=series.map((s,si)=>{ const c=cols[si%cols.length]; const dpath=s.pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    const dots=s.pts.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2" fill="${c}"/>`).join('');
    return `<path d="${dpath}" fill="none" stroke="${c}" stroke-width="2"/>${dots}`; }).join('');
  const legend=series.map((s,si)=>`<span class="mini" style="margin-right:10px;white-space:nowrap"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cols[si%cols.length]};vertical-align:middle"></span> ${avatarHTML(s.p.emoji,14)} ${esc(s.p.name)}</span>`).join('');
  return `<div class="box"><div class="mini muted" style="margin-bottom:6px">${title}</div>
     <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto">${grid}${lines}${xlab}</svg></div>
     <div style="margin-top:6px;line-height:1.9">${legend}</div></div>`;
}
async function loadEndStats(){
  try{
    // (v7.21) La requête sur `duels`, ainsi que `betAt` et `duelByDay`, ont été SUPPRIMÉES : elles
    // ne servaient qu'au rejeu maison du championnat, remplacé par computeStandHist(). Une requête
    // de moins à chaque ouverture d'un bilan.
    const bz=await q(db.from("bets").select("day,player_id,net,card,picks").eq("league_id",L.id));
    const N=L.num_days||0; const pmap={}; players.forEach(p=>pmap[p.id]=p);
    const nm=pid=>{const p=pmap[pid]||{};return avatarHTML(p.emoji)+' '+esc(p.name||'?');};
    let bigDay=null, worstDay=null;
    bz.forEach(b=>{ const v=b.net||0; if(bigDay===null||v>bigDay.net) bigDay={pid:b.player_id,day:b.day,net:v}; if(worstDay===null||v<worstDay.net) worstDay={pid:b.player_id,day:b.day,net:v}; });
    /* ---- HISTORIQUE DU CLASSEMENT — repris de computeStandHist() (corrigé v7.21) -------------
       ⚠️ Ce bloc REFAISAIT son propre rejeu du championnat : troisième copie de la règle de
       points, après `resolveDay` et `computeStandHist`. Et elle était FAUSSE sur un point précis,
       repéré par Hervé sur la ligue 2M46X : le départage à égalité de points utilisait
       `p.capital`, la cagnotte **FINALE**, au lieu de celle de la journée concernée. À la J3 le
       joueur IA menait (même total de points, cagnotte du jour supérieure), mais le bilan
       annonçait « Giulian a tenu la tête de bout en bout » parce qu'il comparait les cagnottes de
       la fin. Elle ignorait aussi les enchères de départ, la recapitalisation et les rachats.
       `computeStandHist` gère tout cela et applique `classe()`, le tri officiel du classement.
       Une seule source de vérité — même leçon que la recapitalisation (v7.16) et l'étoile (v7.18). */
    const snapsH=computeStandHist();
    const rankHist={}; players.forEach(p=>rankHist[p.id]=[]); const leaderByDay=[];
    for(let d=0;d<N;d++){
      const s=snapsH[d]; if(!s||!s.length){ leaderByDay.push(null); continue; }
      const ord=classe(s);
      ord.forEach((p,idx)=>{ if(rankHist[p.id]) rankHist[p.id][d]=idx+1; });
      leaderByDay.push(ord[0]?ord[0].id:null);
    }
    let leadChanges=0; const daysLed={};
    leaderByDay.forEach((pid,i)=>{ if(pid) daysLed[pid]=(daysLed[pid]||0)+1; if(i>0&&pid&&pid!==leaderByDay[i-1]) leadChanges++; });
    let topLeader=null; Object.keys(daysLed).forEach(pid=>{ if(topLeader===null||daysLed[pid]>daysLed[topLeader]) topLeader=pid; });
    const finalOrd=classe(players); const finalRank={}; finalOrd.forEach((p,i)=>finalRank[p.id]=i+1);
    let comeback=null; players.forEach(p=>{ const rh=rankHist[p.id].filter(x=>x); if(rh.length<2)return; const worst=Math.max(...rh); const g=worst-finalRank[p.id]; if(g>0&&(comeback===null||g>comeback.g)) comeback={pid:p.id,g,worst,fin:finalRank[p.id]}; });
    const bonusImp={}; players.forEach(p=>bonusImp[p.id]=0); let cardsPlayed=0, master=null;
    bz.forEach(b=>{ if(b.card&&b.card.id){ cardsPlayed++; const self=(b.card.impact&&b.card.impact.self)||0; if(bonusImp[b.player_id]!=null)bonusImp[b.player_id]+=self; if(self>0&&(master===null||self>master.self)) master={pid:b.player_id,day:b.day,self,id:b.card.id}; } });
    let bestBonus=null; players.forEach(p=>{ if(bonusImp[p.id]>0&&(bestBonus===null||bonusImp[p.id]>bestBonus.tot)) bestBonus={pid:p.id,tot:bonusImp[p.id]}; });
    endStats={ nm, bigDay, worstDay, leadChanges, topLeader, daysLed, comeback, bestBonus, master, cardsPlayed };
  }catch(e){ endStats={error:e.message}; }
}

  if(e.bestBonus) items.push(t("🃏 <b>Le roi des bonus :</b> {name} — ses cartes lui ont rapporté <b class=\"green\">+{tot}€</b> au total.",{name:e.nm(e.bestBonus.pid),tot:eur(e.bestBonus.tot)}));

  if(!items.length) return '';
  return `<h2>${t("📜 Le bilan de la saison")}</h2><div class="box"><div class="mini" style="line-height:1.95">${items.join('<br>')}</div></div>`;
}
function viewEnd(){

async function loadPalmares(){
  try{
    const lgs=await q(db.from("leagues").select("id,name,num_participants,status"));
    const pls=await q(db.from("players").select("id,name,emoji,league_id,is_ai,user_id"));
    const bts=await q(db.from("bets").select("league_id,day,player_id,net,picks,card,captain,duel_id").not("net","is",null));
    const dls=await q(db.from("duels").select("id,fixtures"));
    const lgMap={},plMap={},dlMap={}; lgs.forEach(l=>lgMap[l.id]=l); pls.forEach(p=>plMap[p.id]=p); dls.forEach(d=>dlMap[d.id]=d);
    const oddF=(f,s)=> s==="1"?f.oh:s==="2"?f.oa:f.od; const selNm=(f,s)=> s==="1"?f.home:s==="2"?f.away:t("Nul");
    const dayRecs=[], oddRecs=[];
    for(const b of bts){ const pl=plMap[b.player_id]; if(!pl||pl.is_ai||pl.name==="Joueur IA") continue; const lg=lgMap[b.league_id]||{}; const d=dlMap[b.duel_id]; const fx=(d&&d.fixtures)||[];
      const picks=b.picks||[]; const staked=picks.reduce((a,x)=>a+(+x.stake||0),0);
      const lines=picks.map((x,i)=>{ const f=fx[i]; if(!f) return null; const win=x.sel===f.res; const odd=oddF(f,x.sel); let g=win?(+x.stake)*(odd-1):-(+x.stake); if(i===b.captain)g*=2;
        if(win && +x.stake>0) oddRecs.push({odd, name:pl.name, emoji:pl.emoji, lname:lg.name, day:b.day, match:f.home+"–"+f.away, sel:selNm(f,x.sel), stake:+x.stake});
        return {m:f.home+"–"+f.away, sel:selNm(f,x.sel), win, odd, stake:+x.stake, g:+g.toFixed(2), cap:i===b.captain}; }).filter(Boolean);
      dayRecs.push({net:+(b.net||0).toFixed(2), staked, ret: staked>0?(b.net||0)/staked:0, name:pl.name, emoji:pl.emoji, lname:lg.name, np:lg.num_participants, day:b.day, cardId:b.card&&b.card.id, lines});
    }
    // Agrégat de PRONOSTIC PUR par personne (user_id), toutes ligues — indépendant des mises.
    const agg={};
    for(const b of bts){ const pl=plMap[b.player_id]; if(!pl||pl.is_ai||!pl.user_id||pl.name==="Joueur IA") continue;
      const d=dlMap[b.duel_id]; const fx=(d&&d.fixtures)||[]; const c=b.card;
      let a=agg[pl.user_id]; if(!a){ a=agg[pl.user_id]={uid:pl.user_id,name:pl.name,emoji:pl.emoji,picks:0,correct:0,winOddSum:0,wins:0,flat:0}; }
      a.name=pl.name; a.emoji=pl.emoji;
      (b.picks||[]).forEach((x,i)=>{ const f=fx[i]; if(!f||f.res==null) return;
        const isDC=c&&c.id==="chance"&&c.target===i&&c.sel2;
        const win=isDC?(f.res===x.sel||f.res===c.sel2):(x.sel===f.res);
        const odd=isDC?(win?oddF(f,f.res):oddF(f,x.sel)):oddF(f,x.sel); // Double Chance : cote initiale du résultat sorti
        a.picks++; if(win){ a.correct++; a.wins++; a.winOddSum+=odd; a.flat+=(odd-1); } else a.flat-=1; });
    }
    const MINP=5, MINW=2; // min. de pronostics pour figurer au classement des pronostiqueurs
    const skill=Object.values(agg).filter(a=>a.picks>0).map(a=>({ uid:a.uid, name:a.name, emoji:a.emoji, picks:a.picks, correct:a.correct,
      hit:a.correct/a.picks, avgOdd:a.wins?a.winOddSum/a.wins:0, wins:a.wins, flat:a.flat/a.picks }));
    // Classement + position du joueur connecté : renvoie {top: 5 premiers, me: {rank,total,...} ou null}
    const rankMe=(arr,keyFn)=>{ const sorted=[...arr].sort((x,y)=>keyFn(y)-keyFn(x));
      const mi=AUTH?sorted.findIndex(a=>a.uid===AUTH.id):-1;
      return { top:sorted.slice(0,5), me: mi>=0?Object.assign({rank:mi+1,total:sorted.length},sorted[mi]):null }; };
    const skHit=skill.filter(a=>a.picks>=MINP), skOdd=skill.filter(a=>a.wins>=MINW);
    palmares={
      bigGain: [...dayRecs].sort((a,b)=>b.net-a.net).slice(0,5),
      bestRet: [...dayRecs].filter(r=>r.staked>=5).sort((a,b)=>b.ret-a.ret).slice(0,5),
      bestOdd: [...oddRecs].sort((a,b)=>b.odd-a.odd).slice(0,5),
      bigLoss: [...dayRecs].sort((a,b)=>a.net-b.net).slice(0,5),
      topHit: rankMe(skHit, a=>a.hit),
      worstHit: { top:[...skHit].sort((x,y)=>x.hit-y.hit).slice(0,5) },
      topAvgOdd: rankMe(skOdd, a=>a.avgOdd),
      topFlat: rankMe(skHit, a=>a.flat),
      minP: MINP
    };
  }catch(e){ palmares={error:e.message}; }
}

     <div class="mini">📈 <b>${t("Cote moyenne gagnante")} : ${r.avgOdd?('@'+r.avgOdd.toFixed(2)):'–'}</b></div>
     <div class="mini muted" style="margin:2px 0 8px">${t("La cote moyenne de tes pronos <b>gagnés</b>. Plus elle est haute, plus tes bons pronos étaient <b>risqués</b> (et pas seulement des favoris à petite cote).")}</div>
     <div class="mini">💎 <b>${t("Rendement à mise fixe")} : <span class="${r.flat>=0?'green':'red'}">${r.flat>=0?'+':''}${(r.flat*100).toFixed(0)}%</span></b></div>
     <div class="mini muted" style="margin:2px 0 0">${t("Si tu avais misé <b>1 € sur chacun</b> de tes pronos (cotes comprises) : ce que tu aurais gagné ou perdu <b>en moyenne par pari</b>. <b class=\"green\">Positif</b> = tu bats les cotes ; <b class=\"red\">négatif</b> = tu as souvent raison mais sur des favoris qui rapportent trop peu pour couvrir les erreurs.")}</div>`;
  const sec=(title,arr,val,detail,tag,empty)=>`<h2>${title}</h2>${arr.length?arr.map((r,i)=>{const k=tag+i;const op=palmOpen===k;const v=val(r);
     return `<div class="box" style="padding:10px 12px;cursor:pointer" onclick="togglePalm('${k}')">

       ${op?`<div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px">${detail(r)}</div>`:''}</div>`;}).join(""):`<div class="box mini muted">${empty||t("Pas encore de données.")}</div>`}`;

        <div class="row"><div class="row" style="gap:8px"><b style="min-width:22px">${medal(i)}</b><span>${avaName(r)}</span></div><b class="${v.cls}">${v.txt} ${op?'▲':'▼'}</b></div>
        ${op?`<div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px">${detail(r)}</div>`:''}</div>`;}).join("");
    return `<h2>${title}</h2>${rows}`; };
  return `${back}
    <div class="box" style="border-left:3px solid var(--accent)"><h2 style="margin-top:0">${t("🧠 Classement des pronostiqueurs")}</h2><div class="mini muted">${t("Compétence de <b>pronostic pur</b> (bons pronos & cotes), <b>indépendante des mises</b>, toutes ligues confondues. Minimum <b>{a} pronostics</b> pour figurer. Touche un joueur pour son profil complet.",{a:palmares.minP})}</div></div>
    ${secMe(t("🎯 Meilleurs pronostiqueurs — % de réussite"), palmares.topHit, r=>({txt:(r.hit*100).toFixed(1)+"%",cls:'gold'}), statDetail, "ph", t("Pas encore assez de pronostics (min {a}).",{a:palmares.minP}))}
    ${secMe(t("📈 Meilleure cote moyenne gagnante"), palmares.topAvgOdd, r=>({txt:'@'+r.avgOdd.toFixed(2),cls:'gold'}), statDetail, "pa", t("Pas encore assez de pronostics gagnants."))}
    ${secMe(t("💎 Meilleur rendement à mise fixe (bat les cotes)"), palmares.topFlat, r=>({txt:(r.flat>=0?'+':'')+(r.flat*100).toFixed(0)+"%",cls:r.flat>=0?'green':'red'}), statDetail, "pf", t("Pas encore assez de pronostics (min {a}).",{a:palmares.minP}))}
    ${secMe(t("💩 Pires pronostiqueurs — % de réussite"), palmares.worstHit, r=>({txt:(r.hit*100).toFixed(1)+"%",cls:'red'}), statDetail, "pw", t("Pas encore assez de pronostics (min {a}).",{a:palmares.minP}))}
    <div class="box"><h2 style="margin-top:0">${t("🏆 Autres records (en €)")}</h2><div class="mini muted">${t("Les plus grosses perfs par journée, toutes ligues confondues.")}</div></div>
    ${sec(t("💥 Plus gros gain sur une journée"), palmares.bigGain, r=>({txt:fmt(r.net)+"€",cls:r.net>=0?'green':'red'}), dayDetail, "g")}
    ${sec(t("📈 Meilleur rendement d'une journée"), palmares.bestRet, r=>({txt:t("×{r} la mise",{r:r.ret.toFixed(2)}),cls:r.ret>=0?'green':'red'}), dayDetail, "r", t("Il faut avoir misé ≥ 5€."))}
    ${sec(t("🎯 Plus grosse cote gagnée"), palmares.bestOdd, r=>({txt:"@"+cote(r.odd),cls:'gold'}), oddDetail, "o")}
    ${sec(t("💀 Pire dégringolade d'une journée"), palmares.bigLoss, r=>({txt:fmt(r.net)+"€",cls:'red'}), dayDetail, "l")}`;
}
async function loadAdmin(){
  try{
    // Solde de crédits API : lu depuis le cache partagé (relevé par n'importe quel client lors de son
    // dernier appel). Sans ça, l'écran admin n'affichait jamais rien — voir noteQuota().
    await refreshQuota();                               // gratuit : le chiffre est toujours à jour ici
    const quota=await cacheRead("quota", Infinity);
    // v7.06 : `code,name,num_days,current_day,data_mode` et `league_id` sur les paris servent à la
    // liste « Toutes les ligues » — l'admin ne voyait QUE ses propres ligues, donc rien du terrain.
    const lgs=await q(db.from("leagues").select("id,code,name,status,num_days,current_day,data_mode,gage,prep_summary,created_at"));
    const pls=await q(db.from("players").select("id,name,is_ai,user_id,league_id,created_at"));
    const allBts=await q(db.from("bets").select("card,net,created_at,player_id,submitted,league_id"));
    // Rachats de bonus : 2 actions humaines datées par ligne (proposition, puis réponse).
    // Table absente sur une base pas encore migrée → on continue sans, plutôt que de tout casser.
    let trs=[]; try{ trs=await q(db.from("trades").select("from_player,to_player,created_at,resolved_at")); }catch(e){ trs=[]; }
    // Joueurs HUMAINS (le 🤖 joueur IA parie automatiquement : ses paris ne sont pas de l'usage).
    const humain={}; pls.forEach(p=>{ if(!p.is_ai && p.user_id) humain[p.id]=true; });
    // Base commune à TOUS les compteurs de paris : humain ET prono réellement validé.
    // `submitted:false` = ligne vide créée par resolveDay pour un oubli — ce n'est pas un pari.
    const btsH=allBts.filter(b=>humain[b.player_id] && b.submitted!==false);
    const bts=btsH.filter(b=>b.net!=null); // paris humains résolus (stats de jeu)
    const cardCount={}; let withCard=0;
    bts.forEach(b=>{ if(b.card&&b.card.id){ cardCount[b.card.id]=(cardCount[b.card.id]||0)+1; withCard++; } });
    /* ---- Activité par jour ----
       « Joueur actif » = PERSONNE distincte (user_id) ayant fait au moins UNE ACTION DATÉE ce
       jour-là : prono validé, arrivée en ligue, rachat proposé ou répondu, enchère/vote de prépa.
       On mappe player_id → user_id car une personne a un `player` par ligue. Les connexions
       simples ne sont pas tracées (il faudrait une table d'événements — cf. Phase 2). */
    const p2u={}; pls.forEach(p=>{ if(!p.is_ai && p.user_id) p2u[p.id]=p.user_id; });
    const u2name={}; pls.forEach(p=>{ if(!p.is_ai && p.user_id && p.name && u2name[p.user_id]==null) u2name[p.user_id]=p.name; }); // user_id → nom (pour afficher QUI est actif)
    const dayKey=ts=>{ const d=new Date(ts); if(isNaN(d)) return null;
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    const dailyMap={};
    const slot=k=>{ dailyMap[k]=dailyMap[k]||{users:new Set(),bets:0,leagues:0,newp:new Set()}; return dailyMap[k]; };
    // Enregistre une ACTION HUMAINE datée : c'est la seule chose qui rend quelqu'un « actif ».
    const actes=[]; // {ts, uid} — sert aussi aux cumuls 7 / 30 jours, pour qu'ils disent la même chose
    const acte=(ts,pid)=>{ const u=p2u[pid]; if(!u||ts==null) return; const tt=new Date(ts).getTime(); if(isNaN(tt)) return;
      const k=dayKey(tt); if(k) slot(k).users.add(u); actes.push({tt,u}); };
    // 1) Pronos VALIDÉS. `submitted:false` = ligne vide créée par resolveDay pour un joueur qui a
    //    OUBLIÉ : la compter revient à déclarer actif quelqu'un qui n'a précisément rien fait.
    btsH.forEach(b=>{ const k=dayKey(b.created_at); if(!k) return;
      slot(k).bets++; acte(b.created_at,b.player_id); });
    // 2) Arrivée dans une ligue (couvre aussi la création : l'organisateur y a sa ligne `players`).
    pls.forEach(p=>{ if(p.is_ai) return; acte(p.created_at,p.id); });
    // 3) Rachats de bonus : `created_at` = celui qui propose, `resolved_at` = celui qui répond.
    trs.forEach(tr=>{ acte(tr.created_at,tr.from_player); if(tr.resolved_at) acte(tr.resolved_at,tr.to_player); });
    // 4) Préparation : horodatages des enchères et des votes, rangés dans `leagues.gage` (JSON).
    //    ⚠️ Visible seulement PENDANT la prépa : au démarrage, `gage` est remplacé par le texte du
    //    gage retenu, et ces dates sont perdues. Rien à en tirer rétroactivement.
    lgs.forEach(l=>{ let stp=null; try{ stp=JSON.parse(l.gage); }catch(e){ return; }
      if(!stp||typeof stp!=="object") return;
      ["bidTs","voteTs","voteTsR"].forEach(cle=>{ const m=stp[cle]; if(!m||typeof m!=="object") return;
        Object.keys(m).forEach(pid=>acte(m[pid],pid)); }); });
    lgs.forEach(l=>{ const k=dayKey(l.created_at); if(!k) return; slot(k).leagues++; });
    // Nouveaux joueurs = 1re apparition d'un user_id (plus ancienne ligne `players`)
    const firstSeen={}; pls.forEach(p=>{ if(p.is_ai||!p.user_id||!p.created_at) return; const tt=new Date(p.created_at).getTime();
      if(isNaN(tt)) return; if(firstSeen[p.user_id]==null||tt<firstSeen[p.user_id]) firstSeen[p.user_id]=tt; });
    Object.keys(firstSeen).forEach(u=>{ const k=dayKey(firstSeen[u]); if(k) slot(k).newp.add(u); });
    const now=Date.now(); const daily=[];
    for(let i=0;i<14;i++){ const k=dayKey(new Date(now-i*86400000)); const s=dailyMap[k];
      const names=s?[...s.users].map(u=>u2name[u]||('#'+String(u).slice(0,6))).sort((a,b)=>a.localeCompare(b)):[];
      daily.push({d:k, users:s?s.users.size:0, names, bets:s?s.bets:0, leagues:s?s.leagues:0, newp:s?s.newp.size:0}); }
    // Mêmes actes que le tableau jour par jour : les cumuls ne peuvent donc pas le contredire.
    const activeSince=days=>{ const cut=now-days*86400000; const set=new Set();
      actes.forEach(a=>{ if(a.tt>=cut) set.add(a.u); }); return set.size; };
    const active7=activeSince(7), active30=activeSince(30), everActive=activeSince(36500);
    // Gages et récompenses les plus choisis — DEUX classements SÉPARÉS (v6.84).
    // Pourquoi : `gageVotes` porte les gages OU les récompenses selon l'enjeu de la ligue. Les
    // cumuler sous un seul titre « Gages » faisait apparaître « La tournée d'honneur 🍻 » parmi les
    // gages — vue trompeuse au moment précis où l'on regarde ce que les gens choisissent.
    // Cas « both » : `gageVotes` = les gages ; les récompenses vivent à part (`optionsR`/`votesR`),
    // sans compteur pré-calculé → on le refait ici.
    const gageTally={}, rewTally={};
    const bump=(tal,titre,count,win)=>{ if(!titre) return;
      tal[titre]=tal[titre]||{votes:0,wins:0}; tal[titre].votes+=(count||0); if(win) tal[titre].wins++; };
    lgs.forEach(l=>{ const s=l.prep_summary||{}; const both=(s.enjeu==="both");
      const cible = both ? gageTally : (s.enjeu==="reward" ? rewTally : gageTally);
      ((s.gageVotes)||[]).forEach(g=>{ if(g) bump(cible,g.t,g.count,g.win); });
      if(both){ const optR=s.optionsR||[], votR=s.votesR||{};
        const counts=optR.map((_,i)=>Object.values(votR).filter(v=>v===i).length);
        const mx=Math.max(0,...counts);
        // `voteTsR` n'est pas conservé dans prep_summary : impossible de rejouer le départage à
        // l'ancienneté. On ne compte donc « retenu » que si le maximum est STRICTEMENT unique —
        // mieux vaut sous-compter que désigner un gagnant au hasard.
        const seul=counts.filter(c=>c===mx).length===1;
        optR.forEach((o,i)=>bump(rewTally,(o&&o.t)||o,counts[i], mx>0 && seul && counts[i]===mx)); } });
    const classer=tal=>Object.keys(tal).map(t=>({t,votes:tal[t].votes,wins:tal[t].wins})).sort((a,b)=> b.votes-a.votes || b.wins-a.wins);
    const topGages=classer(gageTally), topRewards=classer(rewTally);
    const activeAccounts=new Set(pls.filter(p=>!p.is_ai&&p.user_id).map(p=>p.user_id)); // 1 personne = 1, même sur plusieurs ligues
    /* ---- Toutes les ligues (v7.06, Hervé) ---------------------------------------------------
       « En tant qu'admin je ne peux pas voir les ligues ouvertes par les autres. » L'écran ne
       montrait que des COMPTEURS ; impossible de savoir laquelle vit, laquelle est morte, ni de
       repérer un groupe bloqué. ⚠️ Volontairement limité à la phase de TEST : c'est une vue sur
       les parties d'autrui. À revoir avant une ouverture publique.
       « Dernière activité » = le prono humain le plus récent de la ligue, à défaut sa création.
       Les connexions et les modifications de prono ne sont pas datées (cf. note de l'écran). */
    const derniere={}; const humParLg={};
    const vu=(lid,ts)=>{ if(!lid) return; const t=new Date(ts).getTime();
      if(!isNaN(t) && (derniere[lid]==null || t>derniere[lid])) derniere[lid]=t; };
    btsH.forEach(b=>vu(b.league_id,b.created_at));
    // ⚠️ L'ARRIVÉE d'un joueur compte aussi : sans elle, un SALON où des gens s'inscrivent encore
    // serait jugé mort sur la seule date de création de la ligue — et fermé à tort.
    pls.forEach(p=>{ if(p.is_ai||!p.league_id) return; vu(p.league_id,p.created_at);
      (humParLg[p.league_id]=humParLg[p.league_id]||new Set()).add(p.user_id||p.id); });
    const allLeagues=lgs.map(l=>{
      const cree=new Date(l.created_at).getTime();
      const maj=derniere[l.id]||cree;
      return { id:l.id, code:l.code||'?', name:l.name||'?', status:l.status, data:l.data_mode||'sim',
               day:l.current_day|0, days:l.num_days|0, joueurs:(humParLg[l.id]||new Set()).size,
               cree, maj, dormante:Math.floor((Date.now()-maj)/86400000) };
    }).sort((a,b)=>b.maj-a.maj);
    /* ---- FERMETURE AUTOMATIQUE des ligues à l'abandon (v7.07, réglage d'Hervé : 14 jours) -----
       Traitée comme une fermeture AVANT TERME : `current_day` reste inférieur à `num_days`, donc
       l'écran de fin affiche « Ligue fermée avant son terme », sans vainqueur ni perdant, sans
       gage — et les statistiques l'excluent. Exactement le comportement d'une fermeture manuelle.
       ⚠️ AUCUN serveur ne tourne aujourd'hui (cf. Phase 2) : le balayage a lieu quand l'ADMIN
       ouvre cet écran. Effet secondaire HEUREUX — un joueur qui revient sur sa ligue avant ce
       balayage la relance normalement (la journée en retard se résout), donc on ne ferme que ce
       que plus personne ne réclame.
       ⚠️ `.neq("status","done")` : garde-fou contre une double fermeture si deux onglets balaient
       en même temps — on n'écrase pas la date de fin d'une ligue déjà close. */
    let fermeesAuto=0;
    for(const l of allLeagues.filter(x=>x.status!=="done" && x.dormante>=LIGUE_FERME_J)){
      try{
        const r=await q(db.from("leagues").update({status:"done"}).eq("id",l.id).neq("status","done").select("id"));
        if(r && r.length){ fermeesAuto++; l.status="done"; l.fermeeAuto=true;
          // Colonne absente sur une base pas encore migrée → on n'échoue pas pour autant.
          try{ await q(db.from("leagues").update({finished_at:new Date().toISOString()}).eq("id",l.id)); }catch(e){} }
      }catch(e){}
    }
    adminData={ allLeagues, fermeesAuto, leagues:lgs.length,
      byStatus:{lobby:lgs.filter(l=>l.status==="lobby").length, prep:lgs.filter(l=>l.status==="prep"||l.status==="starting").length, running:lgs.filter(l=>l.status==="running").length, done:lgs.filter(l=>l.status==="done").length},
      activeAccounts:activeAccounts.size, participations:pls.filter(p=>!p.is_ai&&p.name!=="Joueur IA").length,
      resolvedBets:bts.length, cardsPlayed:withCard, topCards:Object.keys(CARDS).map(id=>[id,cardCount[id]||0]).sort((a,b)=>b[1]-a[1]), topGages, topRewards,
      daily, active7, active30, everActive, totalBets:btsH.length, quota };
  }catch(e){ adminData={error:e.message}; }
}
// Admin : clic sur le nombre d'actifs d'un jour → la liste des noms (voir qui fait quoi).
function showActiveNames(d){
  const row=((adminData&&adminData.daily)||[]).find(x=>x.d===d); if(!row) return;

function render(){
  const inLeague=!!S.leagueId;
  applyThemeBtn(); applyLangBtn();
  const fo=$("foot"); if(fo) fo.textContent="The Maestro League · "+t("prototype de test · données sportives simulées")+" · "+APP_VERSION;

  // 🛒 et 🐛 : conditionnés à la SESSION, pas à l'écran affiché. Tester `S.view==="auth"` ne
  // suffisait pas — un visiteur non connecté ouvrant les 📖 règles depuis l'écran de connexion
  // quittait la vue "auth" et voyait donc réapparaître la boutique (signalé par Hervé).
  $("homeBtn").classList.toggle("hide", !AUTH);
  $("profilBtn").classList.toggle("hide", !AUTH || S.view==="profil");  // Profil = bouton haut-droite (retiré des onglets du bas)
  $("bugBtn").classList.toggle("hide", !AUTH);

  ["shopBtn","settingsBtn","leaguesBtn","themeBtn"].forEach(id=>{ const e=$(id); if(e) e.classList.add("hide"); });
  $("langBtn").classList.toggle("hide", S.view!=="auth");   // 🇬🇧 langue : dispo sur la page de connexion (avant d'avoir accès au Profil)
  // 🤝 rachat de bonus : visible en cours de championnat ; pastille = nb d'offres reçues à traiter.
  // 🤝 masqué en consultation : l'écriture serait refusée par `q()`, autant ne pas le proposer.
  const canTrade = !!(L && L.status==="running" && inLeague) && !LECTURE_SEULE;
  $("tradeBtn").classList.toggle("hide", !canTrade);
  if(canTrade){ const n=myPendingIn().length + myResolvedUnseen().length; $("tradeBtn").innerHTML = n>0 ? `🤝<span class="tradebadge">${n}</span>` : "🤝"; }
  // leaguesBtn/settingsBtn : remplacés par 🏠 (haut) et l'onglet Profil (bas) — masqués ci-dessus.
  let html="";
  if(S.view==="auth") html=viewAuth();
  else if(S.view==="home") html=viewHome();
  else if(S.view==="leagues") html=viewLeagues();
  else if(S.view==="rules") html=viewRules();
  else if(S.view==="rulesfull") html=viewRulesFull();
  else if(S.view==="standings") html=viewStandings();
  else if(S.view==="coulisses") html=viewCoulisses();
  else if(S.view==="results") html=viewResults();
  else if(S.view==="palmares") html=viewPalmares();
  else if(S.view==="admin") html=viewAdmin();
  else if(S.view==="settings") html=viewSettings();
  else if(S.view==="trade") html=viewTrade();
  else if(S.view==="stats") html=viewStats();
  else if(S.view==="leaguestats") html=viewLeagueStats();
  else if(S.view==="essai") html=viewEssai();

  // Bandeau de consultation en TÊTE DE CHAQUE ÉCRAN (v7.11) : quel que soit l'onglet où l'admin
  // navigue dans la ligue d'un autre, il voit qu'il n'est pas chez lui et peut sortir d'un clic.
  $("root").innerHTML=bandeauConsultation()+html;
  { const bn=$("bottomnav"); if(bn){ const bh=bottomBar(); bn.innerHTML=bh; bn.classList.toggle("hide", !bh); } }

  if(S.view==="game" && L){ const d=myDuel(); const mb=myBet(); gsub="|"+L.current_day+"|"+((d&&d.fixtures&&d.fixtures.length)?"F":"")+"|"+(mb?"S":"")+"|"+(S.editingBet?"E":"")+"|"+(S.dispDay||0); }
  // Les étapes de la préparation comptent comme des changements d'écran → remontée en haut (sinon on
  // arrive au milieu de l'étape suivante). Sans impact sur les rafraîchissements du polling : l'étape
  // ne bouge pas toute seule.
  if(S.view==="game" && L && L.status==="prep") gsub+="|p"+prepStep;
  // S.ptab inclus : changer d'onglet de PRÉPARATION (Infos/Joueurs/Gages/Enchères) ne change pas S.view
  // → sans ça, on restait au milieu de la page en changeant d'onglet (signalé par Hervé). Le polling ne
  // touche pas S.ptab, donc aucun scroll intempestif sur les rafraîchissements.
  // Classement : passer du BILAN au classement journée par journée, ou changer de journée, remplace
  // tout le contenu de la page — c'est un changement d'écran, pas un rafraîchissement (signalé par
  // Hervé : on arrivait au milieu de la page). Ces deux états ne bougent que sur un clic du joueur,
  // jamais sur le polling : aucun risque de remontée intempestive pendant qu'on lit.
  // ⚠️ Les CHAPITRES dépliables (écran Admin, palmarès, remontées) sont VOLONTAIREMENT exclus :
  // on y clique sur un en-tête placé au milieu de la page, et remonter en haut ferait perdre de vue
  // ce qu'on vient précisément d'ouvrir.
  const sig=S.view+"|"+(L?L.status:"")+"|"+(S.recap?"r":"")+"|"+(S.leagueId||"")+"|"+(S.ptab||"")
    +"|"+(standHist?"h":"")+"|"+(standDay==null?"":("d"+standDay))+gsub;
  if(sig!==lastScreenSig){ lastScreenSig=sig; try{ window.scrollTo(0,0); }catch(e){} }
  $("subtitle").textContent = S.view==="auth"?t("Connexion") : S.view==="rulesfull"?t("📚 Règles détaillées") : S.view==="settings"?t("Paramètres") : S.view==="profil"?t("Profil") : S.view==="shop"?t("Boutique") : S.view==="palmares"?t("Palmarès") : S.view==="stats"?t("Mes stats") : S.view==="home"?t("Accueil") : S.view==="leagues"?t("Mes ligues") : S.view==="essai"?t("▶️ Partie d'essai") : (L? (
     L.status==="lobby"?t("Salon")+" · "+L.code :
     (L.status==="prep"||L.status==="starting")?t("Préparation") :
     S.view==="standings"?t("Classement") :
     S.view==="coulisses"?t("Coulisses") :
     S.view==="results"?t("Résultats") :
     S.view==="leaguestats"?t("Stats de la ligue") :
     S.view==="trade"?t("Rachat de bonus") :
     (L.status==="done"?t("Terminé"):t("Journée {a}/{b}",{a:L.current_day+1,b:L.num_days}))
   ) : "…");
}
// pendant la composition (choix des matchs à domicile ou saisie des pronos), on ne rafraîchit pas
// pour ne pas re-dessiner et fermer le champ en cours de saisie.
function isComposing(){
  if(S.view!=="game"||!L) return false;
  if(L.status==="prep") return !!(me() && !me().shop_done); // prépa (vote/enchères) en cours
  if(L.status!=="running"||S.recap) return false;
  const d=myDuel(); if(!d) return false;
  if(!d.fixtures) return d.home_id===S.myId; // à domicile : en train de choisir les 5 matchs
  return !myBet();                            // en train de faire ses pronos/mises
}

// navRoot() vide la pile : on change de racine (ligue / liste), l'historique d'avant n'a plus

// === Navigation par SWIPE horizontal entre onglets (v6.42, Hervé) =============================
// Renvoie l'ordre des onglets ACTUELLEMENT affichés dans la barre du bas + comment les ouvrir.
function currentSwipeTabs(){
  // Prépa / lobby : onglets internes (S.ptab), même ordre que prepTabs().
  if(S.leagueId && L && (L.status==="lobby"||L.status==="prep") && LEAGUE_TABVIEWS.includes(S.view)){
    const items=["infos","joueurs"]; if(!isSolo()) items.push("gages"); items.push("encheres");
    return { kind:"ptab", idx:items.indexOf(S.ptab), items };
  }
  if(HOME_VIEWS.includes(S.view)){
    const items=["home","leagues","stats","palmares","shop"];   // ordre de homeTabs() (Profil exclu : bouton haut-droite)
    const acts={home:goAccueil,leagues:backToLeagues,stats:openStats,palmares:openPalmares,shop:openShop};
    return { kind:"nav", idx:items.indexOf(S.view), items, acts };
  }
  if(LEAGUE_TABVIEWS.includes(S.view) && L && (L.status==="running"||L.status==="done")){
    const items=["coulisses","game","results","standings","leaguestats"];   // ordre de runningTabs()
    const acts={coulisses:openCoulisses,game:goGame,results:()=>openResults(resultsDefaultDay()),standings:goStandings,leaguestats:openLeagueStats};
    return { kind:"nav", idx:items.indexOf(S.view), items, acts };
  }
  return null;
}
// dir=+1 → onglet SUIVANT (doigt vers la gauche) ; dir=-1 → PRÉCÉDENT. Ne boucle pas aux extrémités.
function swipeNav(dir){ const c=currentSwipeTabs(); if(!c||c.idx<0) return;
  const ni=c.idx+dir; if(ni<0||ni>=c.items.length) return; const target=c.items[ni];
  if(c.kind==="ptab"){ setPtab(target); return; }
  const fn=c.acts[target]; if(fn) fn(); }
// Un swipe ne doit PAS déclencher si le geste part d'un curseur (mise), d'un champ, ou d'une zone qui
// défile elle-même horizontalement (tableaux récap, classement) — sinon on changerait d'onglet par erreur.
function swipeBlocked(el){ for(let n=el; n && n!==document.body; n=n.parentElement){
    if(n.matches && n.matches('input,textarea,select,button,[contenteditable="true"]')) return true;
    try{ const st=getComputedStyle(n); const ox=st.overflowX;
      if((ox==="auto"||ox==="scroll") && n.scrollWidth>n.clientWidth+4) return true; }catch(e){}
  } return false; }
function initSwipeNav(){ const root=$("root"); if(!root||root._swipe) return; root._swipe=true;
  let x0=0,y0=0,t0=0,armed=false;
  root.addEventListener("touchstart",e=>{ if(e.touches.length!==1){armed=false;return;}
    const tch=e.touches[0]; x0=tch.clientX; y0=tch.clientY; t0=Date.now(); armed=!swipeBlocked(e.target); },{passive:true});
  root.addEventListener("touchend",e=>{ if(!armed) return; armed=false;
    const tch=(e.changedTouches&&e.changedTouches[0]); if(!tch) return;
    const dx=tch.clientX-x0, dy=tch.clientY-y0, dt=Date.now()-t0;
    // swipe net : horizontal franc (>60px), nettement plus horizontal que vertical, et assez rapide
    if(dt<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*2){ swipeNav(dx<0?1:-1); }
  },{passive:true});
}

// === RACHAT DE BONUS (point 4) — échange de capital VIRTUEL contre une carte =============
// Un ACHETEUR propose une somme à un VENDEUR pour lui racheter une carte encore EN MAIN ;
// le vendeur accepte ou refuse. Même modèle de confiance que tout le jeu : le client écrit
// (resolveDay réécrit déjà le capital de tous) → sera porté en RPC serveur en Phase 2.
// Règles (IDEES-V5 point 4) : seulement en cours de championnat · uniquement des cartes
// LIBRES (en main) · l'acheteur ne doit pas avoir de pari validé pour la journée en cours
// (sinon on casse worstLoss ≤ capital) · après paiement l'acheteur garde ≥ TRADE_MIN_CAP.
// L'option est PAYANTE par joueur (le proposeur) → péage branché en Phase 4 ; ouvert à tous
// pour l'instant (tests). Le montant n'ajoute pas de capital : il est TRANSFÉRÉ au vendeur.
// Plancher volontairement CALÉ sur le seuil de renflouement (30 € depuis v6.82) : sous ce niveau, le
// jeu considère qu'on ne peut plus miser correctement. Garder le lien ferme aussi la porte à un abus :
// sans lui, on pourrait s'acheter une carte hors de prix pour tomber sous le seuil et se faire remonter
// à 40 € — soit une carte payée par le renflouement, pour 1 petit point.
const TRADE_MIN_CAP = RECAP_THRESHOLD;
function tr2(x){ return Math.round(x*100)/100; }
function tradeRunning(){ return !!(L && L.status==="running"); }
function humanOpponents(){ return players.filter(p=>!p.is_ai && p.id!==S.myId); }

// Refus d'un échange parce que la fenêtre est fermée. Volontairement une MODALE et non un toast :
// le message disparaissait avant d'être lu (signalé par Hervé), et surtout il ne disait pas QUAND
// l'échange redeviendrait possible — l'utilisateur restait sans rien à faire de l'information.
function tradeBloque(raison){

     <div class="mini muted" style="text-align:left;margin-top:10px">${t("Un échange n'est possible qu'<b>entre deux journées</b> : tant qu'un pari du jour est validé, la carte pourrait encore être jouée le même jour — elle serait alors utilisée deux fois.")}</div>

}

// Lecture FRAÎCHE : l'acheteur a-t-il un pari verrouillé pour la journée passée en argument ?
async function hasBetForDay(pid, day){

// `jour` n'est renseigné qu'à l'ACCEPTATION : c'est le seul cas où du capital change de mains, et
// c'est ce qui permet de replacer le transfert au bon point du classement historique et de la
// courbe (cf. MIGRATION-trades-day.sql). Si la colonne n'existe pas encore en base, l'update
// échouerait en bloc → on retente sans, pour ne pas perdre le changement de statut.
async function markTrade(id,st,reply,jour){ const u={status:st,resolved_at:new Date().toISOString()}; if(reply) u.reply=reply;
  try{ const uu=(jour!=null)?Object.assign({day:jour},u):u; await q(db.from("trades").update(uu).eq("id",id)); }
  catch(e){ try{ await q(db.from("trades").update(u).eq("id",id)); }catch(e2){} } }

function viewTrade(){
  const inOff=myPendingIn(), outOff=myPendingOut();
  const nm=p=>p?avaName(p):'?';
  const clbl=id=>CARDS[id]?`<span class="clik" onclick="showCardInfo('${id}')">${CARDS[id].e} ${esc(t(CARDS[id].n))}</span>`:esc(id);
  const meP=me(); const cap=meP?(meP.capital||0):0;
  let h=`<div class="box"><h2 style="margin-top:0">🤝 ${t("Rachat de bonus")} ${premBadge('rachat')}</h2>
      <div class="mini muted">${t("Rachète une carte à un adversaire, ou vends une des tiennes pour te refaire du capital. L'autre reste libre d'accepter ou de refuser.")}</div>
      <div class="mini" style="margin-top:6px;color:var(--blue)">ℹ️ ${t("Le rachat/vente n'est possible qu'entre <b>joueurs réels</b> — pas avec le 🤖 joueur IA.")}</div>
      <div class="mini muted" style="margin-top:6px">🗓️ ${t("Journées restantes : {a}",{a:journeesRestantes()})} · ${t("touche une carte pour voir son effet.")}</div></div>`;
  // Réponses à MES offres
  if(myResolvedOut.length){ h+=`<div class="box"><b class="mini">📨 ${t("Réponses à tes offres")}</b>`;
    myResolvedOut.slice(0,6).forEach(o=>{ const other=pById(o.to_player); const acc=o.status==="accepted";
      h+=`<div class="mini${acc?'':' muted'}" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">${acc?'✅':'✖️'} ${t("{a} a {s} ton offre ({c} · {b} €).",{a:nm(other),s:acc?t("accepté"):t("refusé"),c:clbl(o.card_id),b:Math.round(o.price)})}${o.reply?`<div class="mini muted" style="margin-top:2px">💬 ${esc(o.reply)}</div>`:''}</div>`; });
    h+=`</div>`; }
  // Offres reçues — j'accepte ou refuse (avec un petit mot)
  h+=`<div class="box"><b class="mini">📥 ${t("Offres reçues")}</b>`;
  if(!inOff.length) h+=`<div class="mini muted" style="margin-top:6px">${t("Aucune offre en attente.")}</div>`;
  else inOff.forEach(o=>{ const other=pById(o.from_player); const sell=(o.kind==="sell");
    const line=sell ? t("{a} te vend sa carte {c} pour <b>{b} €</b>.",{a:nm(other),c:clbl(o.card_id),b:Math.round(o.price)})
                    : t("{a} veut racheter ta carte {c} pour <b>{b} €</b>.",{a:nm(other),c:clbl(o.card_id),b:Math.round(o.price)});
    h+=`<div style="margin-top:9px;border-top:1px solid var(--border);padding-top:9px"><div class="mini">${line}</div>
      ${o.msg?`<div class="mini muted" style="margin-top:2px">💬 ${esc(o.msg)}</div>`:''}
      <input id="rp_${o.id}" maxlength="140" placeholder="${t("un petit mot (optionnel)")}" style="width:100%;box-sizing:border-box;padding:8px;margin-top:6px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:inherit">
      <div class="row" style="gap:6px;margin-top:6px"><button class="btn sm" style="flex:1" onclick="acceptTrade('${o.id}')">${t("Accepter")}</button>
      <button class="btn ghost sm" style="flex:1" onclick="refuseTrade('${o.id}')">${t("Refuser")}</button></div></div>`; });
  h+=`</div>`;
  // Offres envoyées — j'annule
  h+=`<div class="box"><b class="mini">📤 ${t("Offres envoyées")}</b>`;
  if(!outOff.length) h+=`<div class="mini muted" style="margin-top:6px">${t("Aucune offre en attente.")}</div>`;
  else outOff.forEach(o=>{ const other=pById(o.to_player); const sell=(o.kind==="sell");
    const line=sell ? t("Tu vends {c} à {a} pour <b>{b} €</b>.",{a:nm(other),c:clbl(o.card_id),b:Math.round(o.price)})
                    : t("Tu proposes <b>{b} €</b> à {a} pour {c}.",{a:nm(other),c:clbl(o.card_id),b:Math.round(o.price)});
    h+=`<div class="row" style="justify-content:space-between;align-items:center;gap:8px;margin-top:9px;border-top:1px solid var(--border);padding-top:9px"><div class="mini">${line}${o.msg?`<div class="mini muted" style="margin-top:2px">💬 ${esc(o.msg)}</div>`:''}</div><button class="btn ghost sm" style="flex:0 0 auto" onclick="cancelTrade('${o.id}')">${t("Annuler")}</button></div>`; });
  h+=`</div>`;
  if(!tradeRunning()){ h+=`<div class="box mini muted">${t("Le rachat n'est possible qu'en cours de championnat.")}</div>`; return h; }
  // Sans l'option 'rachat' : on peut répondre aux offres (ci-dessus) mais pas en initier.
  if(!hasOpt('rachat')){ h+=`<div class="box"><div class="row" style="justify-content:space-between;align-items:center;gap:8px"><b class="mini">🛒 ${t("Proposer un rachat ou une vente")}</b>${premBadge('rachat')}</div>
    <div class="mini muted" style="margin-top:6px">${t("<b>Proposer</b> un rachat ou une vente est une option premium. Tu peux quand même <b>accepter ou refuser</b> les offres qu'on t'envoie.")}</div>
    <button class="btn" style="margin-top:10px" onclick="showPremiumInfo('rachat')">🔓 ${t("Découvrir / souscrire")}</button></div>`;
    return h; }
  // --- RACHETER (j'achète la carte d'un autre) ---
  h+=`<div class="box"><b class="mini">🛒 ${t("Racheter une carte")}</b>`;
  if(!S.recap && myBet()) h+=`<div class="mini muted" style="margin-top:6px">${t("Tu ne peux pas racheter tant que ton pari du jour est validé — attends la résolution de la journée.")}</div>`;
  else if(cap < TRADE_MIN_CAP+1) h+=`<div class="mini muted" style="margin-top:6px">${t("Ton capital est trop faible : il faut pouvoir garder au moins {a} € après le rachat.",{a:TRADE_MIN_CAP})}</div>`;
  else { const opps=humanOpponents();
    if(!opps.some(p=>(p.hand||[]).length)) h+=`<div class="mini muted" style="margin-top:6px">${t("Aucune carte à racheter pour le moment — les autres joueurs ont déjà joué leurs bonus (ou n'en ont pas en main).")}</div>`;
    else { h+=`<div class="mini muted" style="margin-top:4px">${t("Ton capital : <b>{a} €</b> — jusqu'à <b>{b} €</b> dépensables (garder {c} €).",{a:Math.round(cap),b:Math.round(cap-TRADE_MIN_CAP),c:TRADE_MIN_CAP})}</div>`;
      opps.forEach(p=>{ const hand=(p.hand||[]); if(!hand.length) return;
        h+=`<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px"><div class="mini"><b>${nm(p)}</b> <span class="muted">· 💰 ${eur(p.capital||0)} €</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${hand.map(id=>{ const eng=cardEngaged(id);
          return `<button class="btn ghost sm" ${eng?'disabled style="opacity:.5"':''} onclick="proposeBuy('${p.id}','${id}')">${CARDS[id]?CARDS[id].e:'?'} ${esc(t(CARDS[id]?CARDS[id].n:id))}${eng?' ⏳':''}</button>`; }).join("")}</div></div>`; }); } }
  h+=`</div>`;
  // --- VENDRE (je propose une de MES cartes) ---
  h+=`<div class="box"><b class="mini">💰 ${t("Vendre une de mes cartes")}</b>`;
  const myHand=(meP&&meP.hand)||[];
  if(!S.recap && myBet()) h+=`<div class="mini muted" style="margin-top:6px">${t("Tu ne peux pas vendre tant que ton pari du jour est validé — attends la résolution de la journée.")}</div>`;
  else if(!humanOpponents().length) h+=`<div class="mini muted" style="margin-top:6px">${t("Aucun adversaire pour l'instant.")}</div>`;
  else if(!myHand.length) h+=`<div class="mini muted" style="margin-top:6px">${t("Tu n'as aucune carte en main à vendre.")}</div>`;
  else { h+=`<div class="mini muted" style="margin-top:4px">${t("Choisis une carte à proposer aux autres (leur cagnotte est indiquée).")}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${myHand.map(id=>{ const eng=cardEngaged(id);
      return `<button class="btn ghost sm" ${eng?'disabled style="opacity:.5"':''} onclick="proposeSell('${id}')">${CARDS[id]?CARDS[id].e:'?'} ${esc(t(CARDS[id]?CARDS[id].n:id))}${eng?' ⏳':''}</button>`; }).join("")}</div>`; }
  h+=`</div>`;
  return h;
}

// mbox commune (achat/vente) : champ prix + petit mot
function tradeModal(emoji,titleHTML,subHTML,bodyHTML,onSend){
  closeCardInfo();
  const o=document.createElement("div"); o.id="cardModal"; o.className="modal";
  o.addEventListener("click",e=>{ if(e.target===o) closeCardInfo(); });
  o.innerHTML=`<div class="mbox"><div style="font-size:34px">${emoji}</div>
    <h2 style="margin:6px 0 4px">${titleHTML}</h2>${subHTML}${bodyHTML}
    <input id="tradeMsg" maxlength="140" placeholder="${t("un petit mot (optionnel)")}" style="width:100%;box-sizing:border-box;padding:10px;margin-top:8px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:inherit;font-size:16px">
    <div class="row" style="gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="${onSend}">${t("Envoyer l'offre")}</button>
    <button class="btn ghost" style="flex:1" onclick="closeCardInfo()">${t("Annuler")}</button></div></div>`;
  document.body.appendChild(o);
}
function priceInput(mx){ return `<input id="tradePrice" type="number" inputmode="numeric" min="1" ${mx?`max="${mx}"`:''} placeholder="${t("ex : {a} €",{a:mx?Math.min(10,mx):5})}" style="width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:inherit;font-size:16px">`; }
// RACHETER : j'achète la carte d'un adversaire
function proposeBuy(sellerId, cardId){
  if(!requireOpt('rachat')) return;   // initier un rachat = option premium
  const meP=me(); if(!meP) return; const seller=pById(sellerId); const C=CARDS[cardId];
  const maxP=Math.round((meP.capital||0)-TRADE_MIN_CAP);
  if(maxP<1){ toast(t("Ton capital est trop faible pour proposer un rachat.")); return; }
  tradeModal(C?C.e:'🤝', t("Racheter {c}",{c:esc(t(C?C.n:cardId))}),
    `<div class="mini muted">${t("à {a}",{a:avatarHTML(seller&&seller.emoji,18)+' '+esc((seller&&seller.name)||'?')})}</div>${C?`<div class="mini muted" style="margin:8px 0;text-align:left">${esc(t(C.d))}</div>`:''}`,
    `<div class="mini" style="margin-top:8px;text-align:left">${t("Prix proposé (€) — entre 1 et {a} :",{a:maxP})}</div>${priceInput(maxP)}`,
    `submitBuy('${sellerId}','${cardId}',${maxP})`);
}
async function submitBuy(sellerId, cardId, maxP){
  const price=Math.round(+((document.getElementById("tradePrice")||{}).value||0));
  const msg=((document.getElementById("tradeMsg")||{}).value||"").slice(0,140);
  if(!(price>=1)){ toast(t("Entre un prix valide.")); return; }
  if(price>maxP){ toast(t("Prix trop élevé : il te resterait moins de {a} €.",{a:TRADE_MIN_CAP})); return; }
  closeCardInfo();
  try{
    const meP=me(); if(!meP) return;
    if((meP.capital||0)-price < TRADE_MIN_CAP){ toast(t("Prix trop élevé : il te resterait moins de {a} €.",{a:TRADE_MIN_CAP})); return; }
    if(await hasBetForDay(S.myId, L.current_day)){ tradeBloque(t("<b>Ton pari du jour est déjà validé.</b> Tu ne peux donc pas proposer un rachat maintenant.")); return; }
    const seller=await q(db.from("players").select("hand").eq("id",sellerId).single());
    if(!seller || !(seller.hand||[]).includes(cardId)){ toast(t("Cette carte n'est plus disponible.")); await refresh(); return; }
    if(await cardHasPendingTrade(cardId)){ toast(t("Cette carte fait déjà l'objet d'une offre en attente.")); await refresh(); return; }
    await q(db.from("trades").insert({league_id:L.id, kind:"buy", from_player:S.myId, to_player:sellerId, card_id:cardId, price:price, msg:msg||null}));
    infoWin(t("Offre envoyée.")); await refresh();
  }catch(e){ infoWin(t("⚠️ Une erreur est survenue")+" : "+esc(e.message),"⚠️"); }
}
// VENDRE : je propose une de MES cartes à un joueur (il paie, il la reçoit)
function proposeSell(cardId){
  if(!requireOpt('rachat')) return;   // initier une vente = option premium
  const meP=me(); if(!meP) return; const C=CARDS[cardId]; const opps=humanOpponents();
  if(!opps.length){ toast(t("Aucun adversaire pour l'instant.")); return; }
  tradeModal(C?C.e:'💰', t("Vendre {c}",{c:esc(t(C?C.n:cardId))}),
    `${C?`<div class="mini muted" style="margin:8px 0;text-align:left">${esc(t(C.d))}</div>`:''}<div class="mini" style="text-align:left">${t("À qui ?")}</div>
     <select id="sellTarget" style="width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:inherit;font-size:16px">${opps.map(p=>`<option value="${p.id}">${avaName(p)} · 💰 ${eur(p.capital||0)} €</option>`).join("")}</select>`,
    `<div class="mini" style="margin-top:10px;text-align:left">${t("Prix (€) :")}</div>${priceInput(0)}`,
    `submitSell('${cardId}')`);
}
async function submitSell(cardId){
  const target=(document.getElementById("sellTarget")||{}).value;
  const price=Math.round(+((document.getElementById("tradePrice")||{}).value||0));
  const msg=((document.getElementById("tradeMsg")||{}).value||"").slice(0,140);
  if(!target){ toast(t("Choisis un joueur.")); return; }
  if(!(price>=1)){ toast(t("Entre un prix valide.")); return; }
  closeCardInfo();
  try{
    const meP=me(); if(!meP || !((meP.hand||[]).includes(cardId))){ toast(t("Tu ne détiens plus cette carte.")); await refresh(); return; }
    if(await hasBetForDay(S.myId, L.current_day)){ tradeBloque(t("<b>Ton pari du jour est déjà validé.</b> Tu ne peux donc pas mettre une carte en vente maintenant.")); return; }
    if(await cardHasPendingTrade(cardId)){ toast(t("Cette carte fait déjà l'objet d'une offre en attente.")); await refresh(); return; }
    await q(db.from("trades").insert({league_id:L.id, kind:"sell", from_player:S.myId, to_player:target, card_id:cardId, price:price, msg:msg||null}));
    infoWin(t("Offre envoyée.")); await refresh();
  }catch(e){ infoWin(t("⚠️ Une erreur est survenue")+" : "+esc(e.message),"⚠️"); }
}

function tradeReply(id){ return (((document.getElementById("rp_"+id)||{}).value||"").slice(0,140))||null; }
async function acceptTrade(id){
  const o=trades.find(x=>x.id===id); if(!o){ await refresh(); return; } const price=Math.round(o.price); const reply=tradeReply(id);
  // owner = celui qui DONNE la carte ; buyer = celui qui PAIE et la reçoit. Dépend du sens.
  const ownerId = o.kind==="sell" ? o.from_player : o.to_player;
  const buyerId = o.kind==="sell" ? o.to_player   : o.from_player;
  try{
    const owner=await q(db.from("players").select("id,capital,hand").eq("id",ownerId).single());
    const buyer=await q(db.from("players").select("id,capital,hand").eq("id",buyerId).single());
    if(!owner||!buyer){ toast(t("Offre introuvable.")); await refresh(); return; }
    if(!(owner.hand||[]).includes(o.card_id)){ toast(t("La carte n'est plus disponible.")); await markTrade(id,"cancelled",reply); await refresh(); return; }
    if((buyer.capital||0)-price < TRADE_MIN_CAP){ toast(t("Capital insuffisant pour cet achat — offre annulée.")); await markTrade(id,"cancelled",reply); await refresh(); return; }
    if(await hasBetForDay(ownerId, L.current_day)){ tradeBloque(t("<b>Le détenteur de la carte a déjà validé son pari du jour.</b> Il pourrait encore la jouer aujourd'hui, l'échange est donc bloqué.")); return; }
    if(await hasBetForDay(buyerId, L.current_day)){ tradeBloque(t("<b>L'acheteur a déjà validé son pari du jour.</b> L'échange est donc bloqué jusqu'à la résolution.")); return; }
    const oHand=(owner.hand||[]).filter(x=>x!==o.card_id); const bHand=[...(buyer.hand||[]), o.card_id];
    await q(db.from("players").update({hand:oHand, capital:tr2((owner.capital||0)+price)}).eq("id",ownerId));
    await q(db.from("players").update({hand:bHand, capital:tr2((buyer.capital||0)-price)}).eq("id",buyerId));
    await markTrade(id,"accepted",reply,(L&&L.current_day)||0);
    infoWin(o.kind==="sell" ? t("Acheté ! {c} est à toi (−{b} €).",{c:t(CARDS[o.card_id]?CARDS[o.card_id].n:o.card_id),b:price}) : t("Vendu ! +{b} € reçus.",{b:price}), "🤝");
    await refresh();
  }catch(e){ infoWin(t("⚠️ Une erreur est survenue")+" : "+esc(e.message),"⚠️"); }
}
async function refuseTrade(id){ const reply=tradeReply(id); await markTrade(id,"refused",reply); infoWin(t("Offre refusée.")); await refresh(); }
async function cancelTrade(id){ await markTrade(id,"cancelled",null); infoWin(t("Offre annulée.")); await refresh(); }

     <div class="mini muted" style="margin:6px 0">${t("Au démarrage, phase de <b>préparation</b> : chacun vote pour le gage <b>et</b> mise en aveugle sur les bonus, sans attendre les autres. Chaque bonus revient au <b>plus offrant</b> (égalité → premier à avoir misé) ; les non-gagnants sont <b>remboursés</b>. Total des mises ≤ <b>{a} €</b>, jusqu'à autant de bonus que de journées. Les mises gagnantes sont retirées de ton <b>capital de départ</b>. 1 carte jouée max par journée. Certaines cartes sont <b>à cible</b> 🎯 : tu choisis toi-même le match concerné au moment de parier.",{a:SHOP_CAP})}</div>
     ${cardsAZ().map(card).join("")}</div>

   <div class="box"><b>${t("😴 Oubli")}</b><div class="mini muted" style="margin-top:6px">${t("Pas de validation à temps → <b>aucun pari pris en compte</b>, <b>{b} pt</b> au classement et <b>−{a} % du capital</b>.",{a:pct(forgotPenShown()),b:forgotPtsShown()})}
     <br><br>${t("💤 <b>Ligue abandonnée</b> : si <b>plus personne</b> ne joue pendant <b>{a} jours</b>, la ligue se ferme toute seule. Elle est alors considérée comme <b>fermée avant son terme</b> : <b>aucun vainqueur, aucun perdant</b>, et <b>ni gage ni récompense</b> ne s'appliquent. Elle ne compte pas non plus dans les statistiques.",{a:LIGUE_FERME_J})}</div></div>
   <button class="btn ghost" onclick="openRulesFull()">${t("📚 Voir les règles détaillées →")}</button>`;
}

/* ============ RÈGLES DÉTAILLÉES ============
 * ⚠️ À LIRE AVANT DE MODIFIER UNE RÈGLE DU JEU.
 * Cet écran est la référence complète. Il est écrit pour ne PAS pouvoir mentir sur ce qui est
 * calculable : toutes les valeurs chiffrées sont INJECTÉES depuis les constantes du moteur
 * (STAKE_CAP, STAKE_CAP_INVEST, FORGOT_PENALTY, SHOP_CAP, RECAP_THRESHOLD, RECAP_TARGET,
 * CUSTOM_MAX, DBL_FACTOR), les listes viennent des tables (CARDS, GAGES, REWARDS, MODES,
 * FORMULAS) et les passages qui dépendent du mode se calculent (isBoth/isReward). Changer une
 * constante ou ajouter une carte met donc ces règles à jour TOUT SEUL.
 * ⚠️ CE QUI PEUT ENCORE MENTIR : la PROSE — « qui choisit quoi », le barème des duels, l'ordre
 * des phases. C'est exactement là qu'ont eu lieu toutes les dérives constatées le 2026-07-16
 * (« le gage voté au départ » = règle d'avant la v4.09 ; « le dernier fait le gage » affiché même
 * en mode récompense ; le malus « −1 pt » annoncé alors qu'il était supprimé).
 * → RÈGLE DE TRAVAIL : toute modification d'une règle du jeu se fait DANS LE MÊME COMMIT que la
 *   mise à jour de cet écran. Aucune automatisation ne remplace ça.
 */
function viewRulesFull(){
  const card=id=>`<div style="display:flex;gap:10px;align-items:flex-start;margin:9px 0"><span class="sport" style="flex:0 0 auto">${CARDS[id].e}</span><div><div class="row" style="gap:6px;justify-content:flex-start;flex-wrap:wrap"><b class="mini">${esc(t(CARDS[id].n))}</b>${forceHTML(id)}${riskHTML(id)}${CARDS[id].t?'<span class="tag">'+t("🎯 à cible")+'</span>':''}</div><div class="mini muted">${esc(t(CARDS[id].d))}</div></div></div>`;
  const li=s=>`<li style="margin:4px 0">${s}</li>`;
  const sec=(titre,corps)=>`<div class="box"><b>${titre}</b><div class="mini muted" style="margin-top:6px;line-height:1.75">${corps}</div></div>`;
  return `<button class="btn ghost sm" onclick="closeRulesFull()">${t("← Retour")}</button>

   ${sec(t("🗓️ Le calendrier"), t("<b>Aller-retour intégral</b> : chacun rencontre chacun <b>exactement deux fois</b>, une fois à domicile et une fois à l'extérieur. Une ligue de <b>n</b> joueurs dure donc <b>2 × (n − 1) journées</b> (ex. 6 joueurs → 10 journées ; 12 joueurs → 22). Si le nombre d'humains est <b>impair</b>, un 🤖 <b>joueur IA</b> complète l'effectif pour équilibrer : il joue normalement mais ne subit ni gage ni récompense.")+' <i>'+t("(le 🤖 joueur IA est une option premium — à souscrire ; paiement désactivé pendant les tests)")+'</i>')}

/* ============ boot ============ */
// === ANTI-CACHE — détecte une version plus récente en ligne et propose de recharger ===========
// Problème : les navigateurs (surtout iPhone) gardent l'ancien index.html en cache → le joueur
// reste sur une vieille version. Solution : au démarrage (et au retour d'onglet), on re-télécharge
// SA PROPRE page en `no-store` (même origine, donc pas de CORS), on lit l'APP_VERSION servie, et si
// elle est plus récente que celle en cours d'exécution, on affiche un bandeau « Recharger ».
function verNum(v){ const p=String(v||"").replace(/^v/,'').split('.').map(n=>parseInt(n,10)||0); return (p[0]||0)*100000+(p[1]||0); }
let updBannerShown=false;
async function checkForUpdate(){
  try{
    const r=await fetch(location.pathname+"?v="+Date.now(), {cache:"no-store"}); if(!r.ok) return;
    const txt=await r.text(); const m=txt.match(/APP_VERSION\s*=\s*"(v[\d.]+)"/);
    if(m && verNum(m[1])>verNum(APP_VERSION)) showUpdateBanner();
  }catch(e){}
}
function showUpdateBanner(){
  if(updBannerShown || document.getElementById("updBanner")) return; updBannerShown=true;
  const b=document.createElement("div"); b.id="updBanner";
  b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--accent);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;box-shadow:0 -2px 12px rgba(0,0,0,.35)";
  // `width:auto` OBLIGATOIRE (v7.03) : `.btn` porte `width:100%`, et avec `flex:0 0 auto` le
  // bouton ne peut pas rétrécir — il prendrait toute la largeur du bandeau et écraserait le texte.
  // Même cause que le bouton « Envoyer » du formulaire de remontée, signalé par Hervé.
  b.innerHTML=`<span>${t("🔄 Nouvelle version disponible.")}</span><button class="btn" style="background:#fff;color:var(--accent);flex:0 0 auto;width:auto;padding:6px 12px" onclick="location.replace(location.pathname+'?v='+Date.now())">${t("Recharger")}</button>`;
  document.body.appendChild(b);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkForUpdate(); });
(async function boot(){
  if(!window.supabase){ showErr("Librairie Supabase non chargée (vérifie ta connexion Internet)."); return; }
  initSwipeNav();   // v6.42 : swipe horizontal pour changer d'onglet
  checkForUpdate();
  try{ const { data:{ session } } = await db.auth.getSession();
    if(session){ AUTH={ id:session.user.id, name:(session.user.user_metadata&&session.user.user_metadata.username)||"", avatar:(session.user.user_metadata&&session.user.user_metadata.avatar)||"", options:(session.user.user_metadata&&Array.isArray(session.user.user_metadata.options))?session.user.user_metadata.options:null }; }
  }catch(e){}
  if(!AUTH){ S.view="auth"; render(); return; }
  const last=loadLast();
  if(last&&last.leagueId){ S.leagueId=last.leagueId; S.myId=last.myId; S.view="game"; startPoll(); refresh(); }
  else { S.view="home"; loadMyLeagues(); }
})();
</script>
