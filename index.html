  "Ex. : rejouer une ligue terminée à l'identique":"E.g. replay a finished league with the same setup",
  "<b>But :</b> championnat de pronostics entre amis, sur de vrais événements et de vraies cotes. On démarre à <b>100 € virtuels</b> ; le vainqueur est celui qui a le plus de <b>points de championnat</b>.":"<b>Goal:</b> a prediction championship among friends, on real events and real odds. Everyone starts with <b>100 virtual €</b>; the winner is whoever has the most <b>championship points</b>.",
  "📚 Voir les règles détaillées →":"📚 See the detailed rules →", "📚 Règles détaillées":"📚 Detailed rules",
  "📚 Comment marche le jeu":"📚 How the game works",
  "Le fonctionnement complet, dans le détail : calendrier, mises, Capitaine, points, cartes bonus, enjeu final.":"How it all works, in detail: schedule, stakes, Captain, points, bonus cards, final stake.",
  "Le fonctionnement complet du jeu, dans le détail. Pour un aperçu rapide, vois plutôt <b>📖 Règles du jeu</b>.":"How the game works, in full detail. For a quick overview, see <b>📖 Game rules</b> instead.",
  "🎯 Le principe":"🎯 The principle",
  "Un championnat de pronostics entre amis. Chacun démarre avec <b>100 € virtuels</b> — les paris se jouent en <b>argent fictif</b>, l'application ne prélève rien sur les mises. Chaque journée t'oppose à un adversaire en <b>duel</b> ; le vainqueur du duel marque des <b>points de championnat</b>. À la fin, c'est le total de <b>points</b> qui désigne le champion — pas le capital.":"A prediction championship among friends. Everyone starts with <b>100 virtual €</b> — bets are played in <b>play money</b>, the app takes no cut of the stakes. Each matchday pits you against one opponent in a <b>duel</b>; the duel winner scores <b>championship points</b>. At the end, the <b>points</b> total crowns the champion — not the balance.",
  "🗓️ Le calendrier":"🗓️ The schedule",
  "<b>Aller-retour intégral</b> : chacun rencontre chacun <b>exactement deux fois</b>, une fois à domicile et une fois à l'extérieur. Une ligue de <b>n</b> joueurs dure donc <b>2 × (n − 1) journées</b> (ex. 6 joueurs → 10 journées ; 12 joueurs → 22). Si le nombre d'humains est <b>impair</b>, un 🤖 <b>joueur IA</b> complète l'effectif pour équilibrer : il joue normalement mais ne subit ni gage ni récompense.":"<b>Full home-and-away</b>: everyone meets everyone <b>exactly twice</b>, once at home and once away. A league of <b>n</b> players therefore runs <b>2 × (n − 1) matchdays</b> (e.g. 6 players → 10 matchdays; 12 players → 22). If the number of humans is <b>odd</b>, a 🤖 <b>AI player</b> fills in to balance the draw: it plays normally but never takes a forfeit or a reward.",
  "⚽ Une journée, étape par étape":"⚽ A matchday, step by step",
  "Le joueur <b>à domicile</b> choisit les <b>5 rencontres</b> du duel. Elles s'imposent aux deux joueurs. S'il ne choisit pas avant l'échéance, elles sont tirées automatiquement — <b>son adversaire n'est jamais pénalisé</b> pour ça.":"The <b>home</b> player picks the duel's <b>5 fixtures</b>. They apply to both players. If they don't pick before the deadline, the fixtures are drawn automatically — <b>their opponent is never penalised</b> for it.",
  "Chacun pose ses <b>pronostics et ses mises</b>, en secret. Le total des mises ne peut pas dépasser <b>{a} % de ton capital</b> ({b} % avec la carte Investisseur).":"Each player places their <b>picks and stakes</b>, in secret. Total stakes can't exceed <b>{a}% of your balance</b> ({b}% with the Investor card).",
  "Tu désignes un <b>👑 Capitaine</b> : sur ce pari, ton <b>gain ET ta perte sont doublés</b>.":"You name a <b>👑 Captain</b>: on that bet, your <b>gain AND your loss are doubled</b>.",
  "Tu peux jouer <b>une carte bonus</b> (une seule par journée). Elle reste <b>secrète</b> jusqu'à la résolution.":"You may play <b>one bonus card</b> (only one per matchday). It stays <b>secret</b> until resolution.",
  "À la <b>clôture</b>, les pronos de tout le monde peuvent être révélés — <b>uniquement en matchs réels</b> et si l'option premium <b>Voir l'adversaire</b> a été souscrite. En <b>matchs simulés</b>, la journée se résout aussitôt, sans phase de découverte. Les cartes, elles, restent cachées jusqu'aux résultats.":"At the <b>close</b>, everyone's picks may be revealed — <b>only in real-match mode</b> and if the premium <b>See the opponent</b> option was purchased. In <b>simulated matches</b>, the day resolves right away, with no reveal phase. The cards stay hidden until the results.",
  "Une fois les matchs terminés, la journée est <b>résolue</b> : gains, points, classement.":"Once the matches are over, the matchday is <b>resolved</b>: winnings, points, standings.",
  "💰 Gains et pertes":"💰 Winnings and losses",
  "<b>Pari gagné</b> : tu empoches <b>mise × (cote − 1)</b>. <b>Pari perdu</b> : tu perds ta <b>mise</b>.":"<b>Bet won</b>: you pocket <b>stake × (odds − 1)</b>. <b>Bet lost</b>: you lose your <b>stake</b>.",
  "<b>🛟 Le filet de sécurité :</b> la <b>perte maximale possible</b> de la journée ne peut jamais dépasser ton capital. L'application refuse un pari qui pourrait te faire finir dans le négatif — si le bouton bloque, baisse la mise de ton Capitaine. <b>Ton capital ne descend jamais sous 0.</b>":"<b>🛟 The safety net:</b> the matchday's <b>maximum possible loss</b> can never exceed your balance. The app refuses a bet that could leave you negative — if the button is blocked, lower your Captain's stake. <b>Your balance never drops below 0.</b>",
  "<b>💸 Recapitalisation :</b> si un joueur finit une journée sous <b>{a} €</b>, il n'a plus de quoi miser vraiment : son capital est <b>remonté à {b} €</b> pour rester dans la course, en échange de <b>−1 point</b> de championnat (lui seul est concerné).":"<b>💸 Top-up:</b> if a player ends a matchday below <b>€{a}</b>, they no longer have enough to bet meaningfully: their balance is <b>raised to €{b}</b> to stay in the race, in exchange for <b>−1 championship point</b> (only they are affected).",
  "On <b>remonte à</b> {b} €, on n'ajoute pas {b} € : que tu finisses à {c} € ou à 2 €, tu repars avec {b} €. Perdre davantage ne rapporte donc rien.":"It's a <b>raise to</b> €{b}, not a €{b} bonus: whether you end on €{c} or on €2, you restart with €{b}. So losing more gains you nothing.",
  "<b>{a}</b> étai{e}t sous <b>{c} €</b> — capital remonté à <b>{b} €</b> pour rester dans la course, en échange de <b>−1 pt</b> de championnat. 🤝":"<b>{a}</b> — below <b>€{c}</b>, balance raised to <b>€{b}</b> to stay in the race, in exchange for <b>−1 championship point</b>. 🤝",
  "🏆 Points et classement":"🏆 Points and standings",
  "Le <b>vainqueur du duel</b> est celui au <b>meilleur résultat net</b> (gains − mises). À <b>net égal</b>, c'est un <b>match nul</b> — ni le gain ni la mise ne départagent.":"The <b>duel winner</b> is the one with the <b>best net result</b> (winnings − stakes). At <b>equal net</b>, it's a <b>draw</b> — neither gain nor stake breaks the tie.",
  "<b>Vainqueur</b> : <b>3 pts</b> si son net est positif, <b>1 pt</b> s'il est négatif. <b>Perdant</b> : <b>1 pt</b> si son net est positif, <b>0 pt</b> s'il est négatif. <b>Match nul</b> : <b>1 pt</b> chacun.":"<b>Winner</b>: <b>3 pts</b> if their net is positive, <b>1 pt</b> if negative. <b>Loser</b>: <b>1 pt</b> if their net is positive, <b>0 pt</b> if negative. <b>Draw</b>: <b>1 pt</b> each.",
  "<b>⭐ Meilleur pronostiqueur :</b> chaque journée, le joueur au plus gros net de <b>toute la ligue</b> gagne <b>+1 point</b> en plus.":"<b>⭐ Best forecaster:</b> each matchday, the player with the biggest net in the <b>whole league</b> gets <b>+1 point</b> on top.",
  "<b>Départage au classement final</b> (à points égaux) : capital, puis victoires en duel, puis plus gros gain, puis plus grosse cote.":"<b>Final standings tie-break</b> (equal points): balance, then duel wins, then biggest gain, then biggest odds.",
  "<b>▲ = ▼ Le classement</b> montre, à côté de chaque joueur, s'il <b>monte</b> (▲ vert), <b>reste stable</b> (=) ou <b>descend</b> (▼ rouge) par rapport à la journée précédente — <b>purement indicatif</b>.":"<b>▲ = ▼ The standings</b> show, next to each player, whether they <b>climb</b> (green ▲), <b>hold</b> (=) or <b>drop</b> (red ▼) versus the previous matchday — <b>purely indicative</b>.",
  "Gagne {a} place(s) depuis la journée précédente":"Up {a} place(s) since the previous matchday",
  "Perd {a} place(s) depuis la journée précédente":"Down {a} place(s) since the previous matchday",
  "Position inchangée":"Position unchanged",
  "😴 Le pari non validé à temps":"😴 Picks not submitted in time",
  "Si tu ne valides pas avant la clôture : <b>aucun pari</b> n'est pris en compte.":"If you don't submit before the close: <b>no bet</b> is counted.",
  "Tu prends <b>−2 pts</b> au classement et tu perds <b>{a} %</b> de ton capital.":"You take <b>−2 pts</b> in the standings and lose <b>{a}%</b> of your balance.",
  "Ton adversaire, lui, <b>gagne le duel</b> — mais uniquement <b>3 pts</b> si son net est positif, <b>1 pt</b> sinon. Il ne peut pas perdre d'argent à cause de ton absence.":"Your opponent <b>wins the duel</b> — but only <b>3 pts</b> if their net is positive, <b>1 pt</b> otherwise. They cannot lose money because of your absence.",
  "🃏 Les cartes bonus":"🃏 The bonus cards",
  "Au démarrage, chacun <b>mise en aveugle</b> sur les cartes qu'il veut. Chaque carte revient au <b>plus offrant</b> — en cas d'égalité, au <b>premier</b> à avoir misé ce montant. Les <b>non-gagnants ne paient rien</b>.":"At the start, everyone <b>bids blindly</b> on the cards they want. Each card goes to the <b>highest bidder</b> — on a tie, to the <b>first</b> to have bid that amount. <b>Losing bidders pay nothing</b>.",
  "Total des mises ≤ <b>{a} €</b>, et pas plus de cartes que de journées. <b>Ce que tu remportes est retiré de tes 100 € de départ</b> — ce que tu ne dépenses pas te reste comme capital.":"Total bids ≤ <b>€{a}</b>, and no more cards than there are matchdays. <b>What you win is deducted from your starting €100</b> — what you don't spend stays as your balance.",
  "<b>Une carte = un seul propriétaire</b> dans la ligue, et <b>une seule carte jouée par journée</b>. Une carte jouée est consommée.":"<b>One card = one owner</b> in the league, and <b>only one card played per matchday</b>. A played card is consumed.",
  "Les cartes <b>🎯 à cible</b> demandent de désigner un match au moment de parier. <b>💪 x/5</b> indique la force <i>indicative</i> d'une carte, c'est-à-dire ce qu'elle peut te <b>rapporter</b>. À côté, une seconde pastille dit ce qu'elle peut te <b>coûter</b> : <b>🟢 Sans risque</b> (au pire elle ne sert à rien, elle ne peut jamais se retourner contre toi) ou <b>⚔️ Double tranchant</b> (elle peut rapporter gros… comme avantager ton adversaire, ou amplifier tes pertes). Les secondes ne sont pas à éviter — ce sont les cartes des joueurs qui assument leurs pronos.":"<b>🎯 Targeted</b> cards require you to name a match when betting. <b>💪 x/5</b> shows a card's <i>indicative</i> strength.",
  "⚠️ Le <b>👑 Capitaine</b> et un bonus doivent être sur des <b>matchs différents</b> — sauf 🏷️ Deux pour le prix d'un, 🎁 Chérie c'est cadeau et 🤛 Dans ta face.":"⚠️ The <b>👑 Captain</b> and a bonus must be on <b>different matches</b> — except 💥 Two for One, 🎁 Honey I Got You a Gift and 🤛 In Your Face.",
  "Les {a} cartes":"The {a} cards", "🎯 à cible":"🎯 targeted",
  "🎭 L'enjeu final":"🎭 The final stake",
  "À l'ouverture, l'organisateur choisit l'enjeu de la ligue : <b>gage</b> au dernier, <b>récompense</b> au champion, ou <b>les deux</b>.":"When opening the league, the organiser picks the stake: <b>forfeit</b> for the last-placed player, <b>reward</b> for the champion, or <b>both</b>.",
  "<b>La règle est unique : celui qui choisit n'est jamais le destinataire.</b>":"<b>One rule only: whoever chooses is never the one who receives.</b>",
  "🎭 Le <b>gage</b> est infligé au <b>dernier</b>, et c'est le <b>vainqueur</b> qui l'a voté.":"🎭 The <b>forfeit</b> goes to the <b>last-placed player</b>, and it's the <b>winner</b> who voted for it.",
  "🏆 La <b>récompense</b> revient au <b>champion</b>, et c'est le <b>dernier</b> qui l'a votée.":"🏆 The <b>reward</b> goes to the <b>champion</b>, and it's the <b>last-placed player</b> who voted for it.",
  "<i>Pourquoi ce sens :</i> un gage n'est subi que par une personne, alors qu'une récompense est offerte par <b>tous les autres</b>. Faire choisir la récompense par celui qui la paiera évite qu'un joueur impose une dépense au groupe.":"<i>Why this way round:</i> a forfeit is borne by one person, whereas a reward is given by <b>everyone else</b>. Letting the reward be chosen by whoever will pay for it stops one player imposing a cost on the group.",
  "Le vote a lieu à la <b>préparation</b>, avant la 1re journée : <b>personne ne sait où il finira</b>. Ton vote est donc un pari à l'aveugle, révélé à la fin — c'est ce qui tient le suspense.":"The vote happens at the <b>preparation</b> step, before matchday 1: <b>nobody knows where they'll finish</b>. Your vote is therefore a blind wish, revealed at the end — that's what keeps the suspense.",
  "Avec l'option premium <b>Gage sur mesure</b>, tu peux proposer <b>ton propre texte</b> (max {a} caractères) au lieu d'une option de la liste. <b>Le vote est obligatoire</b> pour valider ta préparation.":"With the premium option <b>Custom forfeit</b>, you can suggest <b>your own text</b> (max {a} characters) instead of an option from the list. <b>Voting is mandatory</b> to confirm your preparation.",
  "Si celui du pôle n'a pas voté : on prend le choix <b>strictement majoritaire</b> ; sinon on avance depuis ce pôle (2ᵉ, 3ᵉ…) jusqu'au premier votant.":"If the player at that end didn't vote: the <b>strict majority</b> choice applies; otherwise we move along from that end (2nd, 3rd…) to the first voter.",
  "⚠️ Gages et récompenses se règlent <b>entre vous, hors application</b> — elle ne gère aucun argent et n'encaisse rien.":"⚠️ Forfeits and rewards are settled <b>between you, outside the app</b> — it handles no money and collects nothing.",
  "🎛️ Les options de la ligue":"🎛️ League options",
  "Mode de jeu":"Game mode", "Formule de rythme":"Pace format", "Données":"Data",
  "• <b>🎮 Simulé</b> — matchs et cotes fictifs, résultats tirés selon leurs probabilités (part d'aléa). Sans attendre de vrais matchs : pour jouer entre amis, jusqu'à une partie entière en une soirée.":"• <b>🎮 Simulated</b> — fictional matches and odds, results drawn from their probabilities (some randomness). No real match to wait for: to play among friends, up to a whole game in one evening.",
  "• <b>📡 Données réelles</b> — vrais matchs, vraies cotes, vrais résultats : pour prouver qui est le meilleur sur du concret. Une journée ne se résout qu'une fois <b>tous</b> les matchs réellement joués.":"• <b>📡 Real data</b> — real matches, real odds, real results: to prove who's the best for real. A matchday only resolves once <b>all</b> matches have actually been played.",

function t(s,subs){ let out=(lang==="en"&&EN[s]!=null)?EN[s]:s; if(subs){ for(const k in subs) out=out.split("{"+k+"}").join(subs[k]); }
  // Espace INSÉCABLE entre un nombre et son unité : « 10 € » ne doit jamais se retrouver coupé en
  // fin de ligne (constaté à 320 px dans les règles). C'est aussi la typographie française correcte.
  // Fait ici plutôt que dans chaque chaîne : les montants sont injectés via {a}, donc l'espace ne
  // devient visible qu'après substitution.
  if(out.indexOf("€")>=0 || out.indexOf("%")>=0) out=out.replace(/(\d)\s+([€%])/g,"$1 $2");
  return out; }
function applyLangBtn(){ const b=$("langBtn"); if(b) b.textContent = lang==="en"?"🇫🇷":"🇬🇧"; }
function toggleLang(){ lang=lang==="en"?"fr":"en"; try{ localStorage.setItem("pl_lang",lang); }catch(e){} applyLangBtn(); render(); }
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=n=>Math.round((+n||0)*100)/100;                       // arrondi à 2 décimales
const fmt=n=>{ const r=r2(n); return (r>=0?"+":"")+r.toFixed(2); }; // gain signé, 2 décimales
const eur=n=>r2(n).toFixed(2);                                 // montant non signé, 2 décimales
// Cote AFFICHÉE : toujours 2 décimales. Les cotes sont stockées arrondies au centième, mais
// JavaScript supprime les zéros de fin — « 2.10 » sortait « 2.1 » et « 3.00 » sortait « 3 ».
// À n'utiliser que pour l'affichage : les comparaisons doivent rester sur le nombre.
const cote=o=>(+o||0).toFixed(2);
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// `lecture_seule` : message technique lancé par `q()` quand une écriture est tentée en mode
// consultation (v7.11). Il remonte par les `catch` de tout l'app — on le traduit ici, en un
// seul endroit, plutôt que d'aller modifier chaque appelant.
function showErr(m){ if(m && /lecture_seule/.test(m)) m="👁️ Mode consultation : aucune modification n'est possible sur la ligue d'un autre groupe.";
  $("err").innerHTML = m?`<div class="err">${esc(m)}</div>`:""; }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
// Fenêtre d'info FERMABLE manuellement (bouton OK) — pour les CONFIRMATIONS et RÉSULTATS qu'on doit
// avoir le temps de lire (demandé par Hervé : les toasts fugaces se rataient). Les retours de
// validation instantanés pendant la saisie restent des toasts : un modal bloquant à chaque geste
// serait pénible. `msg` peut contenir du HTML (nos propres libellés).
function infoWin(msg,emoji){ infoModal(emoji||"✅","", `<div style="text-align:center;line-height:1.55;font-size:15px">${msg}</div>`); }
// `sansOk` (facultatif, v7.01) : supprime le bouton « OK 👍 » ajouté d'office. Sur une modale de
// LECTURE il conclut bien ; sur un FORMULAIRE il devient un deuxième bouton principal à côté de
// « Envoyer », et on ne sait plus lequel valide (signalé par Hervé). L'appelant fournit alors ses
// propres boutons. ⚠️ Qui passe `sansOk` DOIT proposer une sortie (annuler), sinon la modale
// n'aurait plus qu'un clic hors cadre pour se fermer — invisible pour la plupart des joueurs.
function infoModal(emoji,title,bodyHTML,sansOk){ closeCardInfo();
  const o=document.createElement("div"); o.id="cardModal"; o.className="modal";
  o.addEventListener("click",e=>{ if(e.target===o) closeCardInfo(); });
  const ok=sansOk?"":`<button class="btn" style="margin-top:16px" onclick="closeCardInfo()">OK 👍</button>`;
  o.innerHTML=`<div class="mbox"><div style="font-size:34px">${emoji}</div><h2 style="margin:6px 0 4px">${esc(title)}</h2>${bodyHTML}${ok}</div>`;
  document.body.appendChild(o); }
function showCardInfo(id){ const c=CARDS[id]; if(!c)return;
  // La pastille seule ne suffit pas : ici on explique ce que le niveau engage concrètement.
  const risque = c.risk
    ? `<b class="blue">⚔️ ${t("Double tranchant")}</b> — ${t("elle peut rapporter gros… comme se retourner contre toi. Pour ceux qui sentent bien leur journée et assument leurs pronos.")}`
    : `<b class="green">🟢 ${t("Sans risque")}</b> — ${t("au pire elle ne sert à rien. Elle ne peut jamais se retourner contre toi.")}`;
  infoModal(c.e, t(c.n), `<div style="margin:4px 0 6px">${t("💪 Force {a}/5",{a:c.f||3})}</div><div class="mini muted">${esc(t(c.d))}</div>
    <div class="mini" style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px;text-align:left;line-height:1.6">${risque}</div>`); }
function showCaptainInfo(){ infoModal("👑",t("Capitaine (pari doublé)"),`<div class="mini muted">${t("Chaque journée tu désignes secrètement <b>un</b> de tes paris comme Capitaine : son <b>gain ET sa perte sont doublés</b> (×2). Ce n'est pas une carte bonus — tu en choisis un à chaque journée.")}</div>`); }
function showStakeInfo(){ infoModal("💰",t("La mise max"),`<div class="mini muted" style="text-align:left;line-height:1.6">${t("Le total de tes mises sur les 5 matchs ne peut pas dépasser <b>{a} %</b> de ton capital ({b} % avec la carte 📈 Investisseur) — c'est ce que remplit la jauge. Chaque pari doit avoir <b>au moins 1 €</b>.",{a:pct(STAKE_CAP),b:pct(STAKE_CAP_INVEST)})}</div>`); }
function showRoiInfo(){ infoModal("📈",t("Rentabilité (ROI)"),`<div class="mini muted" style="text-align:left;line-height:1.6">${t("Le <b>ROI</b> (retour sur investissement) rapporte ton résultat net au total que tu as misé. <b>+20 %</b> = tu as gagné 20 € pour 100 € misés ; un ROI <b>négatif</b> = tu as perdu de l'argent sur tes mises.")}</div>`); }
function showStarInfo(){ infoModal("⭐",t("Meilleur pronostiqueur"),`<div class="mini muted">${scoringShown()
    ? t("Chaque journée, le joueur au <b>meilleur gain net de toute la ligue</b> gagne <b>+1 point bonus</b> (en plus des points de duel). En cas d'égalité : on départage par le plus gros gain.")
    : t("Chaque journée, le joueur au <b>meilleur gain net de toute la ligue</b> gagne <b>+1 point bonus</b> (en plus des points de duel). En cas d'égalité : on départage par le plus gros gain, puis la plus grosse mise.")}</div>`); }

  rachat:{e:"🤝",t:"Rachat de bonus",hook:"Un bonus te fait de l'œil ? Rachète-le.",pts:[

function optsSet(){ return (AUTH && Array.isArray(AUTH.options)) ? AUTH.options : null; }

// seule étape absente en phase de test). Écrit dans SON PROPRE user_metadata (updateUser, autorisé pour
// soi-même) ; l'admin peut de toute façon régler/retirer ensuite. « pack » = souscrire aux 6 options.
async function subscribeOpt(key){
  const p=PITCHES[key]; if(!p) return;
  if(ownsOpt(key)) return;                              // déjà active
  if(!confirm(t("Souscrire à « {a} » ?\n\nPhase de test : aucun paiement — l'option s'active immédiatement sur ton compte.",{a:t(p.t)}))) return;
  let cur=(AUTH && Array.isArray(AUTH.options))?AUTH.options.slice():[];
  if(key==='pack') cur=SHOP_ORDER.slice(); else if(cur.indexOf(key)<0) cur.push(key);
  // On repasse pseudo/avatar avec `options` : updateUser fusionne les métadonnées, mais on reste défensif.
  try{ const r=await db.auth.updateUser({ data:{ username:AUTH.name, avatar:AUTH.avatar||"", options:cur } }); if(r && r.error) throw r.error;
    AUTH.options=cur; closeCardInfo(); infoWin(t("✅ Option activée sur ton compte. Bon jeu !"),"🎉"); render(); }

// Détail de l'« effet » d'une carte bonus : gain avec la carte vs sans la carte (impact enregistré à la résolution)
// Données (paris/duels) de la journée D. Les globals `bets`/`duels` ne contiennent QUE la journée
// `loadedDay` : dès que la résolution auto a rechargé la journée suivante, lire les globals pour une

// même logique que le swap interne de recapBody, mais utilisable HORS rendu (bug Hervé : plus rien
// ne se passait au clic sur un bonus quand on venait de valider en dernier).
function dayData(D){
  if(loadedDay!==D && Array.isArray(chartBets) && Array.isArray(standDuels))
    return { bets: chartBets.filter(b=>b.day===D), duels: standDuels.filter(x=>x.day===D) };
  return { bets: bets||[], duels: duels||[] };
}
function showBonusImpact(pid,day){

  const d=dz.find(x=>x.home_id===pid||x.away_id===pid); const oppId=d?(d.home_id===pid?d.away_id:d.home_id):null;
  const oppB=oppId?bz.find(b=>b.player_id===oppId):null; const oppNet=(oppB&&oppB.net!=null)?oppB.net:0;

  // 🥷 / 🧬 : sans cette ligne, l'impact chiffré est incompréhensible — on ne sait ni ce qui a été
  // pris, ni ce qui a été copié, ni pourquoi la carte n'a rien donné.
  const nomC=id=>(CARDS[id]?CARDS[id].e+" "+t(CARDS[id].n):id);
  const nomJ=p=>{ const x=pById(p); return x?avatarHTML(x.emoji)+' '+esc(x.name||'?'):"?"; };
  let mot="";
  if(c.stole) mot=t("🥷 Bonus pris à {a} : son {b} n'a pas été appliqué, et la carte est passée dans ta main.",{a:nomJ(oppId),b:nomC(c.stole)});
  else if(c.id==="voleur") mot=t("🥷 Rien à prendre : ton adversaire n'a joué aucun bonus ce jour-là.");

  else if(c.id==="clone") mot=t("🧬 Rien à copier : ton adversaire n'a joué aucun bonus clonable ce jour-là.");
  if(c.stolenBy) mot=t("🥷 Ce bonus t'a été <b>pris</b> par {a} : il ne s'est pas appliqué.",{a:nomJ(c.stolenBy)});
  if(mot) body+=`<div class="mini" style="text-align:left;margin-top:8px">${mot}</div>`;
  if(hasSelf){ const wo=r2(net-im.self); body+=`<div class="mini" style="text-align:left;margin-top:7px">🧑 <b>${t("Sur son gain du jour :")}</b><br>${t("• avec la carte :")} <b>${fmt(net)}€</b><br>${t("• sans la carte :")} <b>${fmt(wo)}€</b><br>${t("• effet :")} <b class="${im.self>=0?'green':'red'}">${fmt(im.self)}€</b></div>`; }
  if(hasOpp){ const wo=r2(oppNet-im.opp); body+=`<div class="mini" style="text-align:left;margin-top:7px">🥊 <b>${t("Sur le gain de l'adversaire :")}</b><br>${t("• avec la carte :")} <b>${fmt(oppNet)}€</b><br>${t("• sans la carte :")} <b>${fmt(wo)}€</b><br>${t("• effet :")} <b class="${im.opp>=0?'green':'red'}">${fmt(im.opp)}€</b></div>`; }
  if(!hasSelf&&!hasOpp) body+=`<div class="mini muted" style="text-align:left;margin-top:8px">${t("Aucun effet chiffré ce jour-là.")}</div>`;
  infoModal(C.e, esc(t(C.n))+" — "+t("l'effet"), body);

/* ===== MODE CONSULTATION (v7.11, demandé par Hervé) =========================================
 * « Que je puisse cliquer sur la ligue, même fermée, et être redirigé vers cette ligue. Juste
 *   pour consultation […] mais pas de modif possible. »
 * L'admin ouvre la ligue d'un AUTRE groupe avec les yeux d'un de ses joueurs : tous les écrans
 * s'affichent fidèlement (`me()` fonctionne), y compris les boutons d'info.
 *
 * ⚠️ LE VERROU EST DANS `q()`, ET C'EST VOLONTAIRE. Tout accès à la base passe par cette
 * fonction : un seul point à protéger, impossible d'en oublier un. Le constructeur de requêtes
 * supabase-js expose le VERBE HTTP avant l'envoi (vérifié : select=GET, insert=POST,
 * update=PATCH, upsert=POST, delete=DELETE, rpc=POST) — tout ce qui n'est pas GET est refusé.
 * Une garde posée écran par écran aurait forcément laissé passer quelque chose.
 *
 * ⚠️ LIMITE CONNUE : `db.auth.updateUser` (souscription aux options) ne passe PAS par `q()`.
 * Le bouton 🛒 est donc masqué pendant la consultation — mais la garde ne le couvre pas.
 * ⚠️ Ce mode ne s'enregistre PAS dans `pl_last` : après un rechargement de page, on ne doit
 * jamais se retrouver dans la ligue d'un autre SANS le verrou. */
let LECTURE_SEULE=false;
async function q(p){
  if(LECTURE_SEULE && p && p.method && p.method!=="GET") throw new Error("lecture_seule");
  const {data,error}=await p; if(error) throw new Error(error.message); return data; }
function genCode(){ let s=""; const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
// Crée une ligue en RÉESSAYANT tant que le code tiré est déjà pris (v6.95, demandé par Hervé).
//
// ⚠️ La garantie d'unicité vient de la BASE (`code text unique not null` dans schema.sql), jamais
// d'un SELECT préalable : deux joueurs peuvent tirer le même code au même instant, et seul un index
// unique tranche sans condition de course. On tente donc l'insertion, et on retire un code si elle
// est refusée pour doublon.
//
// Pourquoi c'est nécessaire : 32^5 = 33,5 millions de codes, mais la collision suit le paradoxe des
// anniversaires — ~1,5 % de risque au bout de 1 000 ligues, ~31 % à 5 000, ~78 % à 10 000. Elle est
// donc rare aujourd'hui et CERTAINE à l'échelle. Sans ce réessai, le joueur voyait une erreur
// Postgres brute (« duplicate key value violates unique constraint ») et sa ligue n'était pas créée.
//
// ⚠️ Un code n'est JAMAIS recyclé : fermer une ligue la passe en statut « done », la ligne reste en
// base, donc son code reste à jamais pris. C'est voulu — un ancien code ne doit pas ramener des
// joueurs vers une autre partie.
async function insertLeagueCodeUnique(champs){
  let derniere=null;
  for(let i=0;i<6;i++){
    const code=genCode();
    try{ return await q(db.from("leagues").insert(Object.assign({},champs,{code})).select().single()); }
    catch(e){ derniere=e; if(!/duplicate|unique|23505/i.test(e.message||"")) throw e; }
  }
  throw derniere||new Error("code de ligue introuvable");
}

/* ============ schedule ============ */
function makeSchedule(n){ let arr=[...Array(n).keys()]; const rounds=[];
  for(let r=0;r<n-1;r++){ const pairs=[];
    for(let i=0;i<n/2;i++){ let a=arr[i],b=arr[n-1-i]; if((r+i)%2===0) pairs.push([a,b]); else pairs.push([b,a]); }
    rounds.push(pairs); arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]; }
  const ret=rounds.map(rd=>rd.map(p=>[p[1],p[0]])); return [...rounds,...ret]; }

/* ============ fixtures ============ */
// `pris` (facultatif) : équipes déjà engagées dans le tirage en cours. Comme dans un vrai calendrier,
// une équipe ne joue qu'un match par journée — sans ça la même affiche pouvait sortir plusieurs fois
// dans la même liste (signalé par Giulian : 3× Bayern–City). Repli sur l'effectif complet si les
// équipes libres viennent à manquer, pour ne jamais bloquer le tirage.
function genFixture(maxKo,sportImpose,pris){ const s=sportImpose||pick(SPORTS);
  // Circuits séparés (tennis ATP / WTA) : les deux adversaires sortent du MÊME pool. On choisit un
  // circuit qui a encore au moins 2 joueurs libres ; sinon on retombe sur la liste complète du sport.
  let roster=s.t;
  if(Array.isArray(s.pools)){
    const ok=s.pools.filter(p=>(pris?p.filter(x=>!pris.has(x)):p).length>=2);
    roster = ok.length ? pick(ok) : pick(s.pools);
  }
  const libres=pris?roster.filter(x=>!pris.has(x)):roster;
  const src=(libres.length>=2)?libres:roster;
  const a=pick(src); const restants=src.filter(x=>x!==a); const b=restants.length?pick(restants):pick(roster.filter(x=>x!==a));
  if(pris){ pris.add(a); pris.add(b); }
  // Cotes COHÉRENTES : on part de probabilités qui somment à 100 %, + une marge bookmaker (~5-9 %), puis cote = 1/(p×marge).
  const M=rnd(1.05,1.09); const odd=p=>Math.max(1.05,+(1/(p*M)).toFixed(2));
  // Horaire FICTIF : décalage (heures) après la clôture des paris. Comme en réel, le match se joue APRÈS la deadline
  // et dans le créneau de la formule (maxKo = 12h Fast / 24h Classique) → tous les matchs du jour sont groupés.
  const ko=+rnd(0.75,Math.max(2,(maxKo||24)-1)).toFixed(2);
  // Probabilité issue de l'écart de FORCE réel (façon Elo) → le favori a une cote plus basse (demandé par
  // Hervé). D = sensibilité (plus petit = écarts plus marqués) ; HA = avantage du terrain (foot > basket,
  // nul au tennis) ; ±4 d'aléa = variabilité de forme d'un match à l'autre pour éviter des cotes figées.
  const D=100, HA=s.draw?20:(s.ic==="🏀"?10:0);
  const ra=(TEAM_STRENGTH[a]||78)+HA+rnd(-4,4), rb=(TEAM_STRENGTH[b]||78)+rnd(-4,4);
  const E=1/(1+Math.pow(10,(rb-ra)/D)); // proba de victoire du DOMICILE (hors nul)
  if(s.draw){ // 3 issues : le nul prend une part d'autant plus faible que le match est déséquilibré
    const pd=0.30-0.24*Math.abs(E-0.5), ph=(1-pd)*E, pa=(1-pd)*(1-E);
    return {sport:s.ic,draw:true,home:a,away:b,oh:odd(ph),od:odd(pd),oa:odd(pa),ko}; }
  return {sport:s.ic,draw:false,home:a,away:b,oh:odd(E),oa:odd(1-E),ko}; }
// Même dosage qu'en données réelles : ~75 % de foot, le reste pour la variété (cf. socTarget dans
// fetchRealPool). Le mode simulé sert à répéter le vrai jeu — sans ce quota le sport était tiré
// UNIFORMÉMENT entre les 3 (≈33 % de foot), d'où des journées à un seul match de foot (signalé par
// Hervé sur XKWJ2). Effet de bord utile : le foot est le seul sport à 3 issues, donc c'est aussi lui
// qui rend la carte 🎲 Double Chance jouable.
const SPORT_FOOT=SPORTS.find(s=>s.draw)||SPORTS[0]; // ⚽ = le seul sport à 3 issues (draw:true)
function genPool(k,maxKo){
  const nFoot=Math.round(k*(POOL_FOOT/POOL_N));
  // Les places « variété » excluent le foot — comme en réel, où elles sont prises dans `oth`
  // (tout sauf Soccer). Sans cette exclusion elles retombaient parfois sur du foot : 83 % au lieu
  // de 75 %, soit une proportion qui ne correspondait ni à la règle ni au mode réel.
  const autres=SPORTS.filter(s=>s!==SPORT_FOOT);
  // Un seul jeu d'équipes engagées pour TOUT le tirage : chaque équipe/joueur n'apparaît qu'une fois,
  // donc aucune affiche ne peut se répéter. (Les noms sont uniques d'un sport à l'autre.)
  const pris=new Set();
  const out=[]; for(let i=0;i<k;i++) out.push(genFixture(maxKo, i<nFoot?SPORT_FOOT:pick(autres), pris));
  // Mélange (Fisher-Yates) : sinon les matchs de foot seraient toujours groupés en tête de liste.
  for(let i=out.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=out[i]; out[i]=out[j]; out[j]=tmp; }
  return out; }
function oddOf(f,sel){ return sel==="1"?f.oh:sel==="2"?f.oa:f.od; }
// Cote « double chance » : combinée de deux issues couvertes pour une seule mise.
// ANCIENNE règle de 🧈 Le beurre et l'argent du beurre : la carte payait à cette cote combinée
// RÉDUITE. Depuis le 19/07/2026 elle paie à la cote PLEINE du résultat qui sort (`dcWinOdd`).
// ⚠️ NE PAS SUPPRIMER bien qu'elle ne soit plus appelée : c'est la clé de lecture des parties
// ANTÉRIEURES. Sans elle, les impacts négatifs stockés dans `bets.card.impact` de ces parties-là
// sont incompréhensibles. Vécu le 2026-07-27 : un impact de −66,40 € semblait prouver un bug, et
// c'est cette formule qui a permis de le reconstituer au centime — 20 € × (1,44 − 1) × 2 pour le
// Capitaine = 17,60 €, au lieu de 20 € × (3,10 − 1) × 2 = 84 €, soit exactement −66,40 €.
function dcOdd(o1,o2){ return +(1/(1/o1+1/o2)).toFixed(2); }
// Verdict d'un match RÉEL déjà terminé (option 📡 Données réelles). Partagé par l'écran Pronos
// après clôture et l'écran Résultats en attente : une seule règle de couleur à maintenir.
// ⚠️ Avant v6.86 les deux affichaient toujours « ✓ <vainqueur> » en VERT. Le vert disait « le match
// est joué », pas « tu as gagné » — sur une capture d'Hervé, 2 des 4 lignes vertes étaient des paris
// PERDUS, dont sa plus grosse mise de la journée (19 €). Or dans toute l'app le vert = c'est bon
// pour toi. L'argumentaire de l'option promettait d'ailleurs « ✓ / ✗ sur ton prono » : non tenu.
// `sel` = MON prono sur ce match, ou null si je n'ai pas parié dessus (match d'un AUTRE duel) :
// dans ce cas on reste en gris neutre, sinon on trancherait un pari qu'on n'a pas à connaître.
// Renvoie null si le résultat n'est pas encore connu (l'appelant affiche alors l'heure ou ⏳).
function liveVerdict(f, sel){
  const r=liveRes[f.evId]; if(!(r && r.completed && r.res)) return null;
  const w = r.res==='1' ? f.home : (r.res==='2' ? f.away : t("Nul"));
  if(sel==null) return {txt:esc(w), ok:null};
  const ok=(r.res===sel);
  return {txt:(ok?"✓ ":"✗ ")+esc(w), ok};
}
// Double Chance : on gagne à la cote INITIALE du résultat qui sort (pas de cote combinée pondérée).
function dcWinOdd(f,sel,sel2){ return (f.res===sel||f.res===sel2) ? oddOf(f,f.res) : oddOf(f,sel); }
/* ---- Barème d'un duel ---- */
// gain (retour brut des paris gagnants, à la cote) et mise (total misé) d'un joueur.
// ⚠️ Match ANNULÉ (f.canceled) : la mise est RENDUE → le pari est ignoré (ni gain, ni mise comptée).
function gainMise(picks,fx){ let gain=0,mise=0; (picks||[]).forEach((b,i)=>{ const f=(fx||[])[i]; if(f&&f.canceled) return; const st=+b.stake||0; mise+=st; if(f&&b.sel===f.res) gain+=st*oddOf(f,b.sel); }); return {gain,mise}; }
// Nombre de paris gagnants d'un joueur (gère la Double Chance)
function winCount(bt,fx){ if(!bt||!bt.picks||!fx) return 0; const c=bt.card; let w=0; bt.picks.forEach((b,i)=>{ const f=fx[i]; if(!f||f.canceled)return; const isDC=c&&c.id==="chance"&&c.target===i&&c.sel2; const win=isDC?(f.res===b.sel||f.res===c.sel2):(b.sel===f.res); if(win)w++; }); return w; }
// Compare deux joueurs {net,gain,mise} : vainqueur = meilleur net, puis gain, puis mise, sinon nul.
// v2 : RÉSULTAT (V=2, N=1, D=0) + 1 pt si net > 0.  ANCIEN : vainqueur 3 (net>0) ou 1 ; perdant
// 1 (net>0) ou 0 ; nul 1/1.  ⚠️ « net > 0 » strictement : un net de 0 (p. ex. tous les matchs du
// jour annulés) ne donne PAS le point de bonus.
// v6.42 (Hervé) : sur la DERNIÈRE journée, les points de DUEL comptent DOUBLE — « rien n'est jamais joué,
// tout peut basculer jusqu'au bout ». (Le ⭐ +1 meilleur pronostiqueur reste +1, ce qui garde la colonne
// Duel/⭐ du classement exacte.) ⚠️ Ce multiplicateur DOIT être appliqué à l'identique dans resolveDay
// (points écrits en base) ET computeStandHist (rejeu affiché), sinon le classement diverge des points réels.
function lastDayMult(d){ return (L && L.num_days && d===(L.num_days-1)) ? 2 : 1; }
// Bandeau « dernière journée » : rappelle que les points de duel comptent double AU MOMENT où ça compte.
function lastDayBanner(d){ return lastDayMult(d)===2 ? `<div class="box" style="border-color:var(--gold);background:rgba(224,182,79,.12);text-align:center;padding:8px 10px"><b class="gold">🔥 ${t("Dernière journée — les points de duel comptent DOUBLE")}</b></div>` : ''; }
function duelPts(h,a,v2){ const R=x=>Math.round((+x||0)*100)/100;
  if(v2){
    // v2 : le SEUL juge du duel est le NET. À net ÉGAL → MATCH NUL. On ne départage PAS par le gain
    // (ni la mise) : à net identique, un gain plus élevé signifie une mise plus élevée, donc plus de
    // risque pris — pas un meilleur jeu (signalé par Hervé, ligue CDRCJ). Barème : V=2, N=1, D=0, +1 si net>0.
    const c=R(h.net)-R(a.net); const bh=R(h.net)>0?1:0, ba=R(a.net)>0?1:0;
    if(c>0) return {h:2+bh, a:0+ba, win:'h'};
    if(c<0) return {h:0+bh, a:2+ba, win:'a'};
    return {h:1+bh, a:1+ba, win:null};
  }
  // ANCIEN barème (ligues antérieures à SCORING2) : départage net, puis gain, puis mise. Inchangé.
  const c=(R(h.net)-R(a.net)) || (R(h.gain)-R(a.gain)) || (R(h.mise)-R(a.mise));
  if(c>0) return {h:R(h.net)>0?3:1, a:R(a.net)>0?1:0, win:'h'};
  if(c<0) return {h:R(h.net)>0?1:0, a:R(a.net)>0?3:1, win:'a'};
  return {h:1,a:1,win:null}; }
// Duel avec FORFAIT : un joueur qui n'a pas validé ses pronos à temps ne marque AUCUN point de duel
// (sinon son net de 0 lui ferait « battre » un adversaire négatif) ; l'adversaire gagne le duel d'office.
// Barème du vainqueur : v2 → 2 + 1 si net>0 (soit 3 ou 2) ; ancien → 3 si net>0, 1 sinon.
// Le 0 rendu ici n'est PAS la sanction complète : la pénalité d'oubli (−1 pt en v2, −2 avant) est
// ajoutée séparément par resolveDay / recapBody / computeStandHist.
function duelPtsF(H,A,hForgot,aForgot,v2){
  const gagne=X=>{ const n=(+X.net||0); return v2 ? (2+(n>0?1:0)) : (n>0?3:1); };
  if(hForgot&&aForgot) return {h:0,a:0,win:null};
  if(hForgot) return {h:0, a:gagne(A), win:'a'};
  if(aForgot) return {h:gagne(H), a:0, win:'h'};
  return duelPts(H,A,v2); }
// Meilleur pronostiqueur du jour (un SEUL joueur de toute la ligue) : net, puis gain, puis 1er inscrit.
// La mise a été retirée du départage en v2 (même raison que pour le duel). Ici l'étoile doit
// désigner UN seul joueur : le rang d'inscription reste le dernier recours, donc le résultat
// demeure déterministe sans elle.
function dayStar(rows,v2){ const R=x=>Math.round((+x||0)*100)/100; let best=null;
  for(const r of rows){ if(!best){ best=r; continue; }
    const c=(R(r.net)-R(best.net))||(R(r.gain)-R(best.gain))||(v2?0:(R(r.mise)-R(best.mise)))||((best.order||0)-(r.order||0));
    if(c>0) best=r; }
  return best?best.id:null; }
// L'⭐ meilleur pronostiqueur (+1 pt) n'a de sens qu'à partir de 3 joueurs : à DEUX, le plus gros
// net revient forcément au vainqueur du duel (barème v2 basé sur le net), qui mène déjà — le point
// bonus ferait double emploi (signalé par Hervé). Doit être testé À L'IDENTIQUE partout où l'étoile
// est attribuée (resolveDay / recapBody / computeStandHist / graphe), sinon les points recalculés
// divergent de ceux écrits en base.
function starMech(n){ return (+n||0) > 2; }
function simResult(f){ const outs=f.draw?[["1",f.oh],["N",f.od],["2",f.oa]]:[["1",f.oh],["2",f.oa]];
  const inv=outs.map(o=>1/o[1]); const sum=inv.reduce((a,b)=>a+b,0);
  let r=Math.random(); for(let i=0;i<outs.length;i++){ r-=inv[i]/sum; if(r<=0) return outs[i][0]; } return outs[outs.length-1][0]; }

/* ============ data ============ */
let prevLeagueStatus=null;   // suivi du statut pour détecter le lancement (prépa → running) → Coulisses
let loadedDay=null;          // journée chargée dans duels/bets (évite d'afficher une journée passée sur Pronos, D5)
async function refresh(){
  // On CAPTURE la ligue visée au départ. `refresh()` est asynchrone (polling / boot) : pendant ses
  // `await`, l'utilisateur peut revenir à « Mes ligues » (backToLeagues met S.leagueId et L à null).
  // Sans garde, le refresh déjà en vol continuait avec des valeurs nulles → « null is not an object
  // (L.status) » et « invalid input syntax for uuid: null » (signalés par Hervé). On utilise `lid`
  // partout (jamais S.leagueId, qui peut passer à null en cours de route) et on abandonne dès que la
  // ligue courante a changé — `stale()`.
  const lid=S.leagueId; if(!lid) return;
  const stale=()=> S.leagueId!==lid;
  try{
    L = await q(db.from("leagues").select("*").eq("id",lid).maybeSingle());  // maybeSingle : renvoie null (pas une erreur) si la ligue a été supprimée
    if(stale()) return;                       // l'utilisateur a quitté la ligue pendant le chargement
    if(!L){ // ligue introuvable (supprimée) : on nettoie et on retourne à l'accueil au lieu de planter
      if(S.leagueId===lid){ if(poll)clearInterval(poll); localStorage.removeItem("pl_last"); S.leagueId=null; S.myId=null; S.view="leagues"; loadMyLeagues(); }
      return; }
    players = await q(db.from("players").select("*").eq("league_id",lid).order("join_order"));
    if(stale()) return;
    try{ trades = await q(db.from("trades").select("*").eq("league_id",lid).eq("status","pending")); }catch(e){ trades=[]; } // rachats en attente (badge 🤝 + écran)
    try{ myResolvedOut = await q(db.from("trades").select("*").eq("league_id",lid).eq("from_player",S.myId).in("status",["accepted","refused"]).order("resolved_at",{ascending:false}).limit(20)); }catch(e){ myResolvedOut=[]; } // réponses à MES offres (acheteur prévenu)
    if(stale()) return;
    // Ligue amis en LOBBY sans options de gage (créée avant v6.21 ou via un onglet resté en cache) :
    // l'organisateur les tire dès qu'il y a ≥2 joueurs → le vote du gage devient dispo aux inscriptions.
    if(L.status==="lobby" && me() && me().is_organizer){
      let o={}; try{o=JSON.parse(L.gage)||{};}catch(e){}
      const nH=players.filter(p=>!p.is_ai).length;
      if(nH>=2 && o.enjeu && !(Array.isArray(o.options)&&o.options.length)){
        const both=(o.enjeu==="both"); const md=o.mode||getMode();
        o.options=drawItems(both?"gage":o.enjeu, md);
        if(both && !(Array.isArray(o.optionsR)&&o.optionsR.length)) o.optionsR=drawItems("reward", md);
        o.votes=o.votes||{}; o.voteTs=o.voteTs||{}; o.bids=o.bids||{}; o.bidTs=o.bidTs||{}; if(both){o.votesR=o.votesR||{};o.voteTsR=o.voteTsR||{};}
        try{ await q(db.from("leagues").update({gage:JSON.stringify(o)}).eq("id",lid)); L.gage=JSON.stringify(o); }catch(e){}
      }
    }
    // fin de préparation AUTOMATIQUE : dès que tous ont validé (ou délai écoulé), on démarre sans clic
    if(L.status==="prep" && !resolving){
      const humans=players.filter(p=>!p.is_ai); const allDone=humans.length>=1 && humans.every(p=>p.shop_done); // >=1 : le SOLO doit pouvoir démarrer
      const st=prepState(); const dlPassed=st.deadline && new Date(st.deadline).getTime()<=Date.now();
      if(allDone||dlPassed){ resolvePrep(); return; }
    }
    // v6.18 — L'onglet Pronos ne montre JAMAIS les résultats (choix Hervé) : ils vivent uniquement dans
    // l'onglet Résultats. On n'entre donc plus dans l'« état récap » (qui figeait le jeu sur la journée
    // résolue, dispDay = jour−1) : on acquitte automatiquement et on enchaîne sur la journée courante.
    if(L.status!=="lobby" && L.current_day>getSeen() && L.current_day>=1) setSeen(L.current_day);
    S.recap = false;
    const dispDay = Math.min(L.current_day, Math.max(0,(L.num_days||1)-1));
    S.dispDay = dispDay;
    duels = await q(db.from("duels").select("*").eq("league_id",lid).eq("day",dispDay));
    bets  = await q(db.from("bets").select("*").eq("league_id",lid).eq("day",dispDay));
    loadedDay = dispDay;   // journée effectivement chargée dans `duels`/`bets` (cf. flash Pronos, D5)
    if(stale()) return;
    // sélection auto (IA à domicile, ou échéance de sélection dépassée) + résolution auto
    // ⚠️ `!LECTURE_SEULE` : en consultation, la visite de l'admin ne doit RIEN faire avancer —
    // ni choisir des matchs, ni faire parier l'IA, ni résoudre la journée d'un autre groupe.
    // Le verrou de `q()` les bloquerait de toute façon, mais autant ne pas les déclencher.
    if(L.status==="running" && !S.recap && !resolving && !LECTURE_SEULE){
      if(await ensureFixtures()){ duels = await q(db.from("duels").select("*").eq("league_id",lid).eq("day",dispDay)); }
      // tous les matchs choisis → on démarre le compte à rebours des paris (max 24h / 12h fast), une seule fois
      if(!L.bet_started_at && duels.length && duels.every(d=>d.fixtures)){
        try{ const r=await q(db.from("leagues").update({bet_started_at:new Date().toISOString()}).eq("id",L.id).is("bet_started_at",null).select("bet_started_at")); if(r&&r.length){ L.bet_started_at=r[0].bet_started_at; } }catch(e){} }
      if(await ensureAiBets()){ bets = await q(db.from("bets").select("*").eq("league_id",lid).eq("day",dispDay)); }
      if(shouldAutoResolve()){ resolveDay(); return; }
      await resolveRealIfReady(); // données réelles : résout quand les vrais matchs sont terminés
    }
    if(stale()) return;
    if(chartDay!==L.current_day){ chartDay=L.current_day; chartBets=null; standDuels=null; standTrades=null; }
    if((L.status==="running"||L.status==="done") && chartBets===null && L.current_day>=1){
      chartBets = await q(db.from("bets").select("player_id,day,net,picks,card,captain,duel_id,submitted").eq("league_id",lid).not("net","is",null));
      standDuels = await q(db.from("duels").select("day,home_id,away_id,fixtures").eq("league_id",lid));
      // Rachats ACCEPTÉS : ils déplacent du capital sans être le gain de personne. Sans eux, le
      // classement historique et la courbe divergent du capital réel (écart mesuré : ±5 €).
      try{ standTrades = await q(db.from("trades").select("from_player,to_player,price,kind,day").eq("league_id",lid).eq("status","accepted")); }
      catch(e){ standTrades=[]; } }
    if(stale()) return;
    if(L.status==="done" && endStats===null){ endStats={loading:true}; loadEndStats().then(()=>{ if(!stale()) render(); }); }
    // Lancement du championnat : dès que la prépa bascule en "running", on amène le joueur sur les
    // 🎬 Coulisses (résumé d'ouverture : gage + enchères), et non direct sur les pronos (demandé par Hervé).
    if(L.status==="running" && (prevLeagueStatus==="prep"||prevLeagueStatus==="starting") && S.view==="game"){ S.view="coulisses"; }
    // Ligue TERMINÉE : on ouvre sur 📊 Classt, pas sur ⚽ Pronos (v7.23, demandé par Hervé). Il n'y a
    // plus rien à parier ; le bilan est l'écran qui a du sens. ⚠️ `prevLeagueStatus===null` = PREMIER
    // chargement de cette ligue : sans cette condition, chaque tour de polling ramènerait le joueur
    // sur le classement alors qu'il consulte les résultats ou les règles.
    if(L.status==="done" && prevLeagueStatus===null && S.view==="game"){ S.view="standings"; standHist=false; standDay=null; }
    prevLeagueStatus=L.status;
    if(L.status==="lobby") maybeAutoStartFull();   // ligue pleine → clôture auto + démarrage
    showErr(""); render(); maybeNotify(); notifyTrades(); maybeRecapModal(dispDay); maybePrepModal(); maybeFormulaModal();
  }catch(e){ showErr("Connexion : "+e.message); }
}
// Récapitalisation : une fenêtre fermable à l'ouverture du récap concerné (un bandeau seul passait
// inaperçu — signalé par Hervé). Une seule fois par ligue+journée, mémorisé en localStorage.
// Phrase du renflouement, partagée par la fenêtre et par l'encart de l'écran Résultats (une seule
// formulation à maintenir). Replis `amount`/10 : les notes des ligues d'AVANT v6.82 ne portent ni
// `target` ni `seuil` (ancien modèle « +40 € sous 10 € ») — l'historique reste lisible.
function recapNoteText(n){
  const names=(n.names||[]); const multi=names.length>1;
  const cible=(n.target!=null)?n.target:n.amount, seuil=(n.seuil!=null)?n.seuil:10;

    {a:esc(names.join(', ')), e:multi?'en':'', b:cible, c:seuil});
}
function maybeRecapModal(dispDay){

  if(!L || !L.recap_note || L.recap_note.day!==dispDay) return;

// Changement de format qui prend effet AUJOURD'HUI (l'organisateur l'avait programmé) : fenêtre à
// fermer, montrée UNE fois par (ligue, journée). Concerne tous les joueurs.
function maybeFormulaModal(){
  if(!L || L.status!=="running") return;
  let sched=[]; try{ const o=JSON.parse(L.gage); if(o&&Array.isArray(o.fmtSchedule)) sched=o.fmtSchedule.filter(c=>c&&FORMULAS[c.formula]); }catch(e){}
  const cd=(L.current_day||0);
  // 1) Changement ACTIF cette journée (from === journée courante) → « la ligue passe en X ».
  const act=sched.find(c=>c.from===cd);
  if(act){ const key="pl_fmtseen_"+L.id+"_"+act.from;
    let seen=true; try{ seen=!!localStorage.getItem(key); if(!seen) localStorage.setItem(key,"1"); }catch(e){}
    if(!seen){ const F=FORMULAS[act.formula];
      infoModal("⏱️", t("Changement de format"),
        `<div class="mini" style="text-align:left">${t("À partir de cette journée, la ligue passe en <b>{a}</b>.",{a:F.n})}</div>
         <div class="mini muted" style="text-align:left;margin-top:6px">${esc(t(F.d))}</div>
         <div class="mini muted" style="text-align:left;margin-top:8px">${t("Ferme cette fenêtre pour continuer.")}</div>`);
      return; } }
  // 2) Changement À VENIR (from > journée courante) → prévenir TOUS les joueurs dès qu'il est planifié.
  const pend=sched.filter(c=>c.from>cd).sort((a,b)=>a.from-b.from)[0];
  if(pend){ const key="pl_fmtpend_"+L.id+"_"+pend.from+"_"+pend.formula;
    let seen=true; try{ seen=!!localStorage.getItem(key); if(!seen) localStorage.setItem(key,"1"); }catch(e){}
    if(!seen){ const F=FORMULAS[pend.formula];
      infoModal("⏱️", t("Changement de format à venir"),
        `<div class="mini" style="text-align:left">${t("L'organisateur a décidé : à partir de la <b>journée {b}</b>, la ligue passera en <b>{a}</b>.",{a:F.n,b:pend.from+1})}</div>
         <div class="mini muted" style="text-align:left;margin-top:6px">${esc(t(F.d))}</div>
         <div class="mini muted" style="text-align:left;margin-top:8px">${t("Ferme cette fenêtre pour continuer.")}</div>`); return; } }
  // 3) Changement ANNULÉ (l'organisateur est revenu en arrière) → prévenir ceux qui avaient vu le « à venir ».
  let cx=null; try{ const o=JSON.parse(L.gage); if(o&&o.fmtCancel&&o.fmtCancel.from>cd) cx=o.fmtCancel; }catch(e){}
  if(cx && !sched.some(c=>c.from===cx.from)){   // plus aucun changement prévu pour cette journée
    const key="pl_fmtcancel_"+L.id+"_"+cx.from+"_"+cx.at;
    let seen=true; try{ seen=!!localStorage.getItem(key); if(!seen) localStorage.setItem(key,"1"); }catch(e){}
    if(!seen) infoModal("⏱️", t("Changement de format annulé"),
      `<div class="mini" style="text-align:left">${t("Le changement prévu à la <b>journée {b}</b> est annulé : elle reste en <b>{a}</b>.",{a:FORMULAS[formulaKey()].n,b:cx.from+1})}</div>
       <div class="mini muted" style="text-align:left;margin-top:8px">${t("Ferme cette fenêtre pour continuer.")}</div>`); }
}
// (v6.66) Pop-up « dernière journée = points doubles » RETIRÉ : il s'affichait au moment de découvrir
// les résultats de la journée passée (mauvais timing). L'info reste bien visible via le bandeau
// lastDayBanner sur les écrans Pronos + Résultats. Demandé par Hervé.
async function ensureFixtures(){
  let filled=false; const dt=dayTimes(); const selPassed=dt.ok && Date.now()>=dt.sel;
  // Duels à remplir : IA à domicile (tout de suite) ou humain à domicile ayant dépassé l'échéance de sélection.
  const todo=duels.filter(d=>!d.fixtures && ((pById(d.home_id)&&pById(d.home_id).is_ai) || selPassed));
  if(!todo.length) return false;
  if(L&&L.data_mode==="real"){
    if(Date.now()-lastRealFill < 300000) return false; lastRealFill=Date.now(); // throttle quota (5 min)
    let pool=[]; try{ pool=await fetchRealPoolCached(); }catch(e){}
    if(pool.length<5) return false; // pas assez de vrais matchs → on attend (jamais de simulé en réel)
    for(const d of todo){ const cp=pool.slice(); for(let i=cp.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cp[i],cp[j]]=[cp[j],cp[i]];}
      const fx=cp.slice(0,5);
      try{ const r=await q(db.from("duels").update({fixtures:fx}).eq("id",d.id).is("fixtures",null).select()); if(r&&r.length) filled=true; }catch(e){} }
    return filled;
  }
  for(const d of todo){ try{ const r=await q(db.from("duels").update({fixtures:genPool(5,leagueFormula().bet)}).eq("id",d.id).is("fixtures",null).select()); if(r&&r.length) filled=true; }catch(e){} }
  return filled; }
// L'IA mise dès que les 5 matchs sont connus (pour que ses pronos soient visibles pendant l'attente)
async function ensureAiBets(){ let made=false;
  for(const d of duels){ if(!d.fixtures) continue;
    for(const pid of [d.home_id,d.away_id]){ const p=pById(pid); if(!p||!p.is_ai) continue;
      if(bets.find(b=>b.player_id===pid)) continue;
      const ai=aiPlay(p.capital!=null?p.capital:100, d.fixtures, p.hand||[], S.dispDay, L.num_days);
      try{ const r=await q(db.from("bets").insert({league_id:L.id,day:S.dispDay,player_id:pid,duel_id:d.id,picks:ai.picks,captain:ai.captain,card:ai.card,submitted:true}).select()); if(r&&r.length) made=true; }catch(e){} } }
  return made; }
function shouldAutoResolve(){
  const dz=duels; if(!dz.length || dz.some(d=>!d.fixtures)) return false; // sélection pas finie
  if(dz.some(d=>(d.fixtures||[]).some(f=>f&&f.evId))) return false; // matchs réels → résolution sur vrais résultats (Étape 2)
  // SOLO (vs 🤖 IA) en simulé : dès que le joueur a validé ses pronos, on résout TOUT DE SUITE — pas
  // d'attente d'échéance ni de « coup d'envoi », l'adversaire est l'IA (demandé par Hervé).
  if(isSolo() && myBet()) return true;
  // SIMULÉ multi-joueurs (v6.74, Hervé) : résolution INSTANTANÉE dès que tous les humains de la journée ont
  // validé leurs pronos → on enchaîne une partie entière en une soirée. (Pas de publication manuelle : le
  // « temps de lecture » n'apporte rien puisque les pronos adverses ne sont visibles qu'avec l'option payante,
  // et tous les pronos sont dévoilés à la résolution.) Garde loadedDay = journée courante réellement chargée.
  if(loadedDay===(L&&L.current_day) && allHumansSubmitted()) return true;
  // Repli si un joueur n'a pas validé : à la clôture des pronos (échéance naturelle ou clôture organisateur).
  return deadlinePassed();
}
// Tous les HUMAINS de la journée courante ont-ils validé un pari ? (l'IA joue automatiquement à la résolution)
function allHumansSubmitted(){
  const dz=duels||[]; if(!dz.length) return false;
  const ids=new Set(); dz.forEach(d=>{ ids.add(d.home_id); ids.add(d.away_id); });
  const humans=(players||[]).filter(p=>!p.is_ai && ids.has(p.id));
  if(!humans.length) return false;
  return humans.every(p=>{ const b=(bets||[]).find(x=>x.player_id===p.id); return !!(b && b.submitted!==false && Array.isArray(b.picks) && b.picks.length); });
}

function myDuel(){ return duels.find(d=>d.home_id===S.myId||d.away_id===S.myId); }
function myBet(){ return bets.find(b=>b.player_id===S.myId); }

async function doLogin(){

  if(!u||!p){showErr(t("Identifiant et mot de passe requis."));return;} busy=true; showErr("");
  const { data, error } = await db.auth.signInWithPassword({ email: emailFor(u), password: p });
  if(error){ showErr(/ban/i.test(error.message)?t("Ton accès a été suspendu par l'organisateur."):t("Identifiant ou mot de passe incorrect.")); busy=false; return; }
  AUTH={ id:data.user.id, name:(data.user.user_metadata&&data.user.user_metadata.username)||u, avatar:(data.user.user_metadata&&data.user.user_metadata.avatar)||"", options:(data.user.user_metadata&&Array.isArray(data.user.user_metadata.options))?data.user.user_metadata.options:null };

async function doSignup(){
  if(busy)return; const u=($("aUser").value||"").trim(), p=$("aPass").value||"";
  if(!validUser(u)){showErr(t("Identifiant : 2 à 20 caractères — lettres, chiffres, . _ - (sans espace ni accent)."));return;}
  if(p.length<8){showErr(t("Mot de passe : 8 caractères minimum."));return;} busy=true; showErr("");
  const { data, error } = await db.auth.signUp({ email: emailFor(u), password: p, options:{ data:{ username: u } } });
  if(error){ showErr(/registered|exists|already/i.test(error.message)?t("Cet identifiant est déjà pris."):("Création : "+error.message)); busy=false; return; }
  if(!data.session){ // filet si la confirmation e-mail est restée activée côté Supabase
    const r = await db.auth.signInWithPassword({ email: emailFor(u), password: p });
    if(r.error){ showErr("Config Supabase : désactive la confirmation e-mail (voir runbook Partie A)."); busy=false; return; }
  }
  AUTH={ id:data.user.id, name:u, avatar:"", options:null };
  S.view="home"; busy=false; await loadMyLeagues();
}

// repli à la création d'un joueur (voir createLeague / démarrage), elle n'est PAS supprimée.
// Upload d'une image perso → Supabase Storage (bucket public "avatars"). On redimensionne l'image en
// 256×256 côté client (canvas) pour rester léger, on remplace le fichier de CE compte (upsert), puis on
// stocke l'URL publique comme avatar. Nécessite un bucket "avatars" public + policy d'upload (voir doc).
async function uploadAvatar(input){ const file=input&&input.files&&input.files[0]; if(!file) return;
  const msg=$("avUpMsg"); const say=m=>{ if(msg) msg.textContent=m; };
  if(!/^image\//.test(file.type)){ say(t("Choisis un fichier image.")); return; }
  if(file.size>8*1024*1024){ say(t("Image trop lourde (8 Mo max).")); return; }
  try{
    say(t("Traitement…"));
    const dataUrl=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=dataUrl; });
    const S=256, cv=document.createElement("canvas"); cv.width=S; cv.height=S; const ctx=cv.getContext("2d");
    const m=Math.min(img.width,img.height), sx=(img.width-m)/2, sy=(img.height-m)/2;   // recadrage centré carré
    ctx.drawImage(img,sx,sy,m,m,0,0,S,S);
    const blob=await new Promise(res=>cv.toBlob(res,"image/jpeg",0.85));
    say(t("Envoi…"));
    const path=AUTH.id+".jpg";
    const up=await db.storage.from("avatars").upload(path, blob, {upsert:true, contentType:"image/jpeg"});
    if(up&&up.error) throw up.error;
    const { data:pub }=db.storage.from("avatars").getPublicUrl(path);
    let url=pub&&pub.publicUrl; if(!url) throw new Error("URL introuvable");
    url += (url.indexOf("?")>=0?"&":"?")+"v="+Date.now();   // casse le cache après remplacement
    say("");
    await setAvatar(url);
  }catch(e){ say((/bucket|not found|404/i.test(e.message||"")) ? t("Stockage non configuré (bucket « avatars »).") : (t("Échec de l'envoi")+" : "+(e.message||e))); }
  finally{ if(input) input.value=""; }
}
// Changer son PSEUDO affiché (≠ identifiant de connexion, qui reste l'email dérivé du pseudo d'origine).
// Met à jour la métadonnée du compte ET le nom recopié dans toutes ses ligues (players.name par user_id),
// comme setAvatar le fait pour l'emoji. L'admin reste l'admin : le statut dépend de l'UID, pas du pseudo.
async function changeMyUsername(){ if(!AUTH) return;
  const nv=(prompt(t("Nouveau pseudo (2 caractères min.) — c'est le nom affiché partout :"), AUTH.name||"")||"").trim();
  if(!nv) return;
  if(nv.length<2){ showErr(t("Choisis un identifiant (2 caractères minimum).")); return; }
  if(nv===AUTH.name){ return; }
  try{
    const r=await db.auth.updateUser({ data:{ username:nv } }); if(r&&r.error) throw r.error;   // fusionne les métadonnées (avatar/options conservés)
    try{ await q(db.from("players").update({name:nv}).eq("user_id",AUTH.id)); }catch(e){}        // cascade dans toutes ses ligues
    AUTH.name=nv; toast(t("Pseudo mis à jour ✓"));
    if(S.leagueId){ await refresh(); } else { await loadMyLeagues(); }
    render();
  }catch(e){ showErr("Pseudo : "+e.message); }
}

/* ============ PARTIE D'ESSAI — mini-saison LOCALE de 2 journées, résultats immédiats ============
   Ordre RÉEL du jeu : prépa (gage + enchères bonus) → paris J1 → résultats → sélection matchs J2 →
   paris J2 → résultats → classement final + gage. 100 % local (aucune base, aucune IA payante).
   Des annotations « ℹ️ Dans le vrai jeu » signalent les simplifications (3 matchs vs 5, etc.). */
let essaiStep=0, essaiGage=0, essaiBids={}, essaiPicks=[[],[]], essaiStakes=[[],[]], essaiCap=[-1,-1], essaiCard=[null,null], essaiCardTgt=[-1,-1], essaiSel=[];
// Bonus de FORCES DIFFÉRENTES (4/3/2). Pré-remplissage : tout 9>6 (gagné), parachute 8=8 (égalité →
// rapidité), sangsue non misé (Léa l'emporte). Le joueur remporte donc 🔥 Tout ou Rien et 🪂 Parachute.
const ESSAI_STAKE=10, ESSAI_CARDS=["tout","parachute","sangsue"];
// Ligue de DÉMO à 4 joueurs : chaque journée tu affrontes un adversaire DIFFÉRENT (comme en vrai).
const ESSAI_PLAYERS=[{id:"me",n:"Toi",e:"👑"},{id:"lea",n:"Léa",e:"🦊"},{id:"marco",n:"Marco",e:"🐼"},{id:"nina",n:"Nina",e:"🦉"}];
function essaiOpp(d){ return d===0?{id:"lea",n:"Léa",e:"🦊"}:{id:"marco",n:"Marco",e:"🐼"}; }
// Enchères des 3 AUTRES joueurs sur les 3 bonus (montants FIXES). Miser est FACULTATIF. Cas illustrés :
// tout → Marco 8 (forte, dure à battre) · parachute → Léa 5 = Marco 5 (ÉGALITÉ) · sangsue → Nina 7.
// À égalité, le plus RAPIDE gagne : ordre de rapidité ci-dessous (toi le plus rapide).
const ESSAI_ORDER=["me","lea","marco","nina"];
// Nombre de miseurs VARIABLE : « tout » convoité par tous (4), « parachute » par 2 adversaires (égalité
// Léa=Marco), « sangsue » par la seule Nina → montre que certains bonus intéressent plus que d'autres.
const ESSAI_AUCTION={tout:{lea:6,marco:8,nina:3},parachute:{lea:5,marco:5,nina:0},sangsue:{lea:0,marco:0,nina:7}};
function essaiBotBid(id){ const a=ESSAI_AUCTION[id]||{}; return Math.max(a.lea||0,a.marco||0,a.nina||0); }
// Qui remporte l'enchère d'un bonus (toi inclus) : plus haute mise, égalité au plus rapide (ESSAI_ORDER).
function essaiAuctionResult(id){ const a=ESSAI_AUCTION[id]||{}; const bids={me:essaiBids[id]||0,lea:a.lea||0,marco:a.marco||0,nina:a.nina||0};
  let win=null,best=-1; ESSAI_ORDER.forEach(k=>{ if(bids[k]>best){ best=bids[k]; win=k; } });
  if(best<=0) win=null; const tie=win!=null && ESSAI_ORDER.filter(k=>bids[k]===best).length>1;
  return {bids,win,best,tie}; }
// Résultat de l'AUTRE duel de la journée (celui que tu ne joues pas) — nets fixes, classement réaliste.
// La plus forte valeur sert de « barre » pour l'⭐ meilleur pronostiqueur : ~20 € en J1, ~40 € en J2.
// J1 : Marco 20 bat Nina −3 · J2 : Léa 40 bat Nina 2.
const ESSAI_SHADOW=[{marco:20,nina:-3},{lea:40,nina:2}];
// Classement FINAL fictif « comme après une vraie saison de 6 journées » (points & cagnottes réalistes).
const ESSAI_FINAL=[{id:"me",pts:14,cap:212.50},{id:"lea",pts:12,cap:168.00},{id:"marco",pts:9,cap:143.75},{id:"nina",pts:6,cap:96.25}];
const ESSAI_REWARDS=["Le trophée tournant 🥇","Servi comme un roi 🍽️","Cagnotte d'honneur 💰"];
const ESSAI_D1=[
 {home:"PSG",away:"OM",sport:"⚽",oh:1.85,od:3.4,oa:4.0,draw:true,res:"1",botSel:"1"},
 {home:"Real",away:"Barça",sport:"⚽",oh:2.3,od:3.3,oa:2.9,draw:true,res:"1",botSel:"2"},
 {home:"Nadal",away:"Federer",sport:"🎾",oh:1.7,oa:2.1,draw:false,res:"1",botSel:"1"}];
const ESSAI_POOL=[
 {home:"Man City",away:"Chelsea",sport:"⚽",oh:1.55,od:4.2,oa:6.0,draw:true,res:"1",botSel:"1"},
 {home:"Bayern",away:"Dortmund",sport:"⚽",oh:1.6,od:4.0,oa:5.0,draw:true,res:"1",botSel:"2"},
 {home:"Djokovic",away:"Alcaraz",sport:"🎾",oh:1.95,oa:1.85,draw:false,res:"2",botSel:"1"},
 {home:"Lakers",away:"Celtics",sport:"🏀",oh:2.0,oa:1.8,draw:false,res:"2",botSel:"2"},
 {home:"Juve",away:"Milan",sport:"⚽",oh:2.2,od:3.1,oa:3.3,draw:true,res:"1",botSel:"1"}];
function essaiFav(f){ return oddOf(f,"1")<=oddOf(f,"2")?"1":"2"; }
// Enchères PRÉ-REMPLIES pour l'exemple (éditables) : tout 9 → tu bats Marco (8) ; parachute 5 → ÉGALITÉ
// avec Léa & Marco (tu gagnes par la rapidité) ; sangsue 3 → Nina (7) l'emporte. → les 3 cas de figure.
function startEssai(){ essaiStep=0; essaiGage=0; essaiBids={tout:9,parachute:5,sangsue:3}; essaiSel=[];   // accessible AVANT connexion (100 % local)
  essaiPicks=[ESSAI_D1.map(essaiFav),[]]; essaiStakes=[[],[]]; essaiCap=[-1,-1]; essaiCard=[null,null]; essaiCardTgt=[-1,-1]; navRoot(); S.view="essai"; render(); }
function essaiGo(n){ essaiStep=n; render(); try{window.scrollTo(0,0);}catch(e){} }
function essaiSetBid(id,v){ const x=Math.max(0,Math.min(40,Math.round(+v||0))); if(x>0) essaiBids[id]=x; else delete essaiBids[id];
  const tot=Object.values(essaiBids).reduce((a,b)=>a+(+b||0),0); const over=tot>40;   // miser est FACULTATIF
  const bt=document.getElementById("essaibt"); if(bt){ bt.textContent=tot; bt.parentNode.className=over?'red':''; }
  const b2=document.getElementById("essaibidbtn"); if(b2){ b2.disabled=over; b2.textContent= over? t("Dépasse 40 € — réduis tes mises") : t("Valider ma prépa →"); } }
// Bonus REMPORTÉS par toi (plus haute enchère, égalité au plus rapide) → dépense = leur total.
function essaiWon(){ return ESSAI_CARDS.filter(id=>essaiAuctionResult(id).win==="me"); }
function essaiSpent(){ return essaiWon().reduce((a,id)=>a+(essaiBids[id]||0),0); }
// Capital dispo pour parier : 100 − enchères gagnées, + le net de la J1 quand on aborde la J2.
function essaiCapital(d){ let c=100-essaiSpent(); if(d>=1) c+=essaiMeNet(0,ESSAI_D1); return Math.round(c*100)/100; }
// Dépense d'enchères de CHAQUE joueur (le gagnant paie sa mise) → pour afficher les cagnottes.
function essaiSpendBy(){ const sp={me:0,lea:0,marco:0,nina:0}; ESSAI_CARDS.forEach(id=>{ const r=essaiAuctionResult(id); if(r.win) sp[r.win]+=r.best; }); return sp; }
// Cagnotte des 4 joueurs après la journée `upto` : 100 − enchères + nets cumulés.
function essaiCapitals(upto,fx2){ const sp=essaiSpendBy(); const cap={}; ESSAI_ORDER.forEach(k=>cap[k]=100-sp[k]);
  for(let d=0;d<=upto;d++){ const nets=essaiDayNets(d,d===0?ESSAI_D1:fx2); ESSAI_ORDER.forEach(k=>cap[k]+=(nets[k]||0)); }
  ESSAI_ORDER.forEach(k=>cap[k]=Math.round(cap[k]*100)/100); return cap; }
function essaiSetPick(d,i,v){ essaiPicks[d][i]=v; render(); }
function essaiSetCap(d,i){ essaiCap[d]=(essaiCap[d]===i?-1:i); if(essaiCap[d]===i&&essaiCardTgt[d]===i) essaiCardTgt[d]=-1; render(); }
function essaiSetCard(d,id){ essaiCard[d]=(essaiCard[d]===id?null:id); if(essaiCard[d]!=="tout") essaiCardTgt[d]=-1; render(); }
function essaiSetTgt(d,i){ if(essaiCard[d]!=="tout") return; essaiCardTgt[d]=(essaiCardTgt[d]===i?-1:i); if(essaiCardTgt[d]===i&&essaiCap[d]===i) essaiCap[d]=-1; render(); }
function essaiSetStake(d,i,v){ essaiStakes[d][i]=Math.max(0,Math.round(+v||0));
  const tot=(essaiStakes[d]||[]).reduce((a,b)=>a+(+b||0),0), max=Math.floor(essaiCapital(d)*0.5), over=tot>max;
  const fx=(d===0)?ESSAI_D1:essaiFxD2(); const allMin=fx.every((f,i2)=>(+essaiStakes[d][i2]||0)>=1);
  const capOk=essaiCap[d]>=0, tgtOk=essaiCard[d]!=="tout"||essaiCardTgt[d]>=0, ok=allMin&&!over&&capOk&&tgtOk;
  const el=document.getElementById("essaist"); if(el){ el.textContent=tot; el.parentNode.className=over?'red':''; }
  const g=document.getElementById("essaigauge"); if(g){ g.querySelector("i").style.width=(max>0?Math.min(100,Math.round(tot/max*100)):0)+"%"; g.classList.toggle("over",over); }
  const b=document.getElementById("essaibetbtn"); if(b){ b.disabled=!ok; b.textContent= over? t("Mise trop élevée") : (!allMin? t("Mise de 1 € min. par pari") : (!capOk? t("Choisis ton Capitaine 👑") : (!tgtOk? t("Choisis la cible 🎯 du bonus") : t("Valider mes pronos →")))); } }
function essaiToggleSel(k){ const j=essaiSel.indexOf(k); if(j>=0) essaiSel.splice(j,1); else if(essaiSel.length<3) essaiSel.push(k); render(); }
function essaiFxD2(){ return essaiSel.map(k=>ESSAI_POOL[k]); }
// L'adversaire a ses PROPRES mises (fixes, indépendantes des tiennes — avant il copiait les tiennes, ce
// qui faisait faux, signalé par Hervé). Il a aussi un Capitaine (match essaiBotCap) doublé.
const ESSAI_BOTSTAKE=[12,8,10];   // mise de l'IA par match (indépendante du joueur)
function essaiBotStk(i){ return ESSAI_BOTSTAKE[i]!=null?ESSAI_BOTSTAKE[i]:ESSAI_STAKE; }
function essaiBotCap(d){ return d===0?2:0; }   // match du capitaine adverse (J1 : Nadal gagnant · J2 : 1er match)
function essaiBotNet(fx,stakes,capIdx){ if(capIdx==null) capIdx=-1; let n=0; fx.forEach((f,i)=>{ const st=essaiBotStk(i); const win=f.botSel===f.res; let g=win?st*(oddOf(f,f.botSel)-1):-st; if(i===capIdx) g*=2; n+=g; }); return Math.round(n*100)/100; }
function essaiMeNet(d,fx){ const picks=essaiPicks[d]||[], stakes=essaiStakes[d]||[], cap=essaiCap[d], card=essaiCard[d], tgt=essaiCardTgt[d];
  let n=0; fx.forEach((f,i)=>{ if(picks[i]==null) return; const st=+stakes[i]||0; const win=picks[i]===f.res; const base= win? st*(oddOf(f,picks[i])-1) : -st;
    let g=base; if(card==="tout"&&i===tgt){ g= win? base*3 : base*2; } else if(i===cap){ g=base*2; } n+=g; });
  n=Math.round(n*100)/100; const bn=essaiBotNet(fx,stakes,essaiBotCap(d));
  if(card==="parachute"&&n<0) n=Math.round(n*0.7*100)/100;          // 30 % de la perte amortie
  if(card==="sangsue"&&bn>0) n=Math.round((n+0.15*bn)*100)/100;     // 15 % du bénéfice de Léa siphonné
  return n; }
function essaiDuel(d,fx){ const me=essaiMeNet(d,fx), bot=essaiBotNet(fx,essaiStakes[d]); const won=me>bot, tie=me===bot;
  const pts=tie?1:(won?(me>0?3:2):(me>0?1:0)), bpts=tie?1:(!won?(bot>0?3:2):(bot>0?1:0)); return {me,bot,won,tie,pts,bpts}; }
// Nets des 4 joueurs pour la journée d : toi (réel), ton adversaire du jour (réel), les 2 autres (fixes).
function essaiDayNets(d,fx){ const nets={me:essaiMeNet(d,fx)}; nets[essaiOpp(d).id]=essaiBotNet(fx,essaiStakes[d],essaiBotCap(d));
  const sh=ESSAI_SHADOW[d]; for(const k in sh) if(!(k in nets)) nets[k]=sh[k]; return nets; }
// Barème RÉEL (v2) : duel gagné 2 / nul 1 / perdu 0, +1 si net positif, +1 au ⭐ meilleur prono du jour.
function essaiDayPts(d,fx){ const nets=essaiDayNets(d,fx); const pairs=d===0?[["me","lea"],["marco","nina"]]:[["me","marco"],["lea","nina"]];
  const pts={me:0,lea:0,marco:0,nina:0};
  pairs.forEach(([a,b])=>{ const na=nets[a],nb=nets[b], ba=na>0?1:0, bb=nb>0?1:0;
    if(na>nb){ pts[a]+=2+ba; pts[b]+=bb; } else if(na<nb){ pts[a]+=ba; pts[b]+=2+bb; } else { pts[a]+=1+ba; pts[b]+=1+bb; } });
  let star=null,best=-1e9; ["me","lea","marco","nina"].forEach(k=>{ if(nets[k]>best){best=nets[k];star=k;} }); if(star) pts[star]+=1;
  return {nets,pts,star}; }
function essaiTotals(upto,fx2){ const T={me:0,lea:0,marco:0,nina:0}; for(let d=0;d<=upto;d++){ const p=essaiDayPts(d,d===0?ESSAI_D1:fx2).pts; for(const k in T) T[k]+=p[k]; } return T; }
// Classement : plus de POINTS d'abord, puis plus grosse CAGNOTTE (si fournie), puis « toi » devant.
function essaiRank(T,caps){ return ESSAI_PLAYERS.map(p=>({...p,pts:T[p.id]})).sort((a,b)=>(b.pts-a.pts)||((caps?caps[b.id]:0)-(caps?caps[a.id]:0))||(a.id==="me"?-1:(b.id==="me"?1:0))); }
function viewEssai(){
  const N=11, head=step=>`<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="row" style="gap:6px"><button class="btn ghost sm" onclick="exitEssai()">${AUTH?'🏠 '+t("Accueil"):'← '+t("Connexion")}</button>${step>0?`<button class="btn ghost sm" onclick="essaiGo(${step-1})">${t("← Précédent")}</button>`:''}</div>
      <span class="mini muted"><b>${t("étape {a}/{b}",{a:step+1,b:N})}</b></span></div>
    <div class="gauge" style="margin-bottom:12px"><i style="width:${Math.round((step+1)/N*100)}%"></i></div>`;
  const ann=txt=>`<div class="mini" style="margin-top:8px;color:var(--blue);background:rgba(90,166,224,.10);border-radius:8px;padding:7px 9px">ℹ️ <b>${t("Dans le vrai jeu")}</b> : ${txt}</div>`;
  const selLbl=(f,s)=> s==="1"?f.home : s==="2"?f.away : t("Nul");
  const betCard=(d,f,i)=>{ const showTgt=(essaiCard[d]==="tout"), isTgt=essaiCardTgt[d]===i;
    return `<div class="box"><div class="row"><div class="row" style="gap:8px"><span class="sport">${f.sport}</span><b>${esc(f.home)} – ${esc(f.away)}</b></div>

  const betScreen=(d,fx,goNext,showGuide)=>{ const won=essaiWon(); const usedBefore=essaiCard.slice(0,d).filter(Boolean); const avail=won.filter(id=>usedBefore.indexOf(id)<0);

  // Une LIGNE alignée (label à gauche, montant à droite) — même colonne que les lignes de pari,

  // 2 — enchères bonus (plafond 40 €, fiche au clic, FACULTATIF — choix stratège vs prudent)

function openLeague(lid,pid,fresh,consultation){

  // retrouverait dans la ligue d'un autre groupe SANS le verrou d'écriture (v7.11).
  if(LECTURE_SEULE) localStorage.removeItem("pl_last");

/* ---- Consultation d'une ligue depuis l'écran Admin (v7.11) --------------------------------
   On regarde la ligue avec les yeux d'un de SES joueurs — l'organisateur de préférence, sinon
   le premier humain. Sans quoi `me()` renverrait undefined et la moitié des écrans planterait.
   ⚠️ Le joueur IA n'est jamais choisi : sa vue n'a pas de sens (pas de compte, pas d'options). */
async function adminVoirLigue(lid, code){
  try{
    const ps=await q(db.from("players").select("id,name,is_ai,is_organizer,join_order").eq("league_id",lid));
    const humains=(ps||[]).filter(p=>!p.is_ai);
    const vu=humains.find(p=>p.is_organizer) || humains[0] || (ps||[])[0];
    if(!vu){ showErr("Cette ligue n'a aucun joueur — rien à consulter."); return; }
    lectureSeuleVu=vu.name||"?"; lectureSeuleCode=code||"";
    openLeague(lid, vu.id, false, true);   // 4ᵉ argument = consultation (v7.12)
  }catch(e){ showErr("Consultation : "+e.message); }
}

// drapeau restait armé sur les ligues personnelles d'Hervé (bug v7.11).
