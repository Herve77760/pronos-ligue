<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Maestro League</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%2314b88a'/%3E%3Ccircle cx='20' cy='20' r='13' fill='%230d3b30'/%3E%3Cline x1='14.5' y1='25.5' x2='26' y2='14' stroke='%235fe3bf' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='14' cy='26' r='2.8' fill='%235fe3bf'/%3E%3C/svg%3E">
<style>
  /* Thème SOMBRE (défaut) — aligné sur la palette dorée des maquettes : accent = doré #E7B84B. */
  :root{
    /* v6.42 (Hervé) : thème sombre un peu MOINS sombre — navy relevé d'un cran, mêmes teintes dorées. */
    --bg:#131d33; --panel:#1e2c49; --panel2:#263557; --border:#354464;
    --ink:#eef1f7; --muted:#97a0b6; --faint:#6b7897;
    --accent:#E7B84B; --accent-ink:#12100a; --brand:#19c58c;
    --field:#31456e; --field-bd:#4d6293;
    --green:#25C07D; --red:#e5695f; --gold:#E7B84B; --blue:#67a6f2;
    --r:16px; --shadow:0 1px 2px rgba(0,0,0,.28),0 8px 24px rgba(0,0,0,.30);
  }
  :root[data-theme="light"]{
    --bg:#eef1f6; --panel:#ffffff; --panel2:#f4f6fa; --border:#e3e8f1;
    --ink:#161d2b; --muted:#69748c; --faint:#9aa4b8;
    --accent:#0e9e70; --accent-ink:#ffffff; --brand:#0e9e70;
    --field:#ffffff; --field-bd:#cfd8e6;
    --green:#1f9d54; --red:#d83f36; --gold:#b9820f; --blue:#2f77d6;
    --shadow:0 1px 2px rgba(20,29,43,.05),0 8px 22px rgba(20,29,43,.07);
  }
  *{box-sizing:border-box}
  /* overflow-x sur html AUSSI : sur iOS, la regle posee seulement sur body ne bloque pas
     le defilement lateral — on pouvait faire glisser la page de quelques pixels. */
  html,body{overflow-x:hidden;}
  /* touch-action:manipulation → supprime le zoom au DOUBLE-TAP (signalé par Hervé) sans toucher au
     pinch-zoom volontaire, qui reste autorisé pour l'accessibilité (cf. note sur le <meta viewport>). */
  html{touch-action:manipulation;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    /* un pseudo ou un gage personnalise sans espace ne doit pas elargir la page */
    overflow-wrap:break-word;}
  .num,td.num,.big,.code{font-variant-numeric:tabular-nums;}
  .app{max-width:540px;margin:0 auto;padding:20px 16px 92px;}
  h1{font-size:21px;margin:0;letter-spacing:-.4px;font-weight:800;}
  h2{font-size:15px;margin:22px 4px 10px;letter-spacing:.01em;}
  .sub{color:var(--muted);font-size:12.5px;}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .topbtns{display:flex;gap:8px;width:100%;margin-top:2px;}
  .topbtns .btn{flex:1 1 0;min-width:0;padding-left:0;padding-right:0;text-align:center;}
  .box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  /* Sans ceci, un enfant de flex garde min-width:auto : il refuse de retrecir sous la largeur
     de son contenu et POUSSE la ligne hors de l'ecran (mesure : +190px avec un nom long). */
  .row>*{min-width:0;}
  .muted{color:var(--muted);} .green{color:var(--green);} .red{color:var(--red);}
  .gold{color:var(--gold);} .blue{color:var(--blue);} .mini{font-size:12px;}
  .btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border:none;border-radius:12px;
    padding:14px;width:100%;font-size:15px;cursor:pointer;transition:opacity .15s,transform .05s;}
  .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:10px;}
  /* 16px MINIMUM sur tout champ saisissable — ce n'est pas un choix esthétique.
     iOS Safari ZOOME automatiquement la page quand on touche un champ dont la police fait moins de
     16px, et il ne dézoome pas ensuite. À 15px, saisir une mise suffisait à laisser la page à
     ×1,07 : la fenêtre visible passait à 366px pour une mise en page de 390px, d'où 24px hors
     écran et un défilement latéral permanent. Diagnostiqué le 19/07/2026 grâce au rapport 🐛
     d'Hervé (« Zoom ×1.07 · zone visible 366px » alors que « contenu 390px / fenêtre 390px (ok) »),
     après deux tentatives infructueuses côté mise en page — qui n'était pas en cause.
     Ne JAMAIS redescendre sous 16px ici, et ne pas « corriger » avec maximum-scale=1 dans le
     <meta viewport> : ça empêcherait aussi le zoom volontaire, au détriment de l'accessibilité. */
  input,select,textarea{font-size:16px;}
  input,select{background:var(--field);border:1.5px solid var(--field-bd);color:var(--ink);
    border-radius:10px;padding:12px;width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  input[type=number]{width:84px;text-align:right;}
  label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px;}
  .chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
  .chip.g{background:color-mix(in srgb,var(--green) 15%,transparent);border-color:color-mix(in srgb,var(--green) 42%,transparent);color:var(--green);}
  .chip.b{background:color-mix(in srgb,var(--blue) 15%,transparent);border-color:color-mix(in srgb,var(--blue) 42%,transparent);color:var(--blue);}
  .chip.gold{background:color-mix(in srgb,var(--gold) 17%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);}
  .chip.red{background:color-mix(in srgb,var(--red) 15%,transparent);border-color:color-mix(in srgb,var(--red) 42%,transparent);color:var(--red);}
  .ptpill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;
    background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold);}
  .ptpill.zero{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);}
  .sport{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:inline-flex;
    align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;}
  .odds{display:flex;gap:7px;margin-top:10px;}
  .odd{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:8px 2px;text-align:center;font-size:12px;cursor:pointer;line-height:1.3;}
  .odd b{display:block;font-size:13px;}
  .odd.sel{background:color-mix(in srgb,var(--green) 14%,transparent);border-color:var(--green);color:var(--green);}
  .gauge{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:8px;}
  .gauge>i{display:block;height:100%;background:var(--green);}
  .gauge.over>i{background:var(--red);}
  .tog{font-size:11px;border:1px solid var(--border);border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--muted);}
  .tog.cap.on{background:color-mix(in srgb,var(--gold) 16%,transparent);border-color:var(--gold);color:var(--gold);}
  .tog.tgt.on{background:color-mix(in srgb,var(--blue) 16%,transparent);border-color:var(--blue);color:var(--blue);}
  .cards{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .cardchip{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:9px 11px;
    font-size:12px;cursor:pointer;text-align:center;min-width:76px;}
  .cardchip.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);}
  .cardchip .em{font-size:19px;display:block;margin-bottom:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  /* Les 6 tableaux vivent deja dans un conteneur `overflow-x:auto` : ils defilent CHEZ EUX et ne
     peuvent pas elargir la page. Donc surtout PAS de `overflow-wrap:anywhere` ici — ca coupait les
     mots n'importe ou dans des colonnes etroites (« DU/EL », « P/T/S », « 11 » sur deux lignes,
     « 109.7 / 1€ »). Entetes et nombres restent insecables. */
  /* Les nombres ne se coupent JAMAIS — dans un tableau comme ailleurs. Sans `.num` ici, une valeur
     placée dans une .row (dont les enfants peuvent rétrécir depuis la v4.53) se faisait couper par
     `overflow-wrap:break-word` : « 13 » s'affichait sur deux lignes (repéré par Hervé sur l'admin). */
  /* `flex-shrink:0` en plus du nowrap : dans une .row, c'est le LIBELLÉ qui doit céder de la place,
     jamais la valeur. Sans ça, le libellé long pousse et la valeur se fait comprimer sous sa propre
     largeur (les enfants de .row peuvent rétrécir depuis la v4.53). Inerte sur un <td>. */
  th,.num{white-space:nowrap;}
  .row>.num{flex:0 0 auto;}
  th,td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:left;}
  tr:last-child td{border-bottom:none;}
  th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
  td.num{text-align:right;}
  .hide{display:none;}
  .code{font-size:30px;letter-spacing:7px;font-weight:800;color:var(--accent);text-align:center;}
  .tag{font-size:10px;color:var(--muted);}
  .foot{color:var(--faint);font-size:11px;text-align:center;margin-top:24px;}
  .err{background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);
    color:var(--red);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--panel2);
    border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;z-index:50;box-shadow:var(--shadow);color:var(--ink);}
  @keyframes tradepulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.5}}
  .tradebadge{display:inline-block;margin-left:1px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:800;line-height:16px;vertical-align:super;animation:tradepulse 1s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){.tradebadge{animation:none}}
  .prem{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);white-space:nowrap;vertical-align:middle;cursor:pointer;}
  a{color:var(--blue);}
  .big{font-size:30px;font-weight:800;letter-spacing:-.5px;}
  .recaphero{border-radius:var(--r);padding:18px;border:1px solid var(--border);background:var(--panel);box-shadow:var(--shadow);margin:12px 0;}
  .recaphero.win{background:color-mix(in srgb,var(--green) 9%,var(--panel));border-color:color-mix(in srgb,var(--green) 45%,var(--border));}
  .recaphero.loss{background:color-mix(in srgb,var(--red) 9%,var(--panel));border-color:color-mix(in srgb,var(--red) 45%,var(--border));}
  .qbar{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;margin:8px 0 2px;-webkit-overflow-scrolling:touch;}
  .qbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;background:none;border:none;padding:0;cursor:pointer;}
  .qbtn .ic{width:52px;height:52px;border-radius:16px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow);}
  .qbtn .lb{font-size:11px;color:var(--muted);font-weight:600;text-align:center;line-height:1.15;}
  .qbtn:active .ic{transform:scale(.96);}
  .qbtn.on .ic{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel));}
  .qbtn.on .lb{color:var(--ink);}
  /* Barre d'onglets fixe en bas (v6 navigation) */
  #bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);}
  #bottomnav.hide{display:none;}
  #bottomnav .inner{display:flex;width:100%;max-width:540px;}
  .navtab{flex:1 1 0;min-width:0;background:none;border:none;color:var(--muted);font:inherit;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  .navtab .ic{font-size:20px;line-height:1;filter:grayscale(.35);opacity:.8;}
  .navtab .lb{font-size:10px;font-weight:600;line-height:1.1;text-align:center;}
  .navtab:active{transform:scale(.97);}
  .navtab.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--accent);}
  .navtab.on .ic{filter:none;opacity:1;}
  .modal{position:fixed;inset:0;background:rgba(4,6,12,.62);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .mbox{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow);}
  .clik{cursor:pointer;}
  .bem{font-size:1.35em;line-height:1;vertical-align:-2px;}
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pl_theme')||'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>

/* ============ AVATARS (v6.50) ============
   L'avatar d'un joueur est une CHAÎNE polymorphe stockée dans players.emoji / AUTH.avatar :

  var ears='<circle cx="29" cy="49" r="4.6" fill="'+s+'"/><circle cx="71" cy="49" r="4.6" fill="'+s+'"/>';
  var neck='<path d="M43 62 h14 v8 h-14 z" fill="'+s+'"/>';

function drawDiverse(pool,n){

// ⚠️ Ceci REMPLACE la règle v4.09 (« le vote du vainqueur s'applique », récompense comprise).

// construction la diversité possible.
function tourDeRole(list,n,decalage){
  const parComp={}; list.forEach(e=>{ const k=e.compKey||"?"; (parComp[k]=parComp[k]||[]).push(e); });

  // Avant, on interrogeait dans l'ordre où l'API répond puis on coupait à 24 : en intersaison il

  // Maintenant : 3 gros championnats d'abord (le volume), puis la VARIÉTÉ (peu nombreuse mais
  // indispensable au quota 75/25 — sans elle l'arrêt anticipé ne peut pas se déclencher), puis le
  // reste du football. En pratique l'arrêt tombe vers la 8ᵉ compétition. Le plafond de 24 ne sert
  // plus que de filet en intersaison profonde.
  const parPrio=(a,b)=>leaguePrio(b.key,grp[b.key])-leaguePrio(a.key,grp[a.key]);
  const foot=active.filter(s=>s.group==="Soccer").sort(parPrio);
  const autres=active.filter(s=>s.group!=="Soccer").sort(parPrio);
  const keys=[...foot.slice(0,3), ...autres.slice(0,5), ...foot.slice(3)].map(s=>s.key).slice(0,24);
  // FENÊTRE DE RÉCOLTE — volontairement large et INDÉPENDANTE de toute ligue (v6.92, Hervé).
  // Avant, elle partait de la clôture des paris de la ligue en cours : la récolte n'était donc
  // valable que pour CETTE ligue, à CET instant — impossible à mutualiser plus de quelques heures.
  // Désormais on ramasse tout ce qui se joue dans les HARVEST_WINDOW_D prochains jours, sans se
  // soucier des échéances ; c'est la SÉLECTION (selectPool, plus bas) qui filtrera selon la ligue
  // qui pioche. Le stockage est commun, le filtrage est individuel — et ça ne coûte pas un crédit
  // de plus : le prix est au CHAMPIONNAT interrogé, jamais au nombre de matchs rapportés.
  const cutoffMin=Date.now();
  const cutoffMax=cutoffMin+HARVEST_WINDOW_D*24*3600000;
  // MÉMOIRE DES COMPÉTITIONS VIDES (v6.97, demandée par Hervé) — le plus gros gisement d'économie.
  // Mesure du 28/07 : 17 championnats interrogés pour 8 productifs. Un championnat qui ne rapporte
  // rien est facturé COMME LES AUTRES : en intersaison, Premier League, Liga et Bundesliga coûtent
  // 1 crédit chacune tous les 3 jours pour rien. ⚠️ Aucun signal gratuit ne permet de les éviter :
  // vérifié le 28/07, /sports renvoie `active:true` pour EPL, Liga, Bundesliga et Serie A alors que
  // les quatre répondent à vide. Il faut donc mémoriser ce qu'on a constaté.
  // RÈGLE : un championnat vide est sauté à la récolte SUIVANTE, puis retesté. Une récolte sur deux.
  // Choix assumé : la facture des championnats vides est divisée par deux, et on ne peut pas rater
  // une reprise de championnat de plus de ~6 jours (2 récoltes). Un oubli plus long (14 jours,
  // 30 jours) économiserait davantage mais ferait manquer la reprise de la Ligue 1 ou de la NBA.
  const memo=(await cacheRead("vides", Infinity))||{};
  const sautes=[]; const out=[]; const comps=new Set();
  for(const k of keys){
    if(memo[k]===true){ memo[k]=false; sautes.push(k); continue; }   // sauté ce coup-ci, retesté au suivant
    try{ const r=await fetch(`${ODDS_BASE}/sports/${k}/odds/?apiKey=${ODDS_KEY}&regions=eu&markets=h2h&oddsFormat=decimal&dateFormat=iso`);
    noteQuota(r.headers.get("x-requests-remaining"));   // c'est le poste le plus coûteux : on en profite pour relever le solde
    if(!r.ok) continue; const arr=await r.json();
    const avant=out.length;
    arr.forEach(ev=>{ const _t=new Date(ev.commence_time).getTime(); if(_t<cutoffMin||_t>cutoffMax) return; const f=oddsEventToFixture(ev,grp[k]); if(f){ f.prio=leaguePrio(k,grp[k]); f.grp=grp[k]; f.compKey=k; out.push(f); comps.add(k); } });
    // « Vide » = n'a rien rapporté d'UTILISABLE dans la fenêtre. Ce n'est pas la même chose qu'une
    // réponse vide de l'API : un championnat peut renvoyer des matchs tous situés au-delà des
    // 8 jours. Dans les deux cas le crédit est parti et la compétition n'a rien apporté.
    if(out.length===avant) memo[k]=true; else delete memo[k];
  }catch(e){}
    // Arrêt anticipé — c'est LUI qui fixe la facture (1 crédit par championnat interrogé).
    // Le seuil porte sur le nombre de championnats PRODUCTIFS, pas sur le nombre d'appels : en
    // intersaison beaucoup répondent à vide, et s'arrêter sur un compteur d'appels donnerait une
    // réserve famélique. Il faut aussi assez de championnats DIFFÉRENTS, sinon le tour de rôle
    // n'aurait rien à panacher un samedi.
    // MESURE DU 28/07 (récolte réelle, facture reconstituée au crédit près) : 17 championnats
    // interrogés pour 8 productifs — un championnat qui répond À VIDE est facturé quand même.
    // En retirant le rugby (2 compétitions productives ce jour-là), le seuil de 8 aurait poussé la
    // récolte encore plus loin dans le football de second rang, donc PLUS cher. Seuil ramené à 6 :
    // les 6 premiers productifs donnaient déjà ~58 matchs et 26 hors football, largement de quoi
    // tenir 3 jours à 9 affiches. On coupe la queue de liste, pas la qualité.
    if(comps.size>=6 && out.length>=30 && out.filter(e=>e.grp!=="Soccer").length>=5) break;
  }
  // FILET — si la récolte précédente avait tout trouvé vide, TOUT serait sauté et la réserve
  // repartirait vide : l'app n'aurait plus une seule affiche à proposer. L'économie ne doit jamais
  // aller jusqu'à casser le jeu. Dans ce cas seulement, on retente les compétitions sautées.
  if(!out.length && sautes.length){
    for(const k of sautes){
      try{ const r=await fetch(`${ODDS_BASE}/sports/${k}/odds/?apiKey=${ODDS_KEY}&regions=eu&markets=h2h&oddsFormat=decimal&dateFormat=iso`);
        noteQuota(r.headers.get("x-requests-remaining"));
        if(!r.ok) continue; const arr=await r.json(); const avant=out.length;
        arr.forEach(ev=>{ const _t=new Date(ev.commence_time).getTime(); if(_t<cutoffMin||_t>cutoffMax) return; const f=oddsEventToFixture(ev,grp[k]); if(f){ f.prio=leaguePrio(k,grp[k]); f.grp=grp[k]; f.compKey=k; out.push(f); comps.add(k); } });
        if(out.length===avant) memo[k]=true; else delete memo[k];
      }catch(e){}
      if(comps.size>=6 && out.length>=30) break;
    }
  }
  await cacheWrite("vides", memo);
  return out;
}
// Sélection des affiches proposées à UNE ligue, à partir de la réserve commune (v6.92).
// C'est ICI qu'intervient l'échéance : seuls les matchs commençant APRÈS la clôture des paris sont
// éligibles — sinon une ligue créée deux jours après la récolte se verrait proposer des matchs déjà
// joués. La réserve est mutualisée (3 jours), le filtrage est propre à chaque ligue.
function selectPool(all){
  const _f=leagueFormula();
  const cutoffMin=Date.now()+((_f.sel||24)+(_f.bet||24))*3600000;
  // Second filtre sur les sports (v6.96) — indispensable, et pas redondant avec la récolte : la
  // réserve est mutualisée jusqu'à 3 jours, donc elle contient encore les sports récoltés AVANT ce
  // changement. Sans ce filtre, retirer un sport ne prendrait effet qu'à la récolte suivante et le
  // joueur continuerait à se voir proposer du rugby pendant trois jours.
  const dispo=(all||[]).filter(e=>{ const t=new Date(e&&e.commence).getTime();
    return !isNaN(t) && t>=cutoffMin && REAL_GROUPS.includes(e.grp); });
  const N=POOL_N, socTarget=POOL_FOOT; // ~75% de foot, 25% pour la variété (basket/tennis)
  const dec=ligueDecalage();   // deux ligues du même jour ne reçoivent pas la même liste
  // Construit un lot de N affiches À PARTIR D'UN VIVIER DONNÉ. Sorti en fonction (v7.10) pour
  // pouvoir être rejoué sur un vivier plus étroit — voir le resserrement plus bas.
  // Créneau serré = rythme de la formule : les matchs du jour se jouent groupés, donc les résultats
  // tombent ensemble (toute la ligue attend le dernier match). Repli sur la fenêtre large si creux.
  const batir=cand=>{
    const tightMax=cutoffMin+(_f.bet||24)*3600000;
    const tight=cand.filter(e=>new Date(e.commence).getTime()<=tightMax);
    const primary=(tight.length>=5)?tight:cand;
    // Football et variété remplis SÉPARÉMENT (pour tenir le quota 75/25), chacun par tour de rôle
    // entre ses compétitions → panachage des championnats un samedi, concentration un soir de C1.
    const pool=[...tourDeRole(primary.filter(e=>e.grp==="Soccer"), socTarget, dec),
                ...tourDeRole(primary.filter(e=>e.grp!=="Soccer"), N-socTarget, dec)];
    const completer=src=>{ const reste=src.filter(e=>pool.indexOf(e)<0);
      tourDeRole(reste, N-pool.length, dec).forEach(e=>{ if(pool.length<N) pool.push(e); }); };
    if(pool.length<N) completer(primary);
    if(pool.length<N) completer(cand);
    return pool.slice(0,N);
  };
  /* ---- PAS DE MATCH AU-DELÀ DE 72 H tant qu'on peut faire autrement (v7.10, règle d'Hervé) ----
     Le problème mesuré le 28/07 : quand le créneau serré ne contenait pas assez de matchs, la
     complétion puisait directement dans TOUTE la fenêtre de récolte (8 jours). Une journée
     Classique proposait 5 matchs groupés à 51-53 h, puis un trou de 47 h, puis trois matchs à
     100-102 h. Or une journée ne se résout que quand le DERNIER match est terminé : elle restait
     ouverte 4 jours, alors que 14 matchs étaient disponibles sous 96 h.
     LA RÈGLE : un match au-delà de 72 h doit être REMPLACÉ par un autre — s'il en existe un.
     On part donc de ce qui tient sous 72 h, puis on ne repousse la limite que **de 6 h en 6 h**,
     juste assez pour compléter les N places. On ne dépasse que du strict nécessaire.
     ⚠️ On repasse par `batir` à chaque palier (et non un simple « ajoute le plus proche ») : le
     quota 75 % football / 25 % variété et le panachage entre championnats restent respectés.
     ⚠️ En creux de calendrier — intersaison, trêve — il n'y aura parfois rien sous 72 h et la
     journée s'étalera quand même. C'est accepté : mieux vaut une journée longue qu'une liste
     incomplète. Le cas est rare (Hervé). */
  const limite72=Date.now()+ETALEMENT_MAX_H*3600000;
  let pool=batir(dispo.filter(e=>new Date(e.commence).getTime()<=limite72));
  for(let extra=6; pool.length<N && extra<=HARVEST_WINDOW_D*24; extra+=6){
    pool=batir(dispo.filter(e=>new Date(e.commence).getTime()<=limite72+extra*3600000));
  }
  // Ordre d'AFFICHAGE : les plus belles affiches en tête. N'affecte pas la composition du lot,
  // déjà arrêtée par les tours de rôle ci-dessus.
  return pool.slice(0,N).sort((a,b)=>afficheScore(b)-afficheScore(a));
}
let lastRealCheck=0, lastRealFill=0;
let liveRes={};   // derniers résultats réels récupérés par evId (pour l'option 📡 « direct » sur la page Résultats)
// v6.87 — La récupération des résultats pouvait échouer en SILENCE : `fetchRealResults` avalait
// toutes les erreurs, `liveRes` restait vide, et l'écran affichait des horloges. Le joueur en
// concluait que les matchs n'étaient pas joués, alors que c'est la SOURCE qui ne répond pas.
// Vécu le 2026-07-28 : quota The Odds API épuisé (499/500 utilisés) → plus aucun résultat affiché.
// `liveResErr` = toutes les compétitions interrogées ont échoué. `liveQuota` = crédits restants
// annoncés par l'API (en-tête `x-requests-remaining`), affiché dans l'écran admin.
let liveResErr=false, liveQuota=null;
// Le compteur de crédits doit survivre au rechargement de page, sinon il n'est JAMAIS visible :
// il n'était renseigné que si CETTE page avait appelé l'API, or sur l'écran admin on n'est dans
// aucune ligue — donc aucun appel (défaut de conception de la v6.87, signalé par Hervé).
// On le persiste donc dans le cache partagé : mesuré par n'importe quel client, lisible par l'admin.
function noteQuota(rem){ if(rem==null) return; liveQuota=+rem;
  try{ cacheWrite("quota",{remaining:+rem, at:new Date().toISOString()}); }catch(e){} }
// Relève le solde SANS RIEN CONSOMMER : l'endpoint /sports est gratuit (documenté « does not count
// against the usage quota ») mais renvoie quand même l'en-tête du solde. Appelé à l'ouverture de
// l'écran admin → le chiffre y est toujours à jour, sans jamais coûter un crédit.
async function refreshQuota(){
  try{ const r=await fetch(`${ODDS_BASE}/sports/?apiKey=${ODDS_KEY}`); noteQuota(r.headers.get("x-requests-remaining")); }catch(e){}
}
// 💰 CACHE DU POOL (mitigation quota, en attendant le stockage serveur de la Phase 2).
// Construire le pool coûte ~24 crédits (1 par compétition interrogée) et c'était refait à chaque
// ouverture de l'écran de sélection ET par le remplissage auto — dans CHAQUE navigateur ouvert.
// Les matchs des prochaines heures ne bougent pas d'une minute à l'autre : on garde le résultat
// POOL_TTL puis on le réutilise. Copie renvoyée (les appelants mélangent/tronquent la liste).
let poolCache=null, poolCacheAt=0; const POOL_TTL=30*60*1000; // 30 min (mémoire de CETTE page)

/* ===== CACHE PARTAGÉ DES APPELS API (v6.88) ==================================================
 * Le cache ci-dessus vit dans la MÉMOIRE du navigateur : chaque joueur, chaque appareil et chaque
 * rechargement repayait la facture. Le 2026-07-28, les 500 crédits mensuels de The Odds API ont été
 * épuisés → plus aucun résultat, journées en données réelles bloquées.
 * On ajoute donc un cache COMMUN dans Supabase (table `api_cache`, cf. MIGRATION-api-cache.sql) :
 * le premier client qui voit les données périmées prend un JETON, va chercher, et écrit pour tous.
 * La consommation cesse ainsi de dépendre du nombre de joueurs.
 * ⚠️ Ce n'est PAS une protection anti-triche (la clé d'API reste dans le navigateur) : c'est de
 * l'économie de quota. Déplacer la clé côté serveur = Phase 2.
 * ⚠️ Toutes les opérations sont défensives : si la table n'existe pas encore (migration pas passée)
 * ou si Supabase répond mal, on retombe SILENCIEUSEMENT sur l'appel direct — l'app ne casse jamais.
 */
// Réglages arrêtés avec Hervé le 2026-07-28, après calcul du budget mensuel (500 crédits gratuits) :
//   • récolte tous les 3 jours sur 8 jours d'avance  → ~10 crédits × 10 fois = ~100 crédits/mois
//   • résultats toutes les 2 h, UNIQUEMENT tant qu'un match est en cours → ~24 crédits par journée jouée
//   → il reste ~400 crédits pour les résultats, soit ~16 journées jouées par mois.
// Le prix étant AU CHAMPIONNAT interrogé et jamais au nombre de matchs rapportés, élargir la fenêtre
// de récolte ne coûte RIEN de plus : on ramasse large une fois, on ressert pendant 3 jours.
const POOL_SHARED_TTL   = 3*24*60*60*1000; // 3 jours — durée de vie de la réserve commune
const HARVEST_WINDOW_D  = 8;               // jours d'avance ramassés (couvre les 3 jours de validité + marge)
const SCORES_SHARED_TTL = 2*60*60*1000;    // 2 h — fréquence de mise à jour d'un championnat en cours
const MATCH_DUREE_MIN   = 105;             // min. après le coup d'envoi avant d'espérer un résultat
const CLAIM_TTL         = 2*60*1000;       // 2 min — si le client qui a pris le jeton meurt, un autre reprend

// Lit une entrée du cache partagé. `ttl` = âge maximum accepté (Infinity = « même périmé, donne »).
// Renvoie null si absente, trop vieille, ou si la table n'est pas là.
// `cacheAt` retient QUAND chaque entrée a été récoltée (v7.08). Sert à dater les cotes à l'écran :
// la réserve étant mutualisée jusqu'à 3 jours, un parieur régulier verra l'écart avec les cotes du
// jour et le lira comme un manque de sérieux. Le dire coûte une ligne et lève l'ambiguïté.
const cacheAt={};
async function cacheRead(key, ttl){
  try{
    const r=await q(db.from("api_cache").select("payload,fetched_at").eq("k",key));
    const row=Array.isArray(r)?r[0]:r; if(!row||row.payload==null) return null;
    const at=new Date(row.fetched_at).getTime();
    if(ttl!==Infinity){ const age=Date.now()-at;
      if(!(age>=0) || age>ttl) return null; }
    if(!isNaN(at)) cacheAt[key]=at;
    return row.payload;
  }catch(e){ return null; }
}
// Prend le JETON de rafraîchissement. UPDATE conditionnel : la base ne laisse passer qu'un seul
// client (même schéma atomique que la résolution d'une journée). Renvoie false si un autre l'a eu.
async function cacheClaim(key){
  const now=new Date().toISOString(), cutoff=new Date(Date.now()-CLAIM_TTL).toISOString();
  try{
    // upsert d'abord : une ligne 'scores:<compétition>' peut ne pas exister encore.
    try{ await q(db.from("api_cache").insert({k:key})); }catch(e){}   // doublon = déjà là, tant mieux
    const r=await q(db.from("api_cache").update({claimed_at:now}).eq("k",key).lt("claimed_at",cutoff).select("k"));
    return !!(r && r.length);
  }catch(e){ return false; }   // table absente → on laissera l'appelant faire l'appel direct
}
async function cacheWrite(key, payload){
  const now=new Date().toISOString();
  try{ await q(db.from("api_cache").upsert({k:key,payload,fetched_at:now,claimed_at:now},{onConflict:"k"})); }catch(e){}
}

// Renvoie les affiches à proposer à la ligue courante. La RÉSERVE (récolte brute, tous championnats,
// 8 jours d'avance) est partagée et valable 3 jours ; la SÉLECTION est refaite à chaque appel, car
// elle dépend de l'échéance de la ligue qui pioche.
async function fetchRealPoolCached(){
  const garder=r=>{ poolCache=r; poolCacheAt=Date.now(); return selectPool(r); };
  if(poolCache && (Date.now()-poolCacheAt)<POOL_TTL) return selectPool(poolCache);  // 1. mémoire locale
  const partage=await cacheRead("pool", POOL_SHARED_TTL);                           // 2. réserve commune
  if(Array.isArray(partage) && partage.length) return garder(partage);
  if(await cacheClaim("pool")){                                                     // 3. à moi de récolter
    const r=await fetchRealPool(); if(r&&r.length){ await cacheWrite("pool",r); cacheAt.pool=Date.now(); } return garder(r||[]);
  }
  // 4. un autre client récolte déjà → on ressert la dernière réserve connue, même périmée : mieux
  //    vaut des affiches d'il y a quatre jours que dix crédits dépensés en double.
  const vieux=await cacheRead("pool", Infinity);
  if(Array.isArray(vieux) && vieux.length) return garder(vieux);
  const r=await fetchRealPool(); if(r&&r.length){ await cacheWrite("pool",r); cacheAt.pool=Date.now(); } return garder(r||[]);
}
// Étiquette « Cotes relevées … » — vide en matchs simulés (les cotes y sont tirées à l'instant).
function cotesDatees(){ const at=cacheAt.pool; if(!at||!L||L.data_mode!=="real") return "";
  return `<div class="mini muted" style="margin-top:4px">💱 ${t("Cotes relevées {a} — elles ne bougent plus une fois la journée lancée.",{a:fmtWhen(at)})}</div>`; }
const STALE_MATCH_H=24; // h après le coup d'envoi prévu → match non terminé réputé ANNULÉ (mises rendues)
// Ligues à l'abandon (v7.07, réglages d'Hervé). Deux seuils DIFFÉRENTS, et c'est voulu :
// on SIGNALE d'abord, on ferme ensuite — sans le palier d'alerte, une ligue disparaîtrait sans
// que personne n'ait eu l'occasion de la relancer.
const LIGUE_ALERTE_J=7;    // signalée « à l'arrêt » sur l'écran admin
const LIGUE_FERME_J=14;    // fermée automatiquement, comme une fermeture AVANT TERME
// Au-delà de ce délai, la liste d'affiches est jugée trop étalée et on tente de la resserrer
// (v7.10, seuil fixé par Hervé). En dessous, on ne touche à RIEN : une journée déjà raisonnable
// ne doit pas voir sa composition changer. Voir selectPool.
const ETALEMENT_MAX_H=72;
// Récupère les résultats réels (scores) par compétition → map evId -> {completed, res(1/N/2)}.
async function fetchRealResults(sportKeys){
  const map={}; let ok=0, ko=0;
  for(const k of sportKeys){ try{ const r=await fetch(`${ODDS_BASE}/sports/${k}/scores/?apiKey=${ODDS_KEY}&daysFrom=3&dateFormat=iso`);
    // ⚠️ NE PAS nommer cette variable `q` : elle masquerait la fonction q() des appels Supabase.
    noteQuota(r.headers.get("x-requests-remaining"));   // crédits restants → écran admin
    if(!r.ok){ ko++; continue; } ok++; const arr=await r.json();
    arr.forEach(ev=>{ const done=!!ev.completed; let res=null;
      if(done && Array.isArray(ev.scores)){ const sc=n=>{ const o=ev.scores.find(x=>x.name===n); return o!=null?parseFloat(o.score):null; };
        const h=sc(ev.home_team), a=sc(ev.away_team);
        if(h!=null&&a!=null&&!isNaN(h)&&!isNaN(a)) res=(h>a?"1":(h<a?"2":"N")); }
      map[ev.id]={completed:done, res};
    });
  }catch(e){ ko++; } }
  // En échec seulement si AUCUNE compétition n'a répondu : un échec partiel laisse des résultats
  // exploitables, on ne va pas alarmer pour ça.
  liveResErr = (ko>0 && ok===0);
  return map;
}
// Version mutualisée. Cache par COMPÉTITION (et non par ligue) : c'est la granularité qui partage
// le plus — deux ligues qui suivent la Serie B brésilienne se contentent du même appel. Sur The Odds
// API, un appel de scores coûte 2 crédits ; les économiser un par un compte.
// `enCours` (facultatif) : pour chaque championnat, l'heure du coup d'envoi le plus ancien encore
// sans résultat. Sert à NE PAS interroger un championnat dont aucun match n'a eu le temps de finir.
// C'est ce qui remplace des créneaux horaires fixes (v6.92, discuté avec Hervé) : ceux-ci auraient
// manqué les championnats sud-américains, dont le coup d'envoi tombe vers 00h30 heure française —
// or l'été, ce sont eux qui remplissent la liste. Ici on se cale sur les horaires RÉELS, donc ça
// marche pour la NBA à 3h du matin comme pour la Ligue 1 à 21h, sans table à maintenir.
async function fetchRealResultsCached(sportKeys, enCours){
  const out={}; const aChercher=[];
  for(const k of sportKeys){ const c=await cacheRead("scores:"+k, SCORES_SHARED_TTL);
    if(c){ Object.assign(out,c); continue; }
    // Trop tôt pour espérer un résultat → on ne dépense pas les 2 crédits. On ressert ce qu'on a.
    const ko=enCours && enCours[k];
    if(ko!=null && Date.now() < ko + MATCH_DUREE_MIN*60000){
      const vieux=await cacheRead("scores:"+k, Infinity); if(vieux) Object.assign(out,vieux); continue; }
    aChercher.push(k); }
  let tente=false, echec=false;
  for(const k of aChercher){
    if(await cacheClaim("scores:"+k)){
      tente=true; const m=await fetchRealResults([k]); if(liveResErr) echec=true;
      if(m && Object.keys(m).length) await cacheWrite("scores:"+k, m);
      Object.assign(out,m);
    } else {
      // Un autre client s'en occupe : on prend sa dernière copie même périmée plutôt que de payer.
      const vieux=await cacheRead("scores:"+k, Infinity); if(vieux) Object.assign(out,vieux);
    }
  }

// Résout une journée en DONNÉES RÉELLES quand TOUS les vrais matchs sont terminés (throttle 10 min pour le quota).
async function resolveRealIfReady(){
  if(!L||L.data_mode!=="real"||L.status!=="running"||S.recap||resolving) return;
  const realDuels=duels.filter(d=>Array.isArray(d.fixtures)&&d.fixtures.some(f=>f&&f.evId));
  if(!realDuels.length) return;
  // Multi-duels : chaque duel a SES propres matchs → on attend que TOUS les duels aient leurs matchs
  // et que TOUS les matchs de la ligue soient terminés avant d'afficher/calculer quoi que ce soit.
  if(duels.some(d=>!Array.isArray(d.fixtures)||!d.fixtures.length)) return;
  const times=realDuels.flatMap(d=>d.fixtures).filter(f=>f&&f.commence).map(f=>new Date(f.commence).getTime());
  if(!times.length || Math.min.apply(null,times)>Date.now()) return; // aucun match commencé
  // Garde-fou LOCAL : évite de re-solliciter Supabase à chaque rafraîchissement de cette page.
  // La vraie économie de crédits vient du cache PARTAGÉ ci-dessous (fetchRealResultsCached).
  if(Date.now()-lastRealCheck < 1200000) return; lastRealCheck=Date.now();
  const keys=[...new Set(realDuels.flatMap(d=>d.fixtures).filter(f=>f&&f.evId).map(f=>f.sportKey))];
  // Pour chaque championnat, le coup d'envoi le plus ANCIEN parmi ses matchs pas encore résolus :
  // tant qu'il n'est pas assez loin, inutile de payer pour un résultat qui n'existe pas encore.
  const enCours={};
  realDuels.flatMap(d=>d.fixtures).forEach(f=>{ if(!f||!f.evId||f.canceled||f.res) return;
    const t=f.commence?new Date(f.commence).getTime():NaN; if(isNaN(t)) return;
    if(enCours[f.sportKey]==null || t<enCours[f.sportKey]) enCours[f.sportKey]=t; });
  const results=await fetchRealResultsCached(keys, enCours); liveRes=results||{};   // 📡 dispo pour l'affichage « direct » (Résultats)
  // ⏱️ AUTO-ANNULATION (v4.46) : un match toujours pas terminé plus de STALE_MATCH_H heures après son
  // coup d'envoi PRÉVU est réputé ANNULÉ (reporté / abandonné / jamais joué). Seuil très au-delà de la
  // durée d'un match (foot 2 h, tennis ≤ 5 h) et de tout retard de flux → aucun risque d'annuler un
  // match réellement joué. Rend le traitement AUTOMATIQUE : plus aucun geste de l'organisateur, qui
  // aurait pu s'avantager en annulant un match où il perdait.
  const nowT=Date.now();
  for(const d of realDuels){ let touched=false;
    const nf=(d.fixtures||[]).map(f=>{ if(!f||!f.evId||f.canceled) return f;
      const r=results[f.evId]; if(r&&r.completed) return f;
      const t0=f.commence?new Date(f.commence).getTime():NaN;
      if(!isNaN(t0) && nowT > t0 + STALE_MATCH_H*3600000){ touched=true; return Object.assign({},f,{canceled:true,res:null}); }
      return f; });
    if(touched){ try{ await q(db.from("duels").update({fixtures:nf}).eq("id",d.id)); d.fixtures=nf; }catch(e){} } }
  let allDone=true;
  // Un match ANNULÉ compte comme terminé : sinon une journée resterait bloquée indéfiniment.
  realDuels.forEach(d=>d.fixtures.forEach(f=>{ if(f&&f.evId&&!f.canceled){ const r=results[f.evId]; if(!r||!r.completed) allDone=false; } }));
  if(!allDone) return; // il reste des matchs en cours
  for(const d of realDuels){ const fx=d.fixtures.map(f=>{ if(f&&f.evId){ const r=results[f.evId]; if(r&&r.res) return Object.assign({},f,{res:r.res}); } return f; });
    try{ await q(db.from("duels").update({fixtures:fx}).eq("id",d.id)); }catch(e){} }
  resolveDay();
}
// Échéances du jour courant. sel = fin sélection ; bet = clôture des paris.
// Dès que tous les matchs sont choisis (bet_started_at), la clôture des paris = bet_started_at + delai (max 24h / 12h fast).
function dayTimes(){ const f=leagueFormula(); const t0=(L&&L.day_started_at)?new Date(L.day_started_at).getTime():0;
  if(!t0||isNaN(t0)) return {ok:false,sel:0,bet:0};
  const sel=t0+f.sel*3600000;
  const bs=(L&&L.bet_started_at)?new Date(L.bet_started_at).getTime():0;
  const bet=(bs&&!isNaN(bs))?(bs+f.bet*3600000):(t0+(f.sel+f.bet)*3600000);
  return {ok:true, sel, bet}; }
// La clôture des pronos est-elle passée ? (au-delà, on ne peut plus modifier et les pronos adverses sont révélés)
function deadlinePassed(){ const dt=dayTimes(); return !!(dt.ok && Date.now()>=dt.bet); }
// Simulé : les matchs fictifs doivent être « joués » (coup d'envoi + 2h) avant de publier les résultats — même
// déroulé qu'en réel (clôture → écran d'attente → résultats). Fixtures sans horaire (anciennes journées) = ignorées.
function simMatchesDone(){ const dz=duels||[]; if(!dz.length) return false; const now=Date.now();
  for(const d of dz){ for(const f of (d.fixtures||[])){ if(!f||f.evId) continue; const ts=fixtureKickoff(f);
    if(ts!=null && now < ts+2*3600000) return false; } }
  return true; }
function fmtWhen(ts){ if(!ts) return ""; const d=new Date(ts); const now=new Date(); const loc=lang==="en"?'en-GB':'fr-FR'; const hm=d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});
  const sameDay=d.toDateString()===now.toDateString(); const tomorrow=new Date(now.getTime()+86400000).toDateString()===d.toDateString();
  return (sameDay?t("aujourd'hui"):(tomorrow?t("demain"):d.toLocaleDateString(loc,{weekday:'short',day:'2-digit',month:'2-digit'})))+" "+hm; }
// Coup d'envoi d'un match : réel = f.commence (absolu) ; fictif = clôture des paris + f.ko heures. Renvoie un timestamp (ms) ou null.
function fixtureKickoff(f){ if(!f) return null;
  if(f.commence){ const ts=new Date(f.commence).getTime(); return isNaN(ts)?null:ts; }
  if(f.ko!=null){ const dt=dayTimes(); if(dt.ok&&dt.bet) return dt.bet + f.ko*3600000; }
  return null; }

function koLabel(f){ let ts=fixtureKickoff(f); if(!ts) return ""; ts=Math.round(ts/300000)*300000; return `<span class="mini muted">🕐 ${esc(fmtWhen(ts))}</span>`; }
// ÉTAT D'UN MATCH SANS SON RÉSULTAT (v7.05, demandé par Hervé). Sur les écrans d'APRÈS clôture,
// un joueur sans l'option ⏱️ voyait « 🕐 aujourd'hui 00:30 » sur un match joué depuis vingt
// heures : il en déduisait que le match n'avait pas encore eu lieu. On dit donc où en est la
// rencontre — sans jamais dévoiler qui a gagné, ce qui reste réservé à l'option.
// ⚠️ `liveRes` est alimenté pour TOUS les joueurs (c'est lui qui déclenche la résolution de la
// journée) ; seul son AFFICHAGE est premium. On peut donc s'en servir ici sans rien divulguer.
// À défaut, on estime par le temps écoulé, avec la même durée de match que le déclencheur de
// récupération des résultats (MATCH_DUREE_MIN) — une seule constante, pas deux règles.
// ⚠️ Un match reporté sera annoncé « terminé » à tort pendant quelques heures, jusqu'à ce que
// la règle d'annulation automatique (STALE_MATCH_H) prenne le relais et affiche « 🚫 annulé ».
// C'est assumé : afficher une heure de coup d'envoi dépassée trompait bien davantage.
function matchEtat(f){
  const r=liveRes[f && f.evId];
  if(r && r.completed) return "fini";
  const ts=fixtureKickoff(f); if(!ts) return "avant";
  const ecoule=Date.now()-ts;
  if(ecoule >= MATCH_DUREE_MIN*60000) return "fini";
  return ecoule>=0 ? "encours" : "avant";
}
// Heure du coup d'envoi tant que le match n'a pas commencé, puis son état.
function koOuEtat(f){
  const e=matchEtat(f);

  if(e==="encours") return `<span class="mini muted">⏱️ ${t("en cours")}</span>`;
  return koLabel(f);
}

  "⚖️ Tout est une question de <b>stratégie</b> : miser pour t'<b>armer de bonus</b>… mais en gardant assez d'<b>argent pour parier gros</b> ensuite. Ce que tu remportes est retiré de tes 100 €.":"⚖️ It's all about <b>strategy</b>: bid to <b>arm yourself with bonuses</b>… while keeping enough <b>money to bet big</b> afterwards. Whatever you win is taken from your 100 €.",

  "<b>Égalité</b> à {a} € → {w} l'emporte par la <b>rapidité</b>. Tu n'avais pas misé.":"<b>Tie</b> at {a} € → {w} wins on <b>speed</b>. You didn't bid.",
  "{w} l'emporte ({a} €). Tu n'avais pas misé → tu <b>gardes ton capital</b>.":"{w} wins it ({a} €). You didn't bid → you <b>keep your capital</b>.",

  "Comment parier :":"How to bet:",

  "La mise max":"The max stake",
  "Le total de tes mises sur les 5 matchs ne peut pas dépasser <b>{a} %</b> de ton capital ({b} % avec la carte 📈 Investisseur) — c'est ce que remplit la jauge. Chaque pari doit avoir <b>au moins 1 €</b>.":"Your total stakes across the 5 matches can't exceed <b>{a}%</b> of your capital ({b}% with the 📈 Investor card) — that's what fills the gauge. Each bet must be <b>at least €1</b>.",

  "Pas besoin d'email : choisis un pseudo + un mot de passe. Ton compte te permet de <b>retrouver toutes tes ligues</b>, depuis n'importe quel appareil.":"No email needed: pick a username + a password. Your account lets you <b>find all your leagues</b>, from any device.",
  "📖 Découvrir le jeu (règles)":"📖 Discover the game (rules)", "Tu peux lire les règles avant de créer un compte.":"You can read the rules before creating an account.",
  // --- Mode solo contre l'IA ---
  "Le vainqueur du duel est celui au <b>meilleur résultat net</b> (gains − mises).<br>Points = <b>résultat</b> (victoire <b>2</b>, nul <b>1</b>, défaite <b>0</b>) <b>+ 1 pt</b> si ton net est positif.<br>• Victoire : <b>3 pts</b> (net positif) ou <b>2 pts</b>.<br>• Match nul : <b>2 pts</b> (net positif) ou <b>1 pt</b>.<br>• Défaite : <b>1 pt</b> (net positif) ou <b>0 pt</b>.<br>• Oubli des pronos : <b>−1 pt</b>.":"The duel is won by the <b>best net result</b> (winnings − stakes).<br>Points = <b>result</b> (win <b>2</b>, draw <b>1</b>, loss <b>0</b>) <b>+ 1 pt</b> if your net is positive.<br>• Win: <b>3 pts</b> (positive net) or <b>2 pts</b>.<br>• Draw: <b>2 pts</b> (positive net) or <b>1 pt</b>.<br>• Loss: <b>1 pt</b> (positive net) or <b>0 pt</b>.<br>• Missed picks: <b>−1 pt</b>.",
  "Pas de validation à temps → <b>aucun pari pris en compte</b>, <b>{b} pt</b> au classement et <b>−{a} % du capital</b>.":"No confirmation in time → <b>no bet counted</b>, <b>{b} pt</b> in the standings and <b>−{a} % of your balance</b>.",
  "Points : <b>résultat</b> (victoire <b>2</b>, nul <b>1</b>, défaite <b>0</b>) <b>+ 1 pt</b> si ton net est positif. Soit <b>3 pts</b> au mieux, <b>0</b> au pire.":"Points: <b>result</b> (win <b>2</b>, draw <b>1</b>, loss <b>0</b>) <b>+ 1 pt</b> if your net is positive. So <b>3 pts</b> at best, <b>0</b> at worst.",
  "Points = <b>résultat</b> (victoire <b>2</b>, nul <b>1</b>, défaite <b>0</b>) <b>+ 1 pt</b> si ton net est positif.<br>Soit : victoire <b>3</b> ou <b>2</b> · nul <b>2</b> ou <b>1</b> · défaite <b>1</b> ou <b>0</b>. ⚠️ Un net de <b>0 €</b> (par exemple si tous les matchs du jour sont annulés) ne donne <b>pas</b> le point de bonus.":"Points = <b>result</b> (win <b>2</b>, draw <b>1</b>, loss <b>0</b>) <b>+ 1 pt</b> if your net is positive.<br>So: win <b>3</b> or <b>2</b> · draw <b>2</b> or <b>1</b> · loss <b>1</b> or <b>0</b>. ⚠️ A net of <b>€0</b> (for example if every match of the day is cancelled) does <b>not</b> earn the bonus point.",
  "Ton adversaire, lui, <b>gagne le duel</b> — mais uniquement <b>3 pts</b> si son net est positif, <b>2 pts</b> sinon. Il ne peut pas perdre d'argent à cause de ton absence.":"Your opponent <b>wins the duel</b> — but only <b>3 pts</b> if their net is positive, <b>2 pts</b> otherwise. They cannot lose money because of your absence.",
  "Tu prends <b>{b} pt</b> au classement et tu perds <b>{a} %</b> de ton capital.":"You take <b>{b} pt</b> in the standings and lose <b>{a} %</b> of your balance.",
  "Chaque journée, le joueur au <b>meilleur gain net de toute la ligue</b> gagne <b>+1 point bonus</b> (en plus des points de duel). En cas d'égalité : on départage par le plus gros gain.":"Each day, the player with the <b>best net result in the whole league</b> earns a <b>+1 bonus point</b> (on top of the duel points). Ties are broken by the biggest winnings.",
  "<b>Départage au classement final</b> (à points égaux) : <b>cagnotte</b>, puis le <b>résultat des confrontations directes</b> entre les joueurs concernés, puis plus gros gain, puis plus grosse cote.":"<b>Final standings tie-break</b> (equal points): <b>balance</b>, then the <b>head-to-head record</b> between the players involved, then biggest win, then biggest odds.",
  "La liste proposée contient <b>{a} rencontres</b> de <b>football, basket et tennis</b> — les seuls sports du jeu —, dont environ <b>{b} % de football</b>. S'il n'y a pas assez de football disponible, le complément vient du basket et du tennis. Le football ⚽ étant le seul sport à <b>3 issues</b> (victoire, nul, défaite), c'est lui qui rend la carte 🧈 {c} jouable.":"The list offers <b>{a} fixtures</b> from <b>football, basketball and tennis</b> — the only sports in the game —, of which about <b>{b} % football</b>. If there isn't enough football available, the remainder comes from basketball and tennis. Football ⚽ being the only sport with <b>3 outcomes</b> (win, draw, loss), it is what makes the 🧈 {c} card playable.",
  "Étape précédente d'abord":"Previous step first",
  "⏳ Étape précédente d'abord : tous les duels doivent avoir leurs 5 matchs.":"⏳ Previous step first: every duel must have its 5 matches.",
  "Un duel n'a pas encore ses 5 matchs. Clôturer maintenant empêcherait les joueurs concernés de parier, et la journée ne pourrait pas se résoudre.":"One duel doesn't have its 5 matches yet. Closing now would stop those players from betting, and the matchday couldn't be resolved.",
  "➡️ Utilise d'abord « 🎲 Tirer les matchs manquants ».":"➡️ Use « 🎲 Draw the missing matches » first.",
  "Un duel n'a pas encore ses 5 matchs — tire-les d'abord.":"One duel doesn't have its 5 matches yet — draw them first.",
  "Les pronos ne sont pas encore clôturés — clôture-les d'abord.":"Picks aren't closed yet — close them first.",
  "Échange impossible pour l'instant":"Exchange not possible right now",
  "<b>Ton pari du jour est déjà validé.</b> Tu ne peux donc pas proposer un rachat maintenant.":"<b>Your bet for today is already confirmed.</b> So you can't offer a buyback right now.",
  "<b>Ton pari du jour est déjà validé.</b> Tu ne peux donc pas mettre une carte en vente maintenant.":"<b>Your bet for today is already confirmed.</b> So you can't put a card up for sale right now.",
  "<b>Le détenteur de la carte a déjà validé son pari du jour.</b> Il pourrait encore la jouer aujourd'hui, l'échange est donc bloqué.":"<b>The card's owner has already confirmed today's bet.</b> They could still play it today, so the exchange is blocked.",
  "<b>L'acheteur a déjà validé son pari du jour.</b> L'échange est donc bloqué jusqu'à la résolution.":"<b>The buyer has already confirmed today's bet.</b> The exchange is therefore blocked until the day is resolved.",
  "Un échange n'est possible qu'<b>entre deux journées</b> : tant qu'un pari du jour est validé, la carte pourrait encore être jouée le même jour — elle serait alors utilisée deux fois.":"An exchange is only possible <b>between two matchdays</b>: while a bet for the day is confirmed, the card could still be played that same day — it would then be used twice.",
  "➡️ Ce sera de nouveau possible dès que la <b>journée {j}</b> sera résolue.":"➡️ It will be possible again as soon as <b>matchday {j}</b> is resolved.",
  "Elle se résout une fois <b>tous les matchs réellement joués</b>.":"It resolves once <b>every match has actually been played</b>.",
  "Clôture des pronos : <b>{a}</b>.":"Picks close: <b>{a}</b>.",
  "Pari non validé à temps : {b} pt au classement et −{a} % du capital":"Bet not confirmed in time: {b} pt in the standings and −{a} % of your balance",
  "⏰ <b>Pari non validé à temps.</b> Aucun pari pris en compte → <b>{b} pt</b> au classement et <b>−{a} %</b> du capital.":"⏰ <b>Bet not confirmed in time.</b> No bet counted → <b>{b} pt</b> in the standings and <b>−{a} %</b> of your balance.",
  "Tu n'as pas validé tes pronos avant la clôture : <b>aucun pari</b> n'est pris en compte ce jour-là → <b>{b} pt</b> au classement et <b>−{a} %</b> de ton capital. Tu peux quand même suivre les paris des autres ci-dessous.":"You didn't confirm your picks before the deadline: <b>no bet</b> counts that day → <b>{b} pt</b> in the standings and <b>−{a} %</b> of your balance. You can still follow everyone else's bets below.",
  "🤖 Format du solo":"🤖 Solo format", "solo":"solo",
  "doit choisir les matchs":"must pick the matches", "attend les matchs":"waiting for the matches",
  "En attente d'autres joueurs":"Waiting for more players", "si solo":"if solo",
  "Les inscriptions sont ouvertes : partage le code <b>{a}</b>. Rien n'est figé tant que tu n'as pas clôturé.":"Registrations are open: share the code <b>{a}</b>. Nothing is locked in until you close them.",
  "ton adversaire <b>si tu clôtures maintenant</b>, à toi seul":"your opponent <b>if you close now</b>, on your own",
  "1 aller-retour — 2 journées":"1 home-and-away — 2 days", "2 allers-retours — 4 journées":"2 home-and-away rounds — 4 days",
  "Partie éclair : tu affrontes l'IA une fois à domicile, une fois à l'extérieur.":"Lightning game: you face the AI once at home, once away.",
  "Un peu plus long : le temps de sortir tes bonus et de te refaire si tu démarres mal.":"A bit longer: time to play your bonuses and recover if you start badly.",
  "🎭 En solo, il n'y a <b>ni gage ni récompense</b> — il faut au moins deux humains pour ça. L'étape de vote est donc sautée : tu passes directement aux enchères sur les bonus.":"🎭 In solo there's <b>no forfeit and no reward</b> — that needs at least two humans. The vote step is skipped: you go straight to the bonus auction.",
  "Lancer la partie solo":"Start the solo game", "Il faut au moins 1 joueur":"You need at least 1 player",
  "Tu joues <b>seul contre l'IA</b>. Tu peux encore inviter des amis avec le code <b>{a}</b> — dès qu'un deuxième joueur rejoint, la partie redevient normale (avec gage/récompense).":"You're playing <b>solo against the AI</b>. You can still invite friends with code <b>{a}</b> — as soon as a second player joins, the game becomes a normal one (with forfeit/reward).",
  "Lancer la partie en SOLO contre le 🤖 joueur IA ? Personne d'autre ne pourra rejoindre. Pas de gage ni de récompense, et {a} journées à jouer.":"Start the game SOLO against the 🤖 AI player? Nobody else will be able to join. No forfeit or reward, and {a} days to play.",
  // --- Match annulé ---
  "🚫 Un match a été annulé ? (organisateur)":"🚫 A match was cancelled? (organiser)", "Un match a été annulé ?":"A match was cancelled?",
  "Aucun match à annuler.":"No match to cancel.",
  "Choisis le match annulé ou reporté. Les mises de tous les joueurs qui l'avaient joué seront <b>remboursées</b>, et le bonus qui le visait leur sera <b>rendu</b>.":"Pick the cancelled or postponed match. The stakes of every player who bet on it will be <b>refunded</b>, and the bonus that targeted it will be <b>given back</b>.",
  "Annuler ce match ? Les mises seront remboursées et les bonus qui le visaient rendus. Action irréversible.":"Cancel this match? Stakes will be refunded and the bonuses targeting it given back. This cannot be undone.",
  "Match annulé — mises remboursées.":"Match cancelled — stakes refunded.",
  "🚫 <b>Match annulé, reporté ou abandonné</b> : si un match n'est toujours pas terminé <b>{a} h</b> après son coup d'envoi prévu, il est <b>automatiquement</b> considéré comme annulé. La <b>mise est rendue</b> (ni gain ni perte, comme si le pari n'avait pas eu lieu) et le <b>bonus qui visait ce match t'est rendu</b>. C'est automatique : personne ne décide, donc personne ne peut en profiter.":"🚫 <b>Cancelled, postponed or abandoned match</b>: if a match still isn't finished <b>{a} h</b> after its scheduled kick-off, it is <b>automatically</b> treated as cancelled. The <b>stake is refunded</b> (no gain, no loss — as if the bet never happened) and the <b>bonus that targeted it is given back</b>. It's automatic: nobody decides, so nobody can take advantage of it.",
  "🚫 Si un match n'est toujours pas terminé <b>{a} h</b> après son coup d'envoi prévu, il est <b>automatiquement considéré comme annulé</b> : les mises sont rendues et le bonus qui le visait aussi. Aucune intervention nécessaire.":"🚫 If a match still isn't finished <b>{a} h</b> after its scheduled kick-off, it is <b>automatically treated as cancelled</b>: stakes are refunded, and so is the bonus that targeted it. No action needed.",
  "⚠️ <b>Conséquence assumée</b> : un match <b>reporté puis rejoué plus tard</b> (météo, terrain impraticable, décision de la fédération…) est lui aussi traité comme annulé. Il <b>ne comptera pas</b> dans la journée, même s'il finit par se jouer — le championnat n'attend pas.":"⚠️ <b>A deliberate trade-off</b>: a match that is <b>postponed and replayed later</b> (weather, unplayable pitch, federation decision…) is also treated as cancelled. It <b>will not count</b> for that day, even if it eventually gets played — the championship doesn't wait.",
  "🚫 Match non terminé <b>{a} h</b> après l'heure prévue (annulé, reporté, abandonné) : <b>mise rendue</b> et bonus rendu. Il ne compte pas, <b>même s'il est rejoué plus tard</b>.":"🚫 A match not finished <b>{a} h</b> after its scheduled time (cancelled, postponed, abandoned): <b>stake refunded</b> and bonus given back. It doesn't count, <b>even if it's replayed later</b>.",
  "Clôturer les inscriptions ? Plus personne ne pourra rejoindre, et la préparation (vote + enchères sur les bonus) commencera.":"Close registrations? Nobody else will be able to join, and the preparation (vote + bonus auction) will begin.",
  "Clôturer les inscriptions ? Plus personne ne pourra rejoindre. Vous êtes en nombre impair : un 🤖 joueur IA sera ajouté pour équilibrer, puis la préparation commencera.":"Close registrations? Nobody else will be able to join. You're an odd number: a 🤖 AI player will be added to balance things out, then the preparation will begin.",
  "🔄 Nouvelle version disponible.":"🔄 A new version is available.", "Recharger":"Reload",
  "(option premium — à souscrire ; paiement désactivé pendant les tests)":"(premium option — subscription required; payment disabled during testing)",
  "(le 🤖 joueur IA est une option premium — à souscrire ; paiement désactivé pendant les tests)":"(the 🤖 AI player is a premium option — subscription required; payment disabled during testing)",
  "<i>Le jeu <b>complet</b> des cartes (mode Complet, avec les cartes d'interaction) est une option premium — à souscrire ; paiement désactivé pendant les tests.</i>":"<i>The <b>full</b> card set (Full mode, with the interaction cards) is a premium option — subscription required; payment disabled during testing.</i>",
  "Toutes les options premium du jeu. <b>Souscris à celles qui t'intéressent</b> — paiement désactivé pendant la phase de test.":"All the game's premium options. <b>Subscribe to the ones you want</b> — payment disabled during the test phase.",
  // --- Stats perso cross-ligue ---
  "Ton dossier complet, toutes tes ligues.":"Your complete file, across all your leagues.",
  // --- Dossier détaillé de l'option 📊 (v7.00) ---
  "Ton dossier complet, toutes tes ligues. Touche une ligne pour savoir ce que le chiffre veut dire.":"Your complete file, across all your leagues. Tap any line to find out what the number means.",
  "Ligues comptées":"Leagues counted", "Fermée avant terme":"Closed before the end", "solo vs IA":"solo vs AI",
  "{a} fermée(s) avant terme — hors totaux":"{a} closed before the end — excluded from totals",
  "{a} en solo face à l'IA — paris comptés, sans titre":"{a} solo vs the AI — bets counted, no title",
  "Une ligue <b>fermée avant son terme</b> ne compte dans aucun total : son classement final n'a pas de sens, l'inclure fausserait tout. Elle reste consultable plus bas. Une ligue <b>en cours</b>, elle, compte normalement.<br><br>Dans une ligue <b>en solo face à l'IA</b>, tes paris comptent (ROI, réussite, records) — c'étaient de vrais pronos — mais finir 1er contre un robot n'ajoute <b>ni titre ni podium</b>.":"A league <b>closed before its end</b> counts towards nothing: its final standings are meaningless, and including them would skew everything. It stays viewable below. A league <b>in progress</b> does count normally.<br><br>In a <b>solo league against the AI</b>, your bets count (ROI, hit rate, records) — they were real picks — but finishing 1st against a bot adds <b>no title and no podium</b>.",
  "Tes coups":"Your standout bets", "Cote moyenne gagnée":"Average winning odds",

  "Points par journée":"Points per matchday", "Évolution du ROI":"ROI over time",

  "Moyenne des {a} autres joueurs de tes ligues (joueur IA exclu).":"Average of the {a} other players in your leagues (AI player excluded).",
  "Rendement du Capitaine":"Captain's return", "Apporté par le doublement":"Added by the doubling",
  "sur {a} journées avec Capitaine":"across {a} matchdays with a Captain",
  "Bonus les plus rentables":"Most profitable bonuses",
  "Régularité":"Consistency", "Journées dans le vert":"Matchdays in the green",
  "Plus longue série de duels gagnés":"Longest run of duels won", "Par sport":"By sport",
  // Fiches d'explication (STAT_INFO) — passent par t(variable), INVISIBLES pour check-i18n :
  // toute nouvelle fiche doit voir sa clé EN ajoutée ici À LA MAIN, sinon aucune alerte.
  "La part de tes pronos qui sont tombés justes. Utile, mais insuffisant seul : on peut gagner souvent en jouant des favoris et perdre de l'argent quand même.":"The share of your picks that came in. Useful, but not enough on its own: you can win often on favourites and still lose money.",
  "Ce que rapporte chaque euro misé : résultat net ÷ total misé. <b>+20 %</b> = 20 centimes gagnés par euro joué. Au-dessus de 0 tu gagnes de l'argent, en dessous tu en perds — c'est la mesure la plus honnête de ton niveau.":"What each euro staked returns: net result ÷ total staked. <b>+20%</b> = 20 cents earned per euro played. Above 0 you're making money, below you're losing it — the most honest measure of your level.",
  "Tes gains moins tes mises, sur toutes tes ligues. Il dépend de combien tu joues : un joueur prudent peut être meilleur avec un net plus petit — regarde le ROI pour comparer.":"Your winnings minus your stakes, across all leagues. It depends on how much you play: a cautious player can be better with a smaller net — use ROI to compare.",
  "La cote moyenne de tes pronos <b>gagnants</b>. Proche de 1,50 : tu gagnes sur du solide. Au-dessus de 2,50 : tu gagnes sur du risqué, plus rare mais plus payant.":"The average odds of your <b>winning</b> picks. Near 1.50: you win on safe bets. Above 2.50: you win on risky ones — rarer, but it pays more.",
  "Le plus gros coup de ta carrière, en cote. C'est le trophée de la table — celui qu'on ressort à chaque repas.":"The biggest hit of your career, in odds. The table's trophy — the one you bring up at every dinner.",
  "Le gain d'un <b>seul</b> prono : mise × (cote − 1), doublé s'il était Capitaine. À ne pas confondre avec ta meilleure journée, qui additionne tous tes paris du jour.":"The gain from a <b>single</b> pick: stake × (odds − 1), doubled if it was your Captain. Not to be confused with your best matchday, which adds up every bet that day.",
  "Le montant le plus élevé que tu aies posé sur un seul match. Le pari se joue au <b>résultat net</b> : miser gros n'est pas gagner, ça amplifie juste les deux sens.":"The largest amount you've put on a single match. Duels are settled on <b>net result</b>: betting big isn't winning, it just amplifies both directions.",
  "Ta moyenne de points de championnat par journée jouée. Repère : <b>1,5</b> c'est correct, <b>2</b> ou plus c'est le rythme d'un vainqueur.":"Your average championship points per matchday played. Benchmark: <b>1.5</b> is decent, <b>2</b> or more is winner's pace.",
  "Ta rentabilité cumulée, journée après journée, toutes ligues confondues. Une courbe qui monte = tu progresses ; en dents de scie = tu joues gros et irrégulier. Les paris n'ayant pas de date en base, l'axe suit <b>l'ordre des journées jouées</b>, pas le calendrier.":"Your cumulative return, matchday after matchday, across all leagues. A rising curve = you're improving; a jagged one = you play big and erratically. Bets carry no date in the database, so the axis follows <b>the order matchdays were played</b>, not the calendar.",
  "Ta réussite selon le type de match : <b>favoris</b> (cote sous 1,80), <b>équilibrés</b>, <b>outsiders</b> (au-dessus de 3,00). Elle baisse forcément vers les outsiders — ce qui compte, c'est de savoir où TU es le plus à l'aise.":"Your success rate by match type: <b>favourites</b> (odds under 1.80), <b>even</b>, <b>underdogs</b> (above 3.00). It necessarily drops towards underdogs — what matters is knowing where YOU are strongest.",
  "Les mêmes calculs pour les autres joueurs de tes ligues (le joueur IA exclu). C'est le seul vrai repère : un ROI se juge par rapport à sa table, pas dans l'absolu.":"The same figures for the other players in your leagues (AI player excluded). The only real benchmark: a ROI is judged against your table, not in the abstract.",
  "Ce que le doublement t'a rapporté <b>en plus</b>, ou coûté. Un chiffre négatif ne condamne pas la mécanique : il dit que tu doubles trop souvent sur des paris incertains.":"What the doubling earned you <b>on top</b>, or cost you. A negative figure doesn't condemn the mechanic: it says you double too often on shaky picks.",
  "Le gain réel de chaque bonus : ton résultat AVEC la carte moins ce qu'il aurait été SANS elle. ⚠️ À ne pas confondre avec le bonus le plus <b>joué</b> — le plus joué est rarement le plus rentable.":"Each bonus's real gain: your result WITH the card minus what it would have been WITHOUT it. ⚠️ Not to be confused with the most <b>played</b> bonus — the most played is rarely the most profitable.",
  "Le nombre de journées où tu finis dans le vert, et ta plus longue série de duels gagnés. Deux joueurs au même ROI n'ont pas la même régularité — et c'est elle qui gagne les championnats.":"How many matchdays you finish in the green, and your longest run of duels won. Two players on the same ROI don't have the same consistency — and consistency is what wins championships.",
  "Ta réussite sport par sport. N'a de sens qu'en <b>données réelles</b> : en matchs simulés, les rencontres sont tirées au hasard.":"Your success rate sport by sport. Only meaningful with <b>real data</b>: in simulated matches, fixtures are drawn at random.",

  "Elle peut rapporter gros comme se retourner contre toi.":"It can pay off big — or backfire on you.",
  "elle peut rapporter gros… comme se retourner contre toi. Pour ceux qui sentent bien leur journée et assument leurs pronos.":"it can pay off big… or backfire on you. For those who trust their gut and stand by their picks.",
  "Les cartes <b>🎯 à cible</b> demandent de désigner un match au moment de parier. <b>💪 x/5</b> indique la force <i>indicative</i> d'une carte, c'est-à-dire ce qu'elle peut te <b>rapporter</b>. À côté, une seconde pastille dit ce qu'elle peut te <b>coûter</b> : <b>🟢 Sans risque</b> (au pire elle ne sert à rien, elle ne peut jamais se retourner contre toi) ou <b>⚔️ Double tranchant</b> (elle peut rapporter gros… comme avantager ton adversaire, ou amplifier tes pertes). Les secondes ne sont pas à éviter — ce sont les cartes des joueurs qui assument leurs pronos.":"<b>🎯 Targeted</b> cards require picking a match when you bet. <b>💪 x/5</b> shows a card's <i>indicative</i> strength — what it can <b>bring you</b>. Next to it, a second badge shows what it can <b>cost you</b>: <b>🟢 No downside</b> (at worst it does nothing, it can never backfire) or <b>⚔️ Double-edged</b> (it can pay off big… or help your opponent, or amplify your losses). The latter aren't to be avoided — they're the cards for players who stand by their picks.",

  "En cours de championnat, tu peux proposer une somme à un adversaire pour lui <b>racheter une carte</b> qu'il a encore en main. Il accepte ou refuse ; s'il accepte, la carte est à toi et le montant lui est versé. Possible tant que tu n'as pas validé ton pari du jour, en gardant au moins <b>{a} €</b> pour continuer à parier.":"During the championship, you can offer an opponent a sum to <b>buy back a card</b> they still hold. They accept or decline; if they accept, the card is yours and the amount is paid to them. Possible as long as you haven't locked your bet for the day, keeping at least <b>€{a}</b> to keep betting.",
  "En cours de championnat, tu peux <b>racheter une carte bonus</b> à un adversaire, contre une somme de ton capital (monnaie virtuelle).":"During the championship, you can <b>buy back a bonus card</b> from an opponent, for a sum of your (virtual) capital.",
  "Tu proposes un prix ; l'autre est <b>libre d'accepter ou de refuser</b>. S'il accepte, la carte passe dans ta main et le montant lui est <b>transféré</b> — rien n'est créé, rien ne disparaît.":"You propose a price; the other player is <b>free to accept or decline</b>. If they accept, the card moves to your hand and the amount is <b>transferred</b> to them — nothing is created, nothing disappears.",
  "On ne rachète que des cartes <b>encore en main</b> : jamais une carte déjà jouée, ni une carte engagée pour la journée en cours.":"Only cards <b>still in hand</b> can be bought back: never an already-played card, nor a card committed for the current day.",
  "Tu peux aussi <b>vendre</b> une de tes cartes à un joueur (il paie, il la reçoit) — pratique pour te refaire du capital.":"You can also <b>sell</b> one of your cards to a player (they pay, they receive it) — handy to rebuild your capital.",
  "⏳ <b>Quand ?</b> Un échange n'est possible <b>qu'entre deux journées</b> : tant que <b>ni le vendeur ni l'acheteur</b> n'a validé son pari du jour. Dès qu'un pari est verrouillé, les échanges le concernant sont gelés jusqu'à la résolution (ça protège la règle du capital jamais négatif et évite qu'une carte soit vendue et jouée en même temps).":"⏳ <b>When?</b> A trade is only possible <b>between days</b>: as long as <b>neither the seller nor the buyer</b> has locked their bet for the day. Once a bet is locked, trades involving that player are frozen until resolution (this protects the never-negative-capital rule and prevents a card being sold and played at the same time).",
  "On n'échange que des cartes <b>encore en main</b>, et l'acheteur doit garder au moins <b>{a} €</b> pour pouvoir miser.":"Only cards <b>still in hand</b> can be traded, and the buyer must keep at least <b>€{a}</b> to be able to bet.",
  "Tu ne peux pas racheter <b>tant que ton pari du jour est validé</b> (cela protège la règle du capital jamais négatif), et le prix doit te laisser au moins <b>{a} €</b> pour pouvoir encore miser.":"You can't buy back <b>while your bet for the day is locked</b> (this protects the never-negative-capital rule), and the price must leave you at least <b>€{a}</b> to keep betting.",
  "Tu es <b>prévenu</b> quand ton offre est acceptée ou refusée, et le bouton 🤝 signale les offres qu'on t'a faites.":"You are <b>notified</b> when your offer is accepted or declined, and the 🤝 button flags the offers made to you.",
  "👉 Touche un joueur pour voir ses bonus (restants et utilisés).":"👉 Tap a player to see their bonuses (remaining and used).",

  "Sangsue":"Leech", "Lâche ta gourmette Popeye":"Show Me the Money", "Si l'adversaire finit bénéficiaire, tu lui siphonnes 15 % de son bénéfice (il le perd, tu l'empoches).":"If the opponent ends in profit, you siphon 15% of their profit (they lose it, you pocket it).",
  "Parachute":"Parachute", "Filet de sécurité : si ta journée est négative, 30 % de ta perte est amortie.":"Safety net: if your day is negative, 30% of your loss is cushioned.",
  "Joker":"Joker", "Un 2ᵉ pari devient Capitaine (gains et pertes doublés) en plus du tien.":"A 2nd bet becomes Captain (gains and losses doubled) on top of yours.",
  "Voleur":"Thief", "Tu prends le bonus que ton adversaire a joué ce jour-là : il ne s'applique pas, et la carte passe dans ta main pour une prochaine journée. ⚠️ Si ton adversaire ne joue aucun bonus ce jour-là, le Voleur ne sert à rien et est perdu. Sans intérêt non plus à la dernière journée : tu n'auras plus l'occasion de jouer ta prise.":"You take the bonus your opponent played that day: it doesn't apply, and the card moves into your hand for a future matchday. ⚠️ If your opponent plays no bonus that day, the Thief is wasted and lost. Pointless too on the last matchday: you'll never get to play what you took.",
  "Clone":"Clone", "Tu rejoues à l'identique le bonus que ton adversaire a joué ce jour-là — sur le même match s'il était ciblé. ⚠️ Si ton adversaire ne joue aucun bonus ce jour-là (ou joue le 🥷 Voleur, ou 📈 Investisseur), le Clone ne sert à rien et est perdu.":"You replay the exact bonus your opponent played that day — on the same match if it was targeted. ⚠️ If your opponent plays no bonus that day (or plays 🥷 Thief, or 📈 Investor), the Clone is wasted and lost.",
  "🥷 Bonus pris à {a} : son {b} n'a pas été appliqué, et la carte est passée dans ta main.":"🥷 Bonus taken from {a}: their {b} was not applied, and the card moved into your hand.",
  "🥷 Rien à prendre : ton adversaire n'a joué aucun bonus ce jour-là.":"🥷 Nothing to take: your opponent played no bonus that day.",

  "🧬 Rien à copier : ton adversaire n'a joué aucun bonus clonable ce jour-là.":"🧬 Nothing to copy: your opponent played no clonable bonus that day.",

  "🥷 Bonus pris à l'adversaire : sa carte n'a pas joué et t'est revenue en main.":"🥷 Bonus taken from the opponent: their card didn't play and came into your hand.",

  "🎪 <b>Le showman :</b> <b>{mb}€</b> sur {cl} — {N} aime le spectacle.":"🎪 <b>The showman:</b> <b>{mb}€</b> on {cl} — {N} loves a show.",

  "🐋 <b>La baleine :</b> {N} — <b>{mb}€</b> sur {cl}. Le marché a tremblé.":"🐋 <b>The whale:</b> {N} — <b>{mb}€</b> on {cl}. The market shook.",
  "🎓 <b>Le calculateur :</b> {b} enchère{s}, <b>{w}</b> réussite{w1}. {N} a fait ses devoirs.":"🎓 <b>The calculator:</b> {b} bid{s}, <b>{w}</b> hit{w1}. {N} did their homework.",
  "🎼 <b>Le maestro :</b> {N} a orchestré ses enchères — <b>{w}</b> bonus au tableau. Du grand art.":"🎼 <b>The maestro:</b> {N} orchestrated their bids — <b>{w}</b> bonuses on the board. A masterclass.",
  "🕵️ <b>L'opportuniste :</b> {N} a flairé les bons coups : <b>{w}</b> bonus sur {b} tenté{s}.":"🕵️ <b>The opportunist:</b> {N} sniffed out the good ones: <b>{w}</b> bonuses from {b} attempt{s}.",
